  basic:()=>`<p>바둑은 흑과 백이 <b>번갈아 한 수씩</b> 두며 더 넓은 집을 차지하는 게임입니다. 흑이 먼저 둡니다.</p><p>돌은 칸 안이 아니라 <b>선이 만나는 점(교차점)</b>에 놓고, 한 번 놓은 돌은 움직이지 않습니다.</p>`,
  task:()=>`오른쪽 판의 교차점을 눌러 돌을 <b>5개</b> 놓아 보세요. (놓은 돌 ${Math.min(5,tutPrac('free').cnt)}/5)`,
  det:()=>li('<b>이기는 방법</b>: 더 이상 둘 곳이 없다고 판단하면 판을 끝내고 점수를 셉니다. 점수는 <b>내 집(내 돌로 둘러싼 빈 점) + 사석(잡은 돌)</b>이고, 흑이 먼저 두는 대신 백이 덤을 받습니다. 점수가 더 많은 쪽이 이깁니다.','<b>판 크기</b>: 실제 대국은 9줄·13줄·19줄 판에서 둡니다. 처음이라면 가장 빨리 끝나는 9줄을 추천합니다. 이 연습판은 규칙을 보기 쉽도록 5줄로 줄였습니다.','<b>상대 돌은 잡을 수 있습니다</b>: 돌은 한 번 놓으면 옮길 수 없지만, 상대 돌을 둘러싸 숨구멍(활로)을 모두 막으면 그 돌을 판에서 걷어낼 수 있습니다. 다음 단계부터 하나씩 연습합니다.','<b>증강</b>: 이 사이트에서는 기본 규칙 위에 「증강」 카드가 더해집니다. 기본 규칙을 익힌 뒤 「증강 튜토리얼」에서 배웁니다.'),
  view:()=>pb('free','교차점(선이 만나는 곳)을 눌러 돌을 놓아 보세요. 흑 → 백 순서로 번갈아 놓입니다.')},
 {k:'coord',t:'바둑판 읽기: 좌표',
  basic:()=>`<p>가로줄은 <b>알파벳</b>(A, B, C…), 세로줄은 <b>숫자</b>(1, 2, 3…)로 읽습니다. 글자 <b>I는 쓰지 않아서</b> H 다음이 J입니다.</p><p>가운데 점은 <b>E5</b>입니다. 수를 말할 때는 「흑 E5」처럼 좌표로 말합니다.</p>`,
  task:()=>{const cs=UI.tut.cs||{r:0};return cs.r>=COORD_T.length?`3개 좌표를 모두 찾았습니다!`:`9줄판에서 <b class="coord">${COORD_T[cs.r]}</b>를 찾아 눌러 보세요. (${cs.r}/${COORD_T.length})`},
  det:()=>li('가로 글자는 왼쪽부터 A B C D E F G H J(9줄판 기준), 세로 숫자는 <b>아래쪽이 1</b>입니다. 13줄·19줄판도 읽는 법은 같고 글자만 N, T까지 늘어납니다(I는 계속 건너뜁니다).','판 위의 작은 검은 점은 <b>화점</b>입니다. 위치를 찾는 기준점이고, 접바둑에서 흑이 미리 돌을 놓는 자리이기도 합니다. 9줄판에는 가운데를 포함해 5개 있습니다.','기보(대국 기록), 소라고동·훈수의 추천수 안내, 접바둑 안내 등 이 사이트의 모든 곳에서 같은 좌표를 씁니다.','좌표를 찾기 어려우면 판 가장자리의 글자와 숫자를 손가락(마우스)으로 따라가 서로 만나는 점을 찾으세요.'),
  view:()=>{const cs=UI.tut.cs||{found:[]},st=tutSt(9,Array(9).fill('.........'));cs.found.forEach(i=>{st.board[i]=1});
    return{board:boardSvg(st,{live:(cs.r||0)<COORD_T.length,act:'tutCoord'}),msg:UI.tut.msg||'가로 글자(판 아래)와 세로 숫자(판 왼쪽)를 따라가 보세요.',ctl:`<div class="bar"><button class="btn" data-act="tutReset">다시 해보기</button></div>`}}},
 {k:'lib',t:'활로: 돌의 숨구멍',
  basic:()=>`<p>돌에 가로·세로로 붙은 <b>빈 점</b>을 <b>활로</b>라고 합니다. 돌의 숨구멍입니다. 대각선은 활로가 아닙니다.</p><p>가운데 쪽 돌은 <b>4개</b>, 변은 <b>3개</b>, 귀(구석)는 <b>2개</b>입니다.</p>`,
  task:()=>`판 위의 검은 돌 세 개를 하나씩 눌러 활로를 확인해 보세요. (${Object.keys((UI.tut.lib||{seen:{}}).seen).length}/3)`,
  det:()=>li('점선 원이 활로입니다. 활로가 많을수록 돌이 안전하고, 활로가 하나만 남은 상태를 <b>단수</b>(곧 잡힐 수 있는 상태)라고 합니다.','상대 돌이 활로를 막으면 막힌 자리는 활로에서 빠집니다. 활로가 <b>0</b>이 되면 그 돌은 판에서 사라지고, 잡은 쪽이 사석으로 얻습니다.','같은 색 돌이 이어지면 한 덩어리가 되어 활로를 합쳐서 씁니다(5단계). 그래서 돌을 이어 두면 잡히기 어렵습니다.','돌을 놓기 전에 「내 활로는 몇 개인가, 상대 활로는 몇 개인가」를 세어 보는 것이 가장 기본적인 습관입니다.'),
  view:()=>{const L=UI.tut.lib||{sel:null},st=tutSt(5,LIB_ROWS),tg=new Set();if(L.sel!=null)nb(5,L.sel).forEach(k=>{if(st.board[k]===0)tg.add(k)});
    return{board:boardSvg(st,{live:true,act:'tutLib',targets:tg,sel:L.sel}),msg:UI.tut.msg||'검은 돌을 눌러 보세요. 점선 원으로 활로가 표시됩니다.',ctl:`<div class="bar"><button class="btn" data-act="tutReset">다시 해보기</button></div>`}}},
 {k:'cap1',t:'따내기 ①: 단수와 따내기',
  basic:()=>`<p>활로가 하나 남은 상태를 <b>단수</b>라고 합니다. 단수인 돌의 마지막 활로를 막으면 그 돌을 <b>따냅니다</b>(판에서 걷어냅니다).</p><p>따낸 돌은 <b>사석</b>이 되어 내 점수가 됩니다.</p>`,
  task:()=>`흑으로 백 돌의 마지막 활로를 막아 따내 보세요.`,
  det:()=>li('연습판의 백 돌은 위·왼쪽·오른쪽이 흑 돌에 막혀 있고 아래 한 곳만 비어 있습니다. 그 한 곳이 마지막 활로입니다.','마지막 활로에 두는 순간 백 돌의 활로가 0이 되어 곧바로 판에서 사라집니다. 따낸 자리는 빈 점이 되어 내 돌의 활로가 됩니다.','사석은 1개당 1점으로 계산됩니다(증강으로 달라질 수 있습니다). 잡힌 돌의 주인에게는 그만큼 불리합니다.','단수가 되었다고 늘 따낼 수 있는 것은 아닙니다. 상대가 돌을 이어 활로를 늘리면 도망갈 수 있습니다.'),
  view:()=>pb('cap1','교차점을 눌러 백 돌의 마지막 활로를 막아 보세요.')},
 {k:'cap2',t:'이어진 돌은 한 덩어리',
  basic:()=>`<p>같은 색 돌이 <b>가로·세로로 붙어 있으면</b> 한 덩어리가 되어 활로를 함께 씁니다. 덩어리는 활로가 모두 막히면 <b>통째로</b> 잡힙니다.</p>`,
  task:()=>`백 두 점이 한 덩어리입니다. 남은 활로 한 곳을 막아 한꺼번에 따내 보세요.`,
  det:()=>li('대각선으로만 닿은 돌은 이어진 것이 아닙니다.','덩어리의 활로는 속한 모든 돌의 활로를 합친 것(겹치는 자리는 한 번만)입니다. 덩어리가 커질수록 활로가 많아져 잡기 어려워지지만, 한번 포위당하면 한꺼번에 많이 잡히는 위험도 있습니다.','성벽 같은 일부 증강은 돌 하나가 아니라 덩어리 단위로 작동합니다. 증강 튜토리얼에서 다시 나옵니다.'),
  view:()=>pb('cap2','백 두 점의 남은 활로를 찾아 눌러 보세요.')},
 {k:'noplay',t:'둘 수 없는 자리',
  basic:()=>`<p>돌을 놓았을 때 <b>내 돌의 활로가 0</b>이 되면 그 자리에는 둘 수 없습니다.</p><p>단, 그 수로 <b>상대 돌을 따낸다면</b> 활로가 생기므로 둘 수 있습니다.</p>`,
  task:()=>`가운데 빈 점(C3)에 흑을 두어 보세요. 어떻게 될까요?`,
  det:()=>li('가운데 빈 점은 백 돌 네 개에 둘러싸여 있습니다. 흑이 두면 흑의 활로가 0이고 백 돌도 따낼 수 없어서 막힙니다. 이런 수를 <b>자충수</b>라고 부르며 규칙상 둘 수 없습니다.','같은 모양이라도 둘러싼 백 돌이 단수(마지막 활로가 바로 이 점)라면 둘 수 있습니다. 그 돌을 먼저 따내면서 활로가 생기기 때문입니다.','이 규칙 덕분에 상대가 만든 집 안에는 함부로 들어갈 수 없습니다. 8단계의 「눈」 원리와 이어집니다.'),
  view:()=>pb('noplay','가운데 빈 점(C3)을 눌러 보세요. 어떻게 될까요?')},
 {k:'ko',t:'패: 끝없는 되따내기 금지',
  basic:()=>`<p>한 점씩 계속 서로 따내면 끝나지 않으므로, <b>상대가 방금 따낸 자리에 바로 되따내는 것은 금지</b>입니다. 이것을 <b>패</b>라고 합니다.</p><p>다른 곳에 한 수 둔 뒤에는 다시 따낼 수 있습니다.</p>`,
  task:()=>`① 흑으로 C4를 눌러 백 한 점을 따냅니다. ② 이어서 백으로 방금 따낸 자리(B4)에 되따내 보세요.`,
  det:()=>li('패는 「한 점을 따내고, 상대가 곧바로 되따내면 다시 원래 모양이 되는」 특별한 모양에서만 생깁니다.','패가 걸리면 상대는 바로 되따낼 수 없으니, 다른 곳에 급한 수를 두어 내 응답을 요구하기도 합니다. 내가 응하면 다음 차례에 되따낼 수 있습니다. 이런 주고받기를 <b>패싸움</b>이라고 합니다.','이 사이트는 직전에 한 점을 따낸 자리만 막는 간단한 규칙을 씁니다. 일부 증강을 쓰면 패 금지가 풀립니다.'),
  view:()=>pb('ko','먼저 흑으로 C4를 눌러 백 한 점을 따내세요.')},
 {k:'eyes',t:'두 눈이면 살아요',
  basic:()=>`<p>덩어리 안에 상대가 들어올 수 없는 빈 점이 <b>두 군데</b> 있으면 그 덩어리는 절대 잡히지 않습니다. 이 빈 점을 <b>눈</b>이라고 하고, 눈이 둘이면 <b>산 돌</b>입니다.</p>`,
  task:()=>`흑으로 백 돌 안쪽의 빈 점 두 곳(A5, C5)에 차례로 두어 보세요.`,
  det:()=>li('눈 하나에 흑이 두면 흑의 활로가 0이라 둘 수 없습니다(6단계와 같은 이유). 눈이 둘이라 마지막 활로 두 곳을 한꺼번에 막을 수 없으니 백은 영원히 안전합니다.','눈이 하나뿐인 덩어리는 다른 활로가 모두 막힌 뒤 눈 속에 둘 수 있게 되어 결국 잡힙니다. 그래서 바둑에서는 「두 집을 내야 산다」고 합니다.','실전에서는 눈 모양을 만들기 위해 돌을 이어 두거나, 상대 돌의 눈을 빼앗는 수가 승부를 가릅니다.'),
  view:()=>pb('eyes','흑으로 백 돌 안쪽의 빈 점 두 곳(A5, C5)을 눌러 보세요.')},
 {k:'terr',t:'집과 점수 세기',
  basic:()=>`<p>돌로 둘러싼 <b>빈 점</b>이 그 사람의 <b>집</b>입니다. 이 사이트는 <b>집 + 사석</b>으로 셉니다.</p><p>흑이 먼저 두는 대가로 <b>백은 덤 6.5점</b>을 받습니다. 반집(.5)이 있어 무승부가 없습니다.</p>`,
  task:()=>{const T=UI.tut.tr||{};return `판의 왼쪽 빈 점, 오른쪽 빈 점, 가운데 줄 빈 점을 눌러 누구의 집인지 확인해 보세요. (${Object.keys(T).length}/3)`},
  det:()=>li('작은 검은 네모는 흑 집, 작은 흰 네모는 백 집입니다. 가운데 줄처럼 흑·백 돌에 모두 닿아 있는 빈 점은 어느 쪽 집도 아닌 <b>공배</b>라 세지 않습니다.','<b>사석</b>은 상대에게서 잡아낸 돌과, 끝난 뒤 상대 집 안에 남은 죽은 돌입니다.','예) 흑 14집 + 사석 3 = 17점, 백 14집 + 사석 1 + 덤 6.5 = 21.5점 → <b>백 4.5점 승</b>.','증강이 있으면 증강 점수 보너스(포로 보상 등)가 점수표에 항목별로 더해집니다.'),
  view:()=>{const T=UI.tut.tr||{},n=7,st=tutSt(7,TERR_ROWS),terr=new Int8Array(49);
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const g=x<2?1:x>4?2:x===3?NEUT:0;if(g&&T[g])terr[y*n+x]=g}
    const tab=T[1]&&T[2]?`<table class="tb tsum"><tr><th></th><th>집</th><th>사석</th><th>덤</th><th>합계</th></tr><tr><td><span class="stn s1"></span> 흑</td><td>14</td><td>3</td><td>0</td><td><b>17</b></td></tr><tr><td><span class="stn s2"></span> 백</td><td>14</td><td>1</td><td>6.5</td><td><b>21.5</b></td></tr></table><p class="sub">백 4.5점 승 (예시)</p>`:'';
    return{board:boardSvg(st,{live:true,act:'tutTerr',terr}),msg:UI.tut.msg||'빈 점을 눌러 누구의 집인지 확인해 보세요.',ctl:tab+`<div class="bar"><button class="btn" data-act="tutReset">다시 해보기</button></div>`}}},
 {k:'dead',t:'끝내기: 패스와 죽은 돌',
  basic:()=>`<p>더 둘 곳이 없으면 <b>패스</b>합니다. 두 사람이 연달아 패스하면 대국이 끝나고, 판 위의 <b>죽은 돌</b>을 가려 점수를 셉니다.</p>`,
  task:()=>`상대 집 안에 갇힌 돌 두 개를 눌러 죽은 돌(✕)로 표시해 보세요. (${DEAD_AT.filter(k=>(UI.tut.dk||{})[k]).length}/2)`,
  det:()=>li('끝나면 <b>계가 AI</b>가 판을 읽어 이미 죽은 돌을 ✕로 표시합니다. 틀렸다면 돌을 눌러 고친 뒤 「계가 확정」을 누릅니다.','상대 집 한가운데 갇혀 살아날 수 없는 돌이 죽은 돌입니다. 판에서 걷어내지 않고 표시만 해서 점수로 세며, 죽은 돌은 상대의 사석이 됩니다.','한쪽이 「합의 종국」을 제안해 상대가 수락해도 같은 계가 단계로 넘어갑니다.'),
  view:()=>{const D=UI.tut.dk||{},n=7,st=tutSt(7,DEAD_ROWS),terr=new Int8Array(49);st.dead=DEAD_AT.filter(k=>D[k]);st.phase='dead';
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)terr[y*n+x]=x<2?1:x>4?2:x===3?NEUT:0;
    return{board:boardSvg(st,{live:true,act:'tutDead',terr}),msg:UI.tut.msg||'흑 집 안의 백 돌과 백 집 안의 흑 돌을 눌러 보세요.',ctl:`<div class="bar"><button class="btn" data-act="tutReset">다시 해보기</button></div>`}}},
 {k:'hcap',t:'호선과 접바둑',
  basic:()=>`<p><b>호선</b>은 실력이 비슷할 때 두는 방식으로, 흑이 먼저 두고 백이 덤 6.5점을 받습니다.</p><p><b>접바둑</b>은 실력 차이가 있을 때 약한 쪽이 흑을 잡고 화점에 돌을 <b>미리 놓고</b> 시작합니다.</p>`,
  task:()=>`아래 버튼으로 호선과 접바둑 점수를 바꿔 가며 돌 배치를 확인해 보세요. (${Object.keys((UI.tut.hc||{seen:{}}).seen).length}/3)`,
  det:()=>li('접바둑에서는 백이 먼저 두고 덤은 0.5점입니다(반집이 있어 무승부를 막기 위한 값입니다).','9줄판은 최대 5점, 13줄·19줄판은 최대 9점까지 고를 수 있습니다. 점수가 많을수록 흑이 유리합니다.','시작 화면에서 판 크기와 접바둑 점수를 정하고, 온라인 방에서는 호스트(방장)가 정합니다.','3·4인 개인전에서는 접바둑을 쓰지 않습니다.'),
  view:()=>{const H=UI.tut.hc||{h:0},st=tutSt(9,Array(9).fill('.........'));if(H.h)handicapPoints(9,H.h).forEach(i=>{st.board[i]=1});
    const chips=[0,2,3,4,5].map(h=>`<button class="chip sm" data-act="tutHc" data-arg="${h}" aria-pressed="${H.h===h}">${h?'접바둑 '+h+'점':'호선'}</button>`).join('');
    return{board:boardSvg(st,{}),msg:UI.tut.msg||'아래에서 호선·접바둑을 골라 보세요.',ctl:`<div class="row" role="group" aria-label="대국 방식">${chips}</div>`}}},
 {k:'ctl',t:'화면 조작',
  basic:()=>`<p>내 차례에 <b>교차점을 누르면</b> 돌이 놓입니다. 판 아래의 버튼으로 <b>패스</b>(차례 넘김), <b>합의 종국</b>(합의해 끝내기), <b>기권</b>(패배 인정)을 할 수 있습니다.</p>`,
  task:()=>`아래 세 버튼을 한 번씩 눌러 어떤 일이 일어나는지 확인해 보세요. (${Object.keys((UI.tut.ctl||{seen:{}}).seen).length}/3)`,
  det:()=>li('상대가 패스하거나 합의 종국을 제안하면 내 화면에 <b>큰 알림 창</b>이 떠서 바로 알 수 있습니다.','합의 종국은 상대가 수락해야 끝납니다. 거절하면 대국이 계속됩니다.','기권은 되돌릴 수 없으므로 한 번 더 눌러 확인합니다.','기보(대국 기록)에서 지난 수를 누르면 그 시점의 판을 볼 수 있고, 증강 「무르기」가 있다면 직전 차례로 되돌릴 수 있습니다.','이제 기본은 끝났습니다. 이 사이트의 특별한 재미인 <b>증강</b>은 다음 튜토리얼에서 배웁니다.'),
  view:()=>{const p=pb('ctl','판에 돌을 놓아 보고, 아래 버튼도 눌러 보세요.');
    p.ctl=`<div class="bar"><button class="btn" data-act="tutCtl" data-arg="pass">패스</button><button class="btn" data-act="tutCtl" data-arg="agree">합의 종국</button><button class="btn" data-act="tutCtl" data-arg="resign">기권</button><button class="btn" data-act="tutReset">다시 해보기</button></div>`;return p},
  last:`<button class="btn pri" data-act="tutaug">증강 튜토리얼 시작</button>`}
];

const TUT_AUG=[
 {k:'a1',t:'증강이란? 패시브와 액티브',
  basic:()=>`<p>증강은 대국에 특수한 능력을 주는 카드입니다.</p><p><b>패시브</b>는 얻는 즉시 <b>자동으로</b> 적용되고, <b>액티브</b>는 내 차례에 「사용」을 눌러 <b>직접 발동</b>합니다. 액티브는 대부분 1회만 쓸 수 있습니다.</p>`,
  extra:()=>miniList(['prize','undo']),
  task:()=>{const a=UI.tut.a1||{};return `백 돌을 따내 패시브(포로 보상)가 점수를 올리는 것을 보고, 「무르기 사용」으로 되돌려 보세요. (${(a.cap?1:0)+(a.undo?1:0)}/2)`},
  det:()=>li('패시브 예: <b>포로 보상</b>은 사석을 딸 때마다, <b>부동산 투자자</b>는 집이 클수록 점수를 더해 줍니다. 결과 화면 점수표에 증강 보너스가 항목별로 나옵니다.','액티브 예: <b>무르기·저격·도약</b>처럼 사용 시점을 내가 고릅니다. 카드의 「상세설명」에서 정확한 조건과 수치를 볼 수 있고, 수치는 판 크기에 따라 달라집니다.','액티브는 사용하면 남은 횟수가 줄어듭니다. 이름 옆 「차례 소모」 표시가 있으면 쓰는 순간 내 차례가 끝납니다.','방에서만 등장하는 증강(안개·눈뽕 등)에는 「방 전용」 표시가 붙습니다.'),
  view:()=>{const pr=tutPrac('acap');
    return{board:boardSvg(pr,{live:true,act:'tutPt',gh:pr.turn}),msg:UI.tut.msg||'교차점을 눌러 백 돌의 마지막 활로를 막아 따내 보세요. (포로 보상을 가진 흑입니다)',ctl:`<div class="bar"><button class="btn act" data-act="tutA1Undo">무르기 사용</button><button class="btn" data-act="tutReset">다시 해보기</button></div>`}}},
 {k:'pick',t:'증강 고르기',
  basic:()=>`<p>대국을 시작하면 각자 <b>무작위 3장 중 1장</b>을 고릅니다. 3장에는 패시브와 액티브가 <b>최소 한 장씩</b> 들어갑니다.</p><p>이후 <b>20수가 지날 때마다</b> 새 증강을 하나씩 더 고르며, 가질 수 있는 증강은 <b>최대 5개</b>입니다. 이미 가진 증강은 다시 나오지 않습니다.</p>`,
  task:()=>`아래 카드 중 하나를 눌러 골라 보세요. (연습입니다)`,
  det:()=>li('고르기 전에 카드의 「상세설명」을 눌러 정확한 효과와 수치를 확인할 수 있습니다. 실제 대국의 선택 화면에도 같은 버튼이 있습니다.','판 크기에 따라 나오는 증강이 달라집니다. 일부 증강은 13줄·19줄 전용이고, 일부는 온라인 방에서만 나옵니다.','「지식」 증강을 가지면 이후 선택지가 3개가 아니라 5개 나옵니다.','고른 증강은 내 카드 목록(칩)에 쌓이고, 액티브는 칩의 「사용」 버튼으로 발동합니다.'),
  view:()=>{const pk=UI.tut.picked,chips=['prize'].concat(pk?[pk]:[]).map(id=>{const a=AUG[id];return `<span class="achip ${a.look}"><span class="ainfo" style="cursor:default"><span class="seal mini ${a.look}" aria-hidden="true">${a.glyph}</span><b>${a.name}</b></span>${a.type==='active'?'<span class="ause" style="cursor:default">사용</span>':''}</span>`}).join('');
    return{panel:`<div class="simbox"><p class="simhd">증강 선택 (3장 중 1장)</p><div class="pks">${['estate','leap','nun'].map(id=>augMini(id,{act:'tutPickAug',sel:pk===id})).join('')}</div><div class="pc2 on"><div class="who"><span class="stn s1"></span><b>흑</b><span class="me">나</span><span class="pr">내 증강</span></div><div class="achips">${chips}</div></div></div>`,msg:UI.tut.msg||(pk?`<b>${AUG[pk].name}</b>을(를) 골랐습니다! 실제 대국에서는 이 증강이 위 칩처럼 내 목록에 쌓입니다.`:'카드를 눌러 하나를 고르면 이곳에 내 증강 목록이 만들어집니다.'),ctl:pk?`<div class="bar"><button class="btn" data-act="tutPickAug" data-arg="">다시 고르기</button></div>`:''}}},
 {k:'leap',t:'액티브 ①: 차례를 소모하는 증강',
  basic:()=>`<p>액티브는 「사용」을 누른 뒤 안내에 따라 판 위의 돌이나 자리를 고릅니다. 점선으로 표시된 곳이 고를 수 있는 곳입니다.</p><p>이름 옆에 <span class="tag turn">차례 소모</span>가 있으면 <b>쓰는 순간 내 차례가 끝납니다</b>.</p>`,
  task:()=>`도약을 사용해 내 돌을 3칸 이내의 빈 점으로 옮겨 보세요.`,
  det:()=>li('도약은 내 돌 1개를 가로+세로 합 N칸 이내(9줄 3칸, 13줄 4칸, 19줄 6칸)의 빈 점으로 옮깁니다. 이 연습에서는 3칸입니다.','차례 소모 증강은 쓴 뒤 착수 없이 차례가 상대에게 넘어갑니다. 성벽·전향·교체·귤·알까기가 같은 종류입니다.','사용 도중 마음이 바뀌면 「사용 취소」를 누르면 됩니다. 취소하면 횟수는 줄지 않습니다.'),
  view:()=>{const a=augPrac('leap');return{board:augBoard('leap'),msg:a.msg||'「도약 사용」을 눌러 보세요.',ctl:augBar('leap')}}},
 {k:'snipe',t:'액티브 ②: 차례를 유지하는 증강',
  basic:()=>`<p><b>무르기·이중 착수·저격·날일자</b>처럼 차례를 소모하지 않는 증강은 쓰고도 내 차례가 이어집니다. 쓴 뒤 바로 착수할 수 있습니다.</p>`,
  task:()=>`저격을 사용해 백 돌을 제거한 뒤, 같은 차례에 빈 곳에 착수까지 해 보세요.`,
  det:()=>li('<b>저격</b>은 상대 돌 1개를 제거합니다. 연결된 덩어리의 크기와 상관없이 돌 1개만 없애며, 성벽으로 보호 중인 돌은 제거할 수 없습니다(19줄판 전용).','<b>이중 착수</b>는 한 차례에 돌을 연달아 두 개 둡니다. 두 번째 돌은 첫 돌 바로 옆 8칸 안에만 놓을 수 있습니다(19줄판 전용).','<b>날일자</b>는 내 돌 기준 날일자 위치의 빈 점에 새 돌을 놓고, <b>무르기</b>는 직전 차례로 되돌립니다. 모두 차례를 소모하지 않습니다.'),
  view:()=>{const a=augPrac('snipe');return{board:augBoard('snipe'),msg:a.msg||'「저격 사용」을 눌러 보세요.',ctl:augBar('snipe')}}},
 {k:'score',t:'점수를 올리는 패시브',
  basic:()=>`<p>패시브는 종국 점수에 <b>보너스</b>를 더합니다. 예: 포로 보상(사석당), 부동산 투자자(집 1점당), 중원의 기세(중앙 돌), 눈목자(눈목자로 이어진 무리).</p>`,
  task:()=>`아래 점수표의 증강 칩을 켜고 꺼 보며 합계가 어떻게 달라지는지 확인해 보세요.`,
  det:()=>li('이 표는 9줄판 기준의 예시(집 18칸, 사석 4개, 중앙 돌 5개, 눈목자 무리 2개)입니다. 수치는 판 크기에 따라 달라집니다.','<b>두터운 덤</b>(+15점, 19줄 전용), <b>천원</b>(천원에 돌이 있으면 +20점), <b>오만</b>(상대에게 10점을 주고 내 집은 1.2배) 같은 증강도 점수에 영향을 줍니다.','눈에 잘 띄지 않아도 종반에 승패를 가를 수 있으니 「상세설명」으로 조건을 꼭 확인하세요.'),
  view:()=>{const s=UI.tut.sc||{},P=PR(9),g=[['집 18칸',18],['사석 4개',4]];let tot=22;
    const add={prize:['포로 보상',`사석 4 × ${fmt(P.prize)}`,4*P.prize],estate:['부동산 투자자',`집 18 × ${fmt(P.estate)}`,18*P.estate],center:['중원의 기세',`중앙 돌 5 × ${fmt(P.center.v)}`,5*P.center.v],nun:['눈목자',`무리 2 × ${fmt(P.nun)}`,2*P.nun]};
    let rows=`<tr><td>집 18칸</td><td>+18</td></tr><tr><td>사석 4개</td><td>+4</td></tr>`;
    SC_ROWS.forEach(([k])=>{if(s[k]){tot+=add[k][2];rows+=`<tr class="augrow"><td>${add[k][0]} <span class="sub">(${add[k][1]})</span></td><td>+${fmt(add[k][2])}</td></tr>`}});
    const chips=SC_ROWS.map(([k,nm])=>`<button class="chip sm" data-act="tutSc" data-arg="${k}" aria-pressed="${!!s[k]}">${nm}</button>`).join('');
    return{panel:`<div class="simbox"><p class="simhd">내 점수 (예시)</p><table class="tb tsum"><tbody>${rows}<tr class="tot"><td>합계</td><td><b>${fmt(tot)}</b></td></tr></tbody></table></div>`,msg:UI.tut.msg||'증강 칩을 눌러 보너스를 켜고 꺼 보세요.',ctl:`<div class="row" role="group" aria-label="증강 선택">${chips}</div>`}}},
 {k:'conv',t:'판을 흔드는 증강',
  basic:()=>`<p><b>전향</b>은 가까운 상대 돌 하나의 색을 바꾸고, <b>위선</b>은 상대 색 돌을 놓아 판을 흔듭니다. <b>입구자</b>는 3수 뒤 돌이 자동으로 놓이고, <b>선수 우위</b>는 돌을 미리 깝니다.</p><p><b>안개</b>와 <b>눈뽕</b>은 온라인 방에서만 나오며 상대 화면을 가립니다.</p>`,
  extra:()=>miniList(['convert']),
  task:()=>`전향을 사용해 가까운 백 돌을 내 돌로 바꿔 보세요. 멀리 있는 백 돌은 바꿀 수 없습니다.`,
  det:()=>li('<b>전향</b>: 내 돌에서 2칸 이내(대각선 포함)의 상대 돌 하나의 색을 바꿉니다. 성벽으로 보호 중인 돌, 귤, 바꾸면 활로가 없어지는 돌은 고를 수 없고, 차례를 소모합니다.','<b>위선</b>: 상대 색 돌을 최대 3개 놓아 상대가 스스로 활로를 메우게 합니다. 차례를 소모하지 않아 이어서 내 돌을 둡니다(13·19줄 전용).','<b>입구자</b>: 내 돌 하나를 지정하면 내 차례 3번이 지난 뒤 근처에 돌이 최대 2개 놓입니다(13·19줄 전용). <b>선수 우위</b>: 4선에 돌 2개를 미리 놓고 시작합니다(19줄 전용).','<b>안개</b>: 내 돌 일부를 상대 화면에서 가립니다. <b>눈뽕</b>: 모든 돌이 백돌로 보입니다. 둘 다 방 전용입니다.','아래 「체험에서 써 보기」로 실제 판에서 직접 써 볼 수 있고, 방 전용 증강은 체험의 「상대 시점」에서 상대 화면도 확인할 수 있습니다.'),
  view:()=>{const a=augPrac('convert'),tr=(id,nm)=>`<button class="chip sm" data-act="labTry" data-arg="${id}">${nm}</button>`;
    return{board:augBoard('convert'),msg:a.msg||'「전향 사용」을 눌러 보세요.',ctl:augBar('convert')+`<p class="sub" style="margin:2px 0 0">체험에서 써 보기</p><div class="row" role="group" aria-label="증강 체험">${tr('convert','전향')}${tr('hypo','위선')}${tr('ipgu','입구자')}${tr('tempo','선수 우위')}${tr('fog','안개')}${tr('glare','눈뽕')}</div>`}}},
 {k:'job',t:'전직: 마법사·주술사·광대',
  basic:()=>`<p><b>전직 카드</b>(노란색)를 고르면 가진 증강이 모두 사라지고 그 직업의 증강으로 바뀝니다. 이후 다른 증강은 얻지 못합니다.</p><p><b>마법사</b>는 <b>마나</b>를 충전해(최대 ${MANA_MAX}개) 마법을 씁니다. <b>주술사</b>는 제물칸에 둔 돌을 바쳐 <b>제물</b>을 모으고, <b>광대</b>는 <b>농락</b>(컵 게임)에서 상대가 빈 컵을 고르면 <b>카드</b>를 얻습니다.</p>`,
  extra:()=>miniList(['mage','shaman','clown']),
  task:()=>`직업을 고르고 아래 증강을 눌러 효과를 확인해 보세요.`,

 {k:'room',t:'온라인 방과 마무리',

      <div class="t-d"><button class="tdetbtn" data-act="tutDet" aria-expanded="${open}" aria-controls="tdetbox">${open?'상세설명 닫기':'상세설명'}<span aria-hidden="true">${open?' ▲':' ▼'}</span></button>${open?`<div class="t-detbox" id="tdetbox">${s.det()}</div>`:''}</div></div>

/* ===== 증강 체험: 원하는 증강을 대국 중에 받아 무제한으로 써 보고, 시점을 바꿔 방 전용 증강도 확인한다 ===== */
/* 방(NET)과 같은 규칙으로 돌리되 네트워크는 없다.
   · 흑과 백을 한 사람이 번갈아 둔다. 시점(mySeat)은 기본이 「자동」이라 차례가 바뀌면 그 쪽 화면으로 따라간다.
     흑·백으로 고정하면 그 쪽 화면을 계속 보여 줘, 상대 화면에서 어떻게 보이는지 확인할 수 있다.
   · 증강은 입장 전에 고르지 않고, 대국 중 언제든 「증강 받기」 창에서 흑·백에게 줄 수 있다(가나다순).
   · 「확률 100%」를 켜면 확률로 발동하는 증강(PROB_IDS)이 항상 발동한다(chance()). */
UI.lab=UI.lab||{size:9,pick:{1:[],2:[]},type:'all',follow:true,sure:false,q:'',seat:1};
const inLab=()=>!!(NET&&NET.lab);
const LABMAX=10;
const labN=()=>(inLab()&&G&&G.st)?G.st.n:UI.lab.size;
/* 지금 판 크기에서 받을 수 있는 증강(종류 필터 적용), 가나다순 */
const labCand=()=>{const n=labN(),t=UI.lab.type;return augsByName(AUGS.filter(a=>augAllowed(a,n,true)&&!a.cls&&(t==='all'||(t==='room'?!!a.online:a.type===t))))};
/* 검색: 글자가 들어 있거나, 초성만 입력했다면 초성이 이어서 들어 있는 이름(예: ㅊㅊㅂㄹ → 청천벽력) */
function labQMatch(name,q){
  q=nameKey(q);if(!q)return true;
  const nm=nameKey(name);
  return /^[ㄱ-ㅎ]+$/.test(q)?choseong(nm).includes(q):nm.includes(q);
}
/* 입력할 때마다 목록 전체를 다시 그리면 한글 입력(조합 중인 글자)이 끊기므로, 이미 그려진 줄만 보이고 숨긴다 */
function labFilter(){
  try{
    if(typeof document==='undefined'||typeof document.querySelectorAll!=='function')return;
    const q=UI.lab.q||'',on=!!nameKey(q);let shown=0;
    document.querySelectorAll('.lglist .labrow').forEach(el=>{const ok=labQMatch(el.getAttribute('data-n'),q);el.hidden=!ok;if(ok)shown++});
    document.querySelectorAll('.lglist .lgg').forEach(el=>{el.hidden=on});
    const none=document.getElementById('lgnone');if(none)none.hidden=shown>0;
  }catch(e){}
}
function labRefocus(sel){try{if(typeof document.querySelector!=='function')return;const b=document.querySelector(sel);if(b&&b.focus)b.focus({preventScroll:true})}catch(e){}}
function labNote(m){UI.labNote=m;render()}
/* 증강을 뺄 때 그 증강이 남긴 흔적(거짓돌, 진행 중인 효과, 되돌릴 지점)도 함께 정리한다 */
function labDrop(st,p,id){
  if(AUG[id]&&AUG[id].type==='job')return dropJob(st,p);
  st.augs[p]=st.augs[p].filter(x=>x!==id);delete st.left[p][id];
  if(id==='halluc')st.fake=(st.fake||[]).filter(f=>f.owner!==p);
  if(id==='flood'||id==='river')st.river=(st.river||[]).filter(r=>r.by!==p);
  if(id==='gen'){st.gen[p]=0;st.genAdd[p]=0}
  if(id==='undo'){st.turnStart[p]=null;st.prevStart[p]=null}
  if(id==='conch')st.conch=(st.conch||[]).filter(c=>c.owner!==p);
  if(id==='glare')st.glare=(st.glare||[]).filter(c=>c.owner!==p);
  if(id==='fog')st.fog=(st.fog||[]).filter(f=>f.owner!==p);
  if(id==='ipgu')st.timers=(st.timers||[]).filter(t=>!(t.kind==='ipgu'&&t.owner===p));
  if(id==='fate')st.fate=(st.fate||[]).filter(f=>f.by!==p);
  if(id==='bomb'&&st.bombArm===p)st.bombArm=null;
  if(id==='mine')st.mines=(st.mines||[]).filter(m=>m.by!==p);
  if(id==='plague'){if(st.plagueArm===p)st.plagueArm=null;Object.keys(st.sick||{}).forEach(k=>{if(st.sick[k].by===p)delete st.sick[k]})}
  if(id==='mirror'&&st.echoArm===p)st.echoArm=null;
}

      <li>시점이 「자동」이면 차례인 쪽 화면이 보이고, 「흑 시점」「백 시점」으로 고정하면 상대 화면에서 어떻게 보이는지 확인할 수 있습니다.</li>
      <li>「확률 100%」를 켜면 행운·불행·귀신·실수·청천벽력·훈수·소라고동처럼 확률로 발동하는 효과가 항상 발동합니다.</li>

  const shown=list.filter(a=>labQMatch(a.name,L.q)).length;
  return `<div class="amod" data-act="labGiveClose" role="presentation"><div class="ambox lgbox" data-act="noop" role="dialog" aria-modal="true" aria-labelledby="lgt" tabindex="-1">
    <div class="lghead"><h3 id="lgt">증강 받기</h3><button class="btn sm" data-act="labGiveClose">닫기</button></div>

async function sgAdd(kind,item){

/* ---- 귀신 사진 추천: 브라우저에서 작게 줄여 보내고, 주인이 보고 승인해야 게임에 나온다 ---- */
function ghostShrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('파일을 읽지 못했습니다.'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('이미지 파일이 아닙니다.'));
      im.onload=()=>{
        const k=Math.min(1,380/Math.max(im.width,im.height)),cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        let q=0.7,out=cv.toDataURL('image/jpeg',q);
        while(out.length>70000&&q>0.3){q-=0.1;out=cv.toDataURL('image/jpeg',q)}
        out.length>90000?rej(new Error('사진이 너무 큽니다.')):res(out);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function sgxFail(r,txt){
  let why='';try{const j=JSON.parse(txt);why=(j.error&&(j.error.status||j.error.message))||''}catch(e){}
  const m=r.status===403?'권한이 없습니다(403). Firebase 콘솔의 Firestore 규칙에서 읽기·쓰기를 허용했는지 확인하세요.':
    r.status===404?'데이터베이스를 찾지 못했습니다(404). projectId가 맞는지, Firestore를 만들었는지 확인하세요.':
    r.status===400?'요청이 거절되었습니다(400). apiKey가 맞는지 확인하세요. '+why:'저장소 오류('+r.status+') '+why;
  return {code:'http',status:r.status,message:m};
}
async function sgxFetch(url,opt){
  /* 응답이 없어도 화면이 영원히 기다리지 않도록 10초 뒤 끊는다 */
  let r,tm=null;
  try{
    const o=Object.assign({},opt||{});
    if(typeof AbortController==='function'){const ac=new AbortController();o.signal=ac.signal;tm=setTimeout(()=>ac.abort(),10000)}
    r=await fetch(url,o);
  }catch(e){throw {code:'net',message:'저장소에 접속하지 못했습니다. 인터넷 연결이나 광고 차단 확장 프로그램을 확인하세요.'}}
  finally{if(tm)clearTimeout(tm)}
  if(r.status===404&&(!opt||!opt.method||opt.method==='GET'))return null;   // 문서가 아직 없음
  if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw sgxFail(r,t)}
  return r;
}
const sgxParse=d=>{try{return JSON.parse(d.fields.j.stringValue)}catch(e){return null}};
async function sgxGetDoc(path){
  const r=await sgxFetch(sgxBase()+'/'+path+'?'+sgxKey());if(!r)return null;
  return sgxParse(await r.json());
}
async function sgxSetDoc(path,v){
  await sgxFetch(sgxBase()+'/'+path+'?'+sgxKey(),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{j:{stringValue:JSON.stringify(v)}}})});
}
const sgxPath=p=>p===SGP_APPROVED?'abk_cfg/approved':p===SGP_GHOSTS?'abk_cfg/ghosts':'abk_sugg/'+p.slice(5);
/* sugg.js가 쓰는 db 모양을 흉내 내는 얇은 어댑터 */
const sgxDb={
  doc:p=>({
    get:async()=>{const v=await sgxGetDoc(sgxPath(p));return{id:p.split('/').pop(),exists:!!v,data:()=>v}},
    set:async v=>{await sgxSetDoc(sgxPath(p),v)}
  }),
  collection:()=>({get:async()=>{
    const docs=[];let tok='';
    for(let i=0;i<10;i++){
      const r=await sgxFetch(sgxBase()+'/abk_sugg?pageSize=300&'+sgxKey()+(tok?'&pageToken='+encodeURIComponent(tok):''));
      const j=r?await r.json():{};
      (j.documents||[]).forEach(d=>{const v=sgxParse(d);if(v)docs.push({id:d.name.split('/').pop(),exists:true,data:()=>v})});
      tok=j.nextPageToken||'';if(!tok)break;
    }
    return{docs,size:docs.length,empty:!docs.length};
  }})
};

const DBG={on:false,log:[],t0:Date.now(),taps:[]};

function dbgChecks(){
  const out=[];if(!G||!G.st)return['게임 없음'];
  const st=G.st,n=st.n;
  try{
    for(let i=0;i<n*n;i++){if(!st.board[i])continue;const g=groupOf(st,st.board,i);if(g.libs.length===0&&!isProtected(st,g)&&!st.phase){out.push('활로 0인 돌 '+cnm(st,i));break}}
    Object.keys(st.sp||{}).forEach(k=>{if(!st.board[k])out.push('빈 자리의 특수돌 표식 '+k)});
    (st.tang||[]).forEach(t=>{if(!t.pts.every(i=>st.board[i]===t.c))out.push('귤이 깨짐')});
    ((st.hid&&st.hid.stones)||[]).forEach(h=>{if(st.board[h.idx]!==h.p)out.push('숨은 돌 기록이 어긋남 '+h.idx)});
    if(st.board.some(v=>v<0||v>2))out.push('이상한 칸 값');
  }catch(e){out.push('점검 오류 '+e.message)}
  return out.length?out:['이상 없음'];
}

/* ---- 공용 연출 도구 ---- */
const SAND='243,217,160',MINT='110,235,185',LAV='200,170,255',ICE='160,225,255',ROSE='255,150,215',AMB='255,190,90',VIO='172,108,255';
const bez=(x1,y1,cx,cy,x2,y2)=>q=>{const a=(1-q)*(1-q),b=2*q*(1-q),c=q*q;return[a*x1+b*cx+c*x2,a*y1+b*cy+c*y2]};
const lin=(x1,y1,x2,y2)=>q=>[mix(x1,x2,q),mix(y1,y2,q)];
const elbow=(x1,y1,ex,ey,x2,y2)=>{const L1=Math.hypot(ex-x1,ey-y1),L2=Math.hypot(x2-ex,y2-ey),L=(L1+L2)||1;
  return q=>{const d=q*L;return d<L1?[mix(x1,ex,d/(L1||1)),mix(y1,ey,d/(L1||1))]:[mix(ex,x2,(d-L1)/(L2||1)),mix(ey,y2,(d-L1)/(L2||1))]}};
/* 한 점에서 터지는 번쩍임: 빛무리 + 충격파 + 불똥 (+ 별빛) */
function pop(g,t,x,y,o){
  const u=t-o.t0;if(u<0)return;const P=g.P,c=o.c||K.hot,R=o.R||60,L=o.life||760;

  g.shock(x,y,u/L,P(R*1.6),P(o.w||5),c);
  g.shock(x,y,(u-70)/L,P(R*1.15),P(3),'255,255,255',.75);
  g.emit(t,{x,y,n:o.n||20,t0:o.t0,life:L,v0:o.v0||90,v1:o.v1||400,drag:1.3,grav:o.grav==null?500:o.grav,size:o.sz||2.6,c,cols:o.cols,streak:true,seed:o.seed||1});
  if(o.star)g.star(x,y,P(o.star),'255,255,255',env(u,0,50,150,560),o.rot||0);
}
/* 불똥·별빛 없이 빛무리와 파문만: 입자가 어울리지 않는 장면(이동·정신·방어계)에서 쓴다 */
function ripple(g,t,x,y,o){
  const u=t-o.t0;if(u<0)return;const P=g.P,c=o.c||K.hot,R=o.R||60,L=o.life||760;
  g.glow(x,y,P(R)*(.6+.4*eo(u/260)),c,.8*env(u,0,30,110,L*.62));
  g.glow(x,y,P(R*.38),K.white,.9*env(u,0,24,70,300));
  g.shock(x,y,u/L,P(R*1.5),P(o.w||5),c);
  g.shock(x,y,(u-70)/L,P(R*1.1),P(3),'255,255,255',.75);
}
/* 길을 따라 날아가는 빛덩이: 머리 + 잔상 + 흩날리는 불똥. pf(q): 0~1 → [x,y] */
function comet(g,t,pf,o){
  const q=(t-o.t0)/o.T;if(q<0)return;const P=g.P,c=o.c||K.hot,N=o.tail||16,fade=q>1?cl(1-(q-1)*5,0,1):1;
  if(fade<=0)return;const qh=Math.min(q,1);
  for(let j=0;j<N;j++){const qq=qh-j*(o.gap||.02);if(qq<0)break;const a=pf(qq),f=1-j/N;g.glow(a[0],a[1],P((o.size||26)*(.3+.7*f)),j<3?K.white:c,fade*f*.9)}
  const E=o.sparks==null?10:o.sparks;
  for(let j=0;j<E;j++){const qj=j/E,a=pf(qj);g.emit(t,{x:a[0],y:a[1],n:2,t0:o.t0+qj*o.T,life:560,v0:10,v1:90,drag:1,grav:260,size:2.2,c,cols:[c,K.white,c],tw:true,core:true,seed:(o.seed||1)*13+j})}
}
/* 소용돌이: 점들이 중심으로 빨려 들어가거나(inward) 퍼져 나간다 */
function vortex(g,t,x,y,o){
  const u0=(t-o.t0)/o.dur;if(u0<=0||u0>=1)return;const P=g.P,n=o.n||24,e0=env(u0,0,.14,.8,1)*(o.a==null?1:o.a);

    g.glow(x+Math.cos(a)*r,y+Math.sin(a)*r,P(o.size||9)*(.45+.55*s),o.c,s*e0);
  }
}

SC.knight={dur:1500,shake:[3,240,600],fn(g,t,ev){

/* ---- 마법사: 보라색 마나 ----
   마나는 보라색이다. 기존 번개·성벽·유성·공간이동과 모양이 겹치지 않도록 각 마법의 성질에서 연출을 끌어왔다.
   낙뢰=격자를 타고 번지는 방전 · 베리어=돌 무리를 감싸는 유리 막 · 메테오=5×5 안에서 3×3 조준이 튀다 떨어지는 별 ·
   텔레포트=스캔선이 훑고 지나가며 분해·재구성 · 마나 충전=고리에 구슬이 하나 더 합류 · 전직=오망성 마법진 */
const MA={hi:'236,224,255',mid:'172,108,255',lo:'112,62,222',dk:'48,22,108'};
/* 보라 줄기: 넓은 빛 + 보라 줄기 + 연보라 심지 */
function vline(g,pts,w,a,c){
  if(!(a>.004)||pts.length<2)return;const cx=g.cx;cx.lineCap='round';cx.lineJoin='round';c=c||MA.mid;
  const path=()=>{cx.beginPath();for(let i=0;i<pts.length;i++)i?cx.lineTo(pts[i][0],pts[i][1]):cx.moveTo(pts[i][0],pts[i][1])};
  path();cx.lineWidth=w*4.2;cx.strokeStyle=`rgba(${c},${.24*a})`;cx.stroke();
  path();cx.lineWidth=w*1.8;cx.strokeStyle=`rgba(${c},${.84*a})`;cx.stroke();
  path();cx.lineWidth=Math.max(.2,w*.5);cx.strokeStyle=`rgba(${MA.hi},${a>1?1:a})`;cx.stroke();
}
/* 호(원의 일부) */
function varc(g,x,y,r,a0,a1,w,a,c){
  if(!(a>.004)||!(r>0)||a1<=a0)return;const cx=g.cx;c=c||MA.mid;cx.lineCap='round';
  const path=()=>{cx.beginPath();cx.arc(x,y,r,a0,a1)};
  path();cx.lineWidth=w*3.8;cx.strokeStyle=`rgba(${c},${.24*a})`;cx.stroke();
  path();cx.lineWidth=w*1.6;cx.strokeStyle=`rgba(${c},${.86*a})`;cx.stroke();
  path();cx.lineWidth=Math.max(.2,w*.42);cx.strokeStyle=`rgba(${MA.hi},${a>1?1:a})`;cx.stroke();
}
/* 둥근 네모 테두리: 체비셰프 거리 범위(3×3·5×5)가 퍼지는 모양 */
function sqring(g,x,y,h,w,c,a){
  if(!(a>.004)||!(h>0))return;const cx=g.cx,r=Math.min(8,h*.2);

  path();cx.lineWidth=w;cx.strokeStyle=`rgba(${c},${.88*a})`;cx.stroke();
  path();cx.lineWidth=Math.max(.2,w*.32);cx.strokeStyle=`rgba(${MA.hi},${a>1?1:a})`;cx.stroke();
}
/* 네 모서리 꺾쇠 */
function brackets(g,x,y,h,len,w,c,a){
  if(!(a>.004)||!(h>0))return;const cx=g.cx;cx.lineCap='round';cx.lineJoin='round';
  const path=()=>{cx.beginPath();[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{cx.moveTo(x+sx*h,y+sy*(h-len));cx.lineTo(x+sx*h,y+sy*h);cx.lineTo(x+sx*(h-len),y+sy*h)})};

/* 정육각형 테두리(성벽 아닌 베리어 표식과 같은 크기) */

/* 마나 구슬 */

/* 마나 충전: 마법진 고리에 마나 구슬이 하나 더 합류한다 */
SC.m_charge={dur:2100,shake:null,fn(g,t,ev){

/* 낙뢰: 정전기가 모이다가 보라색 번개가 꼬인 줄기로 내리꽂히고, 방전이 격자 선을 타고 번져 나간다 */
SC.m_bolt={dur:2000,shake:[6,520,300],fn(g,t,ev){

function actives(now){
  const out=[];
  const alive=(a,sc)=>S.dbg!=null||now-a.t0<sdur(sc,a.ev);
  try{if(typeof UI!=='undefined'&&UI.screen==='game'&&!UI.review&&UI.fxActive)for(const a of UI.fxActive){const sc=sceneOf(a.ev);if(sc&&alive(a,sc))out.push(a)}}catch(e){}
  S.extra=S.extra.filter(a=>{const sc=sceneOf(a.ev);return sc&&alive(a,sc)});
  return out.concat(S.extra);
}
function frame(){
  S.raf=0;
  if(!S.cx||S.lite)return;
  const now=Date.now(),acts=actives(now);
  if(!acts.length&&S.dbg==null){try{S.cx.setTransform(1,0,0,1,0,0);S.cx.clearRect(0,0,S.cv.width,S.cv.height)}catch(e){}return}
  draw(acts,now);
  if(S.dbg==null&&WN&&WN.requestAnimationFrame)S.raf=WN.requestAnimationFrame(frame);
}
function draw(acts,now){
  size();const cx=S.cx;cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,S.cv.width,S.cv.height);
  for(const a of acts){
    const sc=sceneOf(a.ev);if(!sc)continue;
    const t=S.dbg!=null?S.dbg:now-a.t0;if(t<0||t>sdur(sc,a.ev))continue;
    const map=mapOf(a.sel)||{k:1,co:1,si:0,ox:S.w/2-190,oy:S.h/2-190,ox0:S.w/2-190,oy0:S.h/2-190,S:380,n:9};
    const g=mk(cx,map,a.ev,1);
    cx.save();g.base();
    try{sc.fn(g,t,a.ev)}catch(e){S.err=e;if(typeof console!=='undefined'&&!S.warned){S.warned=1;console.warn('FXC',e)}}
    cx.restore();
  }
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
}
function sync(){
  if(S.lite||!ensure())return;
  if(!S.raf&&S.dbg==null&&WN&&WN.requestAnimationFrame&&actives(Date.now()).length)S.raf=WN.requestAnimationFrame(frame);
}
function shakeOf(acts,now){
  if(S.lite||reduced())return null;let best=null;
  for(const a of acts){const sc=sceneOf(a.ev);let sh=sc&&sc.shake;
    if(a.ev.kind==='cast'&&a.ev.id==='flick'){const pl=flickPlan(a.ev);sh=pl&&pl.big?[2+pl.big.pw*6,420,pl.big.ms]:null}
    else if(a.ev.kind==='cast'&&a.ev.id==='fate'&&!a.ev.hit)sh=null;
    else if(a.ev.kind==='cast'&&a.ev.id==='doubt')sh=a.ev.ok?null:[4,320,0];
    else if(a.ev.kind==='cast'&&a.ev.id==='c_sky')sh=a.ev.land?[4,300,380]:null;
    else if(a.ev.kind==='cast'&&a.ev.id==='wheel'){const r=a.ev.r==null?1:a.ev.r;sh=r<=-2?[4,360,2760]:r>=5?[3,320,2760]:null}
    if(!sh)continue;const d=sh[2]-(now-a.t0);if(d+sh[1]<=0)continue;
    if(!best||sh[0]>best.a)best={a:sh[0],t:sh[1],d:Math.round(d)};}

}
return{
  on(){return !S.lite&&ensure()},
  sync,shakeOf,frame,

  /* 튜토리얼 미리보기 등 UI.fxActive 밖에서 재생 */

          +`<path class="fxpop" style="--t:1500ms" d="M${cx-62} ${ey}Q${cx} ${ey-46} ${cx+62} ${ey}Q${cx} ${ey+46} ${cx-62} ${ey}z" fill="#ffffff" fill-opacity=".16" stroke="${col}" stroke-width="4.5" stroke-linejoin="round"/>`
          +`<circle class="fxpop" style="--s:60ms;--t:1500ms" cx="${cx}" cy="${ey}" r="19" fill="${col}" stroke="#ffffff" stroke-width="3"/>`
          +`<circle class="fxpop" style="--s:120ms;--t:1500ms" cx="${cx}" cy="${ey}" r="8" fill="#0b2a1f"/>`+`<circle class="fxpop" style="--s:160ms;--t:1500ms" cx="${cx-5}" cy="${ey-5}" r="3" fill="#ffffff"/>`
          +sw(cx,ey,S*.4,col,200,1200)+sw(cx,ey,S*.4,'#ffffff',400,1000)+rays(cx,ey,col,12,70,S*.45,100,800,.1,4)
          +`<text class="fxbig" x="${cx}" y="${cy+70}" fill="#ffffff">간파!</text>`;break}
      case 'fate':
        if(ev.hit&&pts.length){const [x,y]=xy(pts[0]);
          s+=gl(x,y,52,col,0,1300,true)+`<g class="fxrot" style="--t:1400ms;--rot:200deg"><circle cx="${x}" cy="${y}" r="30" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="4 8"/></g>`+`<g class="fxrot" style="--t:1400ms;--rot:-240deg"><circle cx="${x}" cy="${y}" r="38" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="10 6"/></g>`
            +sw(x,y,26,col,0,800)+sw(x,y,26,'#ffffff',120,700)+rays(x,y,col,12,16,66,60,600)+sparks(x,y,col,10,48,60,2.8,900)+star(x,y,18,'#ffffff',100,900)+star(x-26,y-24,8,'#e0d0ff',250,900)+star(x+28,y-20,7,'#e0d0ff',350,900)
            +`<text class="fxbig" x="${S/2}" y="${Math.max(70,y-64)}" fill="#d8c0ff">예측 적중!</text>`}
        else{const cx=S/2,cy=S/2;s+=gl(cx,cy,S*.25,col,0,1500,true)+`<g class="fxrot" style="--t:1500ms;--rot:160deg"><circle cx="${cx}" cy="${cy}" r="${f1(S*.1)}" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="5 8"/></g>`+sw(cx,cy,S*.2,col,0,1100)+star(cx,cy,16,'#ffffff',200,1000)}
        break;
      case 'bomb':if(ev.boom)pts.forEach((i,k)=>{const [x,y]=xy(i),dl=k*80;
        if(k===0&&!cvOn)s+=`<rect class="fxwash" style="--s:0ms" x="0" y="0" width="${S}" height="${S}" fill="#fff3d0" fill-opacity=".7"/>`;
        s+=(cvOn?'':gl(x,y,C*2.2,'#ffb04a',dl,1000)+gl(x,y,C*1.1,'#ffffff',dl,500)+sw(x,y,C*1.5,col,dl,900)+sw(x,y,C,'#ffb04a',dl+80,800))
          +`<rect class="fxring" style="--s:${dl}ms" x="${x-C*1.5}" y="${y-C*1.5}" width="${C*3}" height="${C*3}" rx="8" stroke="${col}" fill="none"/>`
          +(cvOn?'':rays(x,y,'#ffd24a',10,10,C*1.7,dl,500,0,5)+sparks(x,y,'#ff8a3c',14,C*1.8,dl,3.4,1000,true)
          +`<circle class="fxdrift" style="--s:${dl+150}ms;--t:2000ms;--o:.5;--dx:${r1((rn(k)-.5)*30)}px;--dy:-44px" cx="${x}" cy="${y}" r="22" fill="${gr('#555555')}"/>`)
          +`<circle class="fxscorch" style="--s:${dl}ms" cx="${x}" cy="${y}" r="${C*.8}" fill="${gr('#2a1206')}"/>`});break;
      case 'mine':if(ev.boom&&pts.length){const [x,y]=xy(pts[0]);
        if(!cvOn)s+=`<rect class="fxwash" style="--s:0ms" x="0" y="0" width="${S}" height="${S}" fill="#fff3d0" fill-opacity=".7"/>`;
        (ev.cells||pts).forEach((i,k)=>{const [cx2,cy2]=xy(i),dl=i===pts[0]?0:90+k*28;
          s+=(cvOn?'':gl(cx2,cy2,C*1.5,'#ffb04a',dl,1000)+gl(cx2,cy2,C*.8,'#ffffff',dl,500)+sw(cx2,cy2,C*1.2,col,dl,900)+rays(cx2,cy2,'#ffd24a',8,10,C*1.3,dl,500,0,4)+sparks(cx2,cy2,'#ff8a3c',9,C*1.5,dl,3.2,1000,true))
            +`<circle class="fxscorch" style="--s:${dl}ms" cx="${cx2}" cy="${cy2}" r="${C*.7}" fill="${gr('#2a1206')}"/>`});
        s+=`<rect class="fxring" x="${x-C*1.5}" y="${y-C*.5}" width="${C*3}" height="${C}" rx="8" stroke="${col}" fill="none"/><rect class="fxring" x="${x-C*.5}" y="${y-C*1.5}" width="${C}" height="${C*3}" rx="8" stroke="${col}" fill="none"/>`}
        break;
      case 'plague':{
        const sp=(x,y,k,dl,c)=>{let o='';for(let j=0;j<k;j++)o+=`<circle class="fxrise" style="--s:${dl+j*100}ms;--t:1200ms;--dx:${r1((rn(j+3)-.5)*26)}px;--dy:${-26-r1(rn(j+9)*30)}px" cx="${r1(x+(rn(j)-.5)*20)}" cy="${r1(y)}" r="${f1(1.8+rn(j+5)*1.6)}" fill="${j%2?'#d4ff8a':c}"/>`;return o};
        if(!pts.length){const cx=S/2,cy=S/2;s+=gl(cx,cy,S*.3,'#78dc5a',0,1500,true)+sw(cx,cy,S*.3,'#78dc5a',0,1100)+sw(cx,cy,S*.3,'#d4ff8a',260,1100);for(let k=0;k<8;k++)s+=sp(cx+(rn(k)-.5)*S*.4,cy+(rn(k+7)-.5)*S*.3,2,k*80,'#78dc5a');break}
        pts.slice(0,24).forEach((i,k)=>{const [x,y]=xy(i),dl=Math.min(k,16)*34;
          s+=gl(x,y,ev.die?32:36,'#78dc5a',dl,1000)+sw(x,y,20,ev.die?'#60784a':'#96eb6e',dl,700)+sp(x,y,ev.die?3:4,dl,'#78dc5a');
          if(ev.die)s+=`<path class="fxx" style="--s:${dl}ms" d="M${x-10} ${y-10}l20 20m0-20l-20 20" stroke="#78a05a"/>`;
        });break}
      case 'doubt':{const cx=S/2,cy=S/2,ok=ev.ok,c=ok?'#2aa57a':'#d9503a',cc=ok?'#7ee0a8':'#ffb0a0';
        s+=gl(cx,cy-30,S*.2,c,0,1400,true)+`<circle class="fxpop" style="--t:1500ms" cx="${cx}" cy="${cy-30}" r="38" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-width="5"/>`;
        if(ok)s+=`<path class="fxdh" pathLength="1" style="--t:1500ms" d="M${cx-18} ${cy-28}L${cx-4} ${cy-14}L${cx+20} ${cy-44}" stroke="#ffffff" stroke-width="7"/>`+rays(cx,cy-30,cc,10,44,74,300,600,0,3);
        else s+=`<path class="fxdh" pathLength="1" style="--t:1500ms" d="M${cx-16} ${cy-46}L${cx+16} ${cy-14}M${cx+16} ${cy-46}L${cx-16} ${cy-14}" stroke="#ffffff" stroke-width="7"/>`+sw(cx,cy-30,44,c,0,800);
        s+=sw(cx,cy-30,38,cc,0,900)+`<text class="fxbig" x="${cx}" y="${cy+50}" fill="${cc}">${ok?'의심 적중!':'의심 빗나감'}</text>`;break}
      case 'pocky':case 'river':case 'tsunami':case 'freeze':case 'wheel':case 'frost':case 'flood':case 'spawn':case 'snap':case 'copy':
        s+=fx6(ev,{C,M,S,n,xy,col,pts,gl,sw,rays,stoneDraw,tangDraw,ghostDraw,coverSvg,hex,rn,r1,f1});break;
      case 'insane':case 'shaman':case 'clown':case 'z_sac':case 'z_seal':case 'z_curse':case 'z_smite':case 'c_juggle':case 'c_sky':case 'c_box':case 'c_joker':case 'c_cup':case 'fumble':
        s+=fx7(ev,{C,M,S,n,xy,pts,gl,sw,star,sparks,strk,stoneDraw,ghostDraw,coverSvg,rn,r1,f1,cvOn,gr});break;
      case 'gen':if(ev.v!=null)s+=`<text class="fxbig" x="${S/2}" y="${S/2}" fill="${col}">발전 ${ev.v}%</text>`;break;
    }
  }
  if(GR.size)s='<defs>'+[...GR].map(c=>`<radialGradient id="fxg${gk(c)}"><stop offset="0" stop-color="${c}" stop-opacity="1"/><stop offset=".4" stop-color="${c}" stop-opacity=".6"/><stop offset=".75" stop-color="${c}" stop-opacity=".22"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`).join('')+'</defs>'+s;
  return s;
}
/* 승리 방식별 안내 띠: 글자·색·설명 */
const WINTXT={tenmok:['十','#d9a400',ev=>'10목 완성!',ev=>`일직선 ${ev.len||(ev.pts||[]).length}개를 이어 즉시 승리`],gen:['電','#1fa7d6',ev=>'발전기 100% 완성!',ev=>'발전도를 모두 채워 즉시 승리'],king:['王','#c0392b',ev=>'왕의 귀환!',ev=>`사석 ${ev.k||''}개를 모아 즉시 승리`],resign:['🏳','#7a8696',ev=>'기권승',ev=>'상대가 기권했습니다']};
function fxBanner(ev,d){
  if(ev.kind==='win'){
    const w=WINTXT[ev.how];if(!w)return '';
    return `<div class="fxban win" style="--c:${w[1]};--d:${d}ms"><span class="seal active" aria-hidden="true">${w[0]}</span><div><b>${NAME[ev.p]} · ${w[2](ev)}</b><span>${w[3](ev)}</span></div></div>`;
  }
  if(ev.kind!=='cast'||ev.quiet||ev.fire)return '';
  const a=AUG[ev.id];if(!a)return '';
  if(G&&screenOn(G.st,ev.p,NET?mySeat():null))return `<div class="fxban" style="--c:#6a6f7a;--d:${d}ms"><span class="seal passive" aria-hidden="true">?</span><div><b>${NAME[ev.p]} · 가려진 증강</b><span>가림막에 가려져 알 수 없습니다</span></div></div>`;
  return `<div class="fxban" style="--c:${FXCOL[ev.id]||(a.type==='passive'?'#1c7560':'#bf3f2b')};--d:${d}ms"><span class="seal ${a.look}" aria-hidden="true">${a.glyph}</span><div><b>${NAME[ev.p]} · ${a.name}</b><span>${esc(a.cast)}</span></div></div>`;
}
/* 새 효과를 판 위에 붙인다. 다시 그려져도 남은 시간만큼만 이어서 재생한다. */
function flushFx(){
  if(!G||UI.screen!=='game'||!$app)return;
  const st=G.st,now=Date.now();
  if(UI.fxGid!==st.gid){UI.fxGid=st.gid;UI.fxSeen=st.fxn||0;UI.fxActive=[];UI.partyGid=st.over?st.gid:null}
  const me=NET?mySeat():null;
  (st.fxq||[]).forEach(ev=>{if(ev.n>UI.fxSeen){
    if(ev.kind==='ghost'){if(!NET||(NET.lab&&UI.lab&&UI.lab.follow)||ev.to===mySeat())UI.gpop={gi:ev.gi,t0:now}}   /* 체험의 자동 시점은 한 사람이 양쪽을 두므로, 시점이 넘어간 뒤에도 사진을 보여 준다 */
    else if(ev.kind==='pass'){if(!NET||ev.p!==mySeat())UI.pbig={t0:now,p:ev.p,k:ev.k,m:ev.m}}
    else UI.fxActive.push({ev:ev.kind==='win'&&NET&&me!=null&&ev.p!==me?Object.assign({},ev,{lose:true}):ev,t0:now+(ev.dl>0?Math.min(ev.dl,8000):0)});
    UI.fxSeen=ev.n}});
  /* 점수로 승부가 난 판: 이긴 사람 화면에 축하 색종이(즉시 승리 효과가 따로 있는 판은 제외) */
  if(st.over&&st.result&&UI.partyGid!==st.gid){
    UI.partyGid=st.gid;const r=st.result,won=r.winners||(r.winner!=null?[r.winner]:[]);
    if(!r.resign&&!r.tenmok&&!r.king&&!r.gen&&won.length&&r.diff!==0&&(!NET||me==null||won.includes(me)))UI.fxActive.push({ev:{kind:'party',n:(st.fxn||0)+1,p:won[0]},t0:now});
  }
  UI.fxActive=UI.fxActive.filter(a=>now-a.t0<(typeof FXC!=='undefined'&&FXC.dur?FXC.dur(a.ev):3400));
  if(typeof FXC!=='undefined'&&FXC.sync&&!UI.review)FXC.sync();
  if(!$app.querySelector||UI.review)return;
  const svg=$app.querySelector('svg.board');
  if(!svg||!UI.fxActive.length)return;
  let sv='',ban='';
  UI.fxActive.forEach(a=>{
    const d=-(now-a.t0);
    sv+=`<g class="fx" style="--d:${d}ms">${fxBoardSvg(a.ev,st.n)}</g>`;
    ban+=fxBanner(a.ev,d);
  });
  svg.insertAdjacentHTML('beforeend',sv);
  /* 강물 연출 중에는 강 위 칸의 마우스 미리보기를 가린다. 연출이 끝나면 다시 보인다 */
  try{const rf=UI.fxActive.filter(a=>a.ev.kind==='cast'&&a.ev.id==='river');
    if(rf.length&&svg.classList){const left=Math.max(...rf.map(a=>(typeof FXC!=='undefined'&&FXC.dur?FXC.dur(a.ev):1700)-(now-a.t0)));svg.classList.add('rvfx');setTimeout(()=>{try{svg.classList.remove('rvfx')}catch(e){}},Math.max(60,left+40))}}catch(e){}
  const holder=svg.parentNode;
  if(ban&&holder)holder.insertAdjacentHTML('beforeend',`<div class="fxbans">${ban}</div>`);
  /* 화면 흔들림: 보드만 흔든다. 다시 그려져도 남은 시간만큼만 이어서 흔들린다 */
  try{const sh=typeof FXC!=='undefined'&&FXC.shakeOf?FXC.shakeOf(UI.fxActive,now):null;
    if(sh&&holder&&holder.classList&&holder.style){holder.classList.add('fxshk');holder.style.setProperty('--sa',sh.a+'px');holder.style.setProperty('--sd',sh.d+'ms');holder.style.setProperty('--st',sh.t+'ms')}}catch(e){}
}

/* 조롱: 상대(조롱을 받는 사람) 화면을 덮는 큰 글씨 */
/* 상대의 패스: 판 위에 크게 잠깐 띄운다(지속 안내는 컨트롤 영역의 패스 배너) */
function flushPass(){
  if(!G||UI.screen!=='game'||!$app)return;
  const st=G.st;
  if(UI.passGid!==st.gid){UI.passGid=st.gid;UI.pbig=null}
  const t=UI.pbig;if(!t||!$app.insertAdjacentHTML)return;
  const age=Date.now()-t.t0;if(age>2400){UI.pbig=null;return}
  $app.insertAdjacentHTML('beforeend',`<div class="passbig" role="status" aria-live="assertive" style="--d:${-age}ms"><div class="pbox"><span class="stn big s${t.p}" aria-hidden="true"></span><p>패스</p><small>${NAME[t.p]}이(가) 패스했습니다 · 연속 ${t.k}/${t.m}</small></div></div>`);
}
function flushTaunt(){
  const t=UI.tbig;if(!t||UI.screen!=='game'||!$app||!$app.insertAdjacentHTML)return;
  const age=Date.now()-t.t0;if(age>2200){UI.tbig=null;return}
  $app.insertAdjacentHTML('beforeend',`<div class="tbig" role="status" style="--d:${-age}ms"><div class="tbox"><span class="tseal" aria-hidden="true">嘲</span><small>상대 AI의 조롱</small><p>${esc(t.text)}</p></div></div>`);
}

/* 귀신: 상대가 착수할 때 가끔 튀어나오는 사진 */
function ghostSrc(gi){
  if(/^b\d$/.test(gi||''))return GHOST_B[+gi[1]];
  const g=(UI.extraGhosts||[]).find(x=>x.id===gi);return g?g.img:GHOST_B[0];
}
function flushGhost(){
  const t=UI.gpop;if(!t||UI.screen!=='game'||!$app||!$app.insertAdjacentHTML)return;
  const age=Date.now()-t.t0;if(age>1800){UI.gpop=null;return}
  $app.insertAdjacentHTML('beforeend',`<div class="gbig" role="img" aria-label="귀신 사진" style="--d:${-age}ms"><img alt="" src="${ghostSrc(t.gi)}"></div>`);
}
/* ===== 그리기 ===== */
/* 세로 화면에서 패널 내용이 넘치면 보드를 조금 줄여 그만큼 패널에 준다(보드는 화면 높이의 36% 아래로는 줄이지 않는다) */
function fitGame(){
  try{
    if(typeof document==='undefined'||!document.querySelector||typeof window==='undefined'||!window.matchMedia)return;
    const g=document.querySelector('.game2');if(!g)return;
    g.style.removeProperty('--sidecap');
    if(!window.matchMedia('(max-width:780px),(max-aspect-ratio:1/1)').matches||window.innerHeight<=520)return;
    const main=g.querySelector('.g-main'),side=g.querySelector('.g-side'),bd=g.querySelector('.g-board');
    if(!main||!side||!bd)return;
    const o=main.scrollHeight-main.clientHeight;if(o<=2)return;
    const floor=Math.max(190,Math.round(window.innerHeight*.36)),bh=bd.getBoundingClientRect().height;
    const grow=Math.min(o,Math.max(0,bh-floor));if(grow<=0)return;
    g.style.setProperty('--sidecap',Math.ceil(side.getBoundingClientRect().height+grow)+'px');
  }catch(e){}
}
if(typeof window!=='undefined'&&window.addEventListener){let _rz=0;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(fitGame,80)})}
/* 농락: 컵을 고르기 전에는 돌을 놓거나 증강을 쓸 수 없다(뒤에서 덧씌운 동작까지 한 번에 막는다) */
['pt','pass','use','steal','sneak','doubt','gen','genGo','genMax','emberOk','flickLock','apprPick','hypodone','teleRot','skyGo','pockyGo','pockyRot'].forEach(k=>{
  const f=ACT[k];if(typeof f!=='function')return;
  ACT[k]=function(){if(cupGate())return;return f.apply(this,arguments)};
});
function render(){
  if(UI.screen==='game'&&!G)UI.screen=NET?'lobby':'start';
  if(G&&UI.gidSeen!==G.st.gid){UI.gidSeen=G.st.gid;UI.taunt={};UI.advice={};UI.hintStore={};UI.rec=null;UI.ctx=null;UI.tbig=null}
  const KEEP=['tsg','sgn','sgd','owp','obid','gin','labq','chat','nick'],kept={},chCtx=chatPre();let act=null;
  try{KEEP.forEach(id=>{const e=document.getElementById(id);if(e&&typeof e.value==='string'&&e.value!==''&&e.isConnected!==false)kept[id]=e.value});
    const ae=document.activeElement;act=ae&&ae.id&&KEEP.includes(ae.id)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null}catch(e){}
  try{if(document.body&&document.body.setAttribute){document.body.setAttribute('data-screen',UI.screen);document.body.setAttribute('data-nav',UI.navOpen?'open':'')}}catch(e){}
  /* 증강 체험의 「증강 받기」 목록은 눌러서 다시 그려져도 보던 자리를 유지한다 */
  let lgTop=null;try{if(typeof document.querySelector==='function'){const l=document.querySelector('.lglist');if(l)lgTop=l.scrollTop}}catch(e){}
  $app.innerHTML=({start:vStart,codex:vCodex,game:vGame,lobby:vLobby,join:vJoin,lab:vLab,tutorial:vTutorial,suggest:vSuggest})[UI.screen]();
  try{if(lgTop!=null){const l=document.querySelector('.lglist');if(l)l.scrollTop=lgTop}}catch(e){}
  try{Object.keys(kept).forEach(id=>{const e=document.getElementById(id);if(e&&!e.value)e.value=kept[id]});
    if(act){const e=document.getElementById(act.id);if(e&&e.focus){e.focus();if(e.setSelectionRange&&act.s!=null)e.setSelectionRange(act.s,act.e)}}}catch(e){}
  chatPost(chCtx);fitGame();
  flushFx();flushTaunt();flushGhost();flushPass();
  maybeRec();
  updAfterRender();
}
render();
fxBtnSync();
loadApproved();
restoreRoom();
updInit();
