});
function useMage(id){
  const st=G.st,p=st.turn,a=AUG[id];
  if(jobOf(st,p)!==a.cls)return say('마법사만 쓸 수 있는 증강입니다.',true),true;
  const need=manaCost(id,st,p);
  if(need>MANA_MAX&&!manaFree())return say('「'+a.name+'」에 필요한 마나가 '+need+'으로 최대치('+MANA_MAX+')를 넘어 더는 쓸 수 없습니다.',true),true;
  if(!manaOk(st,p,id))return say('마나가 부족합니다. 「'+a.name+'」에는 마나 '+need+'이(가) 필요하고, 지금 마나는 '+manaOf(st,p)+'입니다.',true),true;
  if(id==='m_charge'){
    if(manaFull(st,p))return say('마나가 가득 찼습니다. 최대 '+MANA_MAX+'까지 모을 수 있습니다.',true),true;
    st.mana[p]=manaOf(st,p)+1;st.passes=0;st.ko=null;
    castFx(st,id,p,[],{mana:st.mana[p]});lg(st,'마나 충전');
    endTurn('마나를 1 충전했습니다. (마나 '+st.mana[p]+') ');return true;
  }
  UI.pre=null;UI.sel=null;UI.tele=null;
  UI.mode=id==='m_tele'?'m_tele1':id;
  say(MODE_MSG[UI.mode]);return true;
}
/* 마법을 고른 뒤 판 위에서 누를 수 있는 곳(점선으로 표시) */
function mageTargets(st,p,m){
  const t=new Set(),n=st.n,b=st.board;
  if(m==='m_bolt'){
    const inv=invSet(st);
    for(let i=0;i<n*n;i++){if(b[i]){if(!inv.has(i))t.add(i)}else if(fkAt(st,p,i))t.add(i)}
  }else if(m==='m_barrier'){
    const seen=new Set();
    for(let i=0;i<n*n;i++){
      if(b[i]!==p||seen.has(i))continue;
      const g=groupOf(st,b,i);g.stones.forEach(k=>seen.add(k));
      if(!isProtected(st,g))g.stones.forEach(k=>t.add(k));
    }
  }else if(m==='m_tele2'&&UI.tele){
    const T=UI.tele;
    for(let i=0;i<n*n;i++)if(telePlan(st,p,T,i,T.rot).ok)t.add(i);
  }
  return t;
}
/* ---- 텔레포트: 공간이동의 강화판. 3×3 범위 안의 돌(내 돌·상대 돌)을 모양 그대로 다른 자리로 옮긴다.
   돌이 놓일 자리만 비어 있으면 되고(범위가 겹쳐도 된다), 90도씩 돌려서 놓을 수도 있다. 무적인 돌과 귤은 제자리에 남는다. ---- */
function telePlan(st,p,T,idx,rot){
  const n=st.n,d=meteorCenter(n,T.R,idx),cx=T.c%n,cy=(T.c/n)|0,dx0=d%n,dy0=(d/n)|0,inv=new Set(T.inv),b=st.board,moves=[];
  for(const i of T.cells){
    if(!b[i]||inv.has(i)||tangAt(st,i))continue;
    let ox=i%n-cx,oy=((i/n)|0)-cy;
    for(let r=0;r<(rot||0);r++){const t=ox;ox=-oy;oy=t}
    moves.push({from:i,to:(dy0+oy)*n+(dx0+ox),c:b[i]});
  }
  if(!moves.length||moves.every(m=>m.from===m.to))return{ok:false,d,reason:'같은 자리입니다. 다른 자리를 고르거나 모양을 돌려 보세요.'};
  const b2=b.slice();moves.forEach(m=>{b2[m.from]=0});
  for(const m of moves){
    if(b2[m.to]!==0)return{ok:false,d,reason:'돌이 놓일 자리가 막혀 있습니다. 옮겨진 돌이 놓일 곳은 비어 있어야 합니다.'};
    if((st.fire||[]).includes(m.to))return{ok:false,d,reason:'불타는 칸으로는 돌을 옮길 수 없습니다.'};
    if(iceOn(st,m.to))return{ok:false,d,reason:'얼어붙은 칸으로는 돌을 옮길 수 없습니다.'};
    if(fkAt(st,p,m.to))return{ok:false,d,reason:'돌이 놓여 있는 곳으로는 옮길 수 없습니다.'};
  }
  moves.forEach(m=>{b2[m.to]=m.c});
  return{ok:true,d,moves:moves.filter(m=>m.from!==m.to),board:b2};
}
function onPointMage(m,idx){
  if(!m||m.slice(0,2)!=='m_')return false;
  const st=G.st,p=st.turn,b=st.board,n=st.n,M=st.P.mage;
  if(m==='m_bolt'){
    if(b[idx]===0){
      if(!fkAt(st,p,idx))return say('돌이 있는 곳을 고르세요.',true),true;
      const fo=((st.fake||[]).find(f=>f.pts.includes(idx))||{}).owner||0;
      rmFake(st,idx);payMana(st,p,m);st.ko=null;
      castFx(st,m,p,[idx],{k:1,gh:fo?[[idx,fo,'',null]]:[]});lg(st,'낙뢰 '+cnm(st,idx));UI.mode=null;
      commit('낙뢰! '+cnm(st,idx)+'의 돌이 사라졌습니다. 차례는 그대로입니다. 이어서 착수하세요.');return true;
    }
    if(invSet(st).has(idx))return say('무적인 돌은 고를 수 없습니다.',true),true;
    const tg2=tangAt(st,idx),tg=!!tg2,own=b[idx]===p,gh=ghostList(st,[idx],b),gone=removeStones(st,[idx]);
    payMana(st,p,m);st.ko=null;
    castFx(st,m,p,gone.slice(),{k:gone.length,gh});lg(st,'낙뢰 '+cnm(st,idx));UI.mode=null;
    commit('낙뢰! '+cnm(st,idx)+'의 '+(own?'내':'상대')+' '+(tg?(tg2&&tg2.pts.length===3?'빼빼로가 통째로':'귤이 통째로'):'돌이')+' 사라졌습니다. 차례는 그대로입니다. 이어서 착수하세요.');return true;
  }
  if(m==='m_barrier'){
    if(b[idx]!==p)return say('무적으로 만들 내 돌을 고르세요.',true),true;
    const g=groupOf(st,b,idx);
    if(isProtected(st,g))return say('이미 무적인 돌 무리입니다.',true),true;
    const ex=wallExpiry(st,M.barrier);
    st.bar=st.bar||{};
    g.stones.forEach(k=>{st.shield[k]=ex;st.bar[k]=1});
    payMana(st,p,m);
    castFx(st,m,p,g.stones.slice(),{k:g.stones.length});lg(st,'베리어 '+cnm(st,idx));UI.mode=null;
    commit('베리어! 돌 '+g.stones.length+'개가 내 차례 '+M.barrier+'번이 지날 때까지 무적입니다. 차례는 그대로입니다. 이어서 착수하세요.');return true;
  }
  if(m==='m_meteor'){
    const A=M.meteor.area,H=M.meteor.hit;
    if(!UI.pre||UI.pre.m!==m||UI.pre.i!==idx){
      UI.pre={m,i:idx};
      say('보라색 구역 안의 무작위 위치에 메테오가 떨어집니다(진한 '+sq(H)+'이 한 번에 사라지는 크기). 가장자리를 골라도 구역은 판 안으로 밀려 들어옵니다. 이 자리로 정하려면 같은 곳을 한 번 더 누르세요.');return true;
    }
    UI.pre=null;
    /* 5×5 구역 안에 3×3이 온전히 들어오도록, 3×3의 중심은 구역 중심에서 (A-H)칸 이내에서 고른다 */
    const ac=meteorCenter(n,A,idx),cand=[];
    for(let i=0;i<n*n;i++)if(cheb(n,i,ac)<=A-H)cand.push(i);
    const c=cand[rnd(cand.length)],hit=[],inv=invSet(st);let blk=0;
    for(let i=0;i<n*n;i++)if(cheb(n,i,c)<=H&&b[i]){if(inv.has(i))blk++;else hit.push(i)}
    const gh=ghostList(st,hit,b),gone=removeStones(st,hit);
    let fkn=0;(st.fake||[]).forEach(f=>{const keep=f.pts.filter(i=>cheb(n,i,c)>H);f.pts.forEach(i=>{if(cheb(n,i,c)<=H)gh.push([i,f.owner,'',null])});fkn+=f.pts.length-keep.length;f.pts=keep});
    const tot=gone.length+fkn;
    st.ko=null;payMana(st,p,m);
    castFx(st,m,p,[c],{r:H,area:ac,ar:A,k:tot,cells:gone.slice(),gh});lg(st,'메테오 '+cnm(st,c));UI.mode=null;
    commit('메테오가 '+cnm(st,c)+' 주변에 떨어져 돌 '+tot+'개가 사라졌습니다.'+(blk?' 무적인 돌 '+blk+'개는 무사합니다.':'')+' 차례는 그대로입니다. 이어서 착수하세요.');return true;
  }
  if(m==='m_tele1'){
    const R=M.tele;
    if(!UI.pre||UI.pre.m!==m||UI.pre.i!==idx){
      UI.pre={m,i:idx};
      say('보라색 테두리가 옮길 '+sq(R)+' 범위입니다. 가장자리를 골라도 범위는 판 안으로 밀려 들어옵니다. 이 범위로 정하려면 같은 곳을 한 번 더 누르세요.');return true;
    }
    UI.pre=null;
    const c=meteorCenter(n,R,idx),cells=[];
    for(let i=0;i<n*n;i++)if(cheb(n,i,c)<=R)cells.push(i);
    const inv=invSet(st);
    if(!cells.some(i=>b[i]))return say('범위 안에 돌이 하나도 없습니다. 돌이 있는 곳을 포함하도록 다시 고르세요.',true),true;
    if(!cells.some(i=>b[i]&&!inv.has(i)&&!tangAt(st,i)))return say('범위 안의 돌이 모두 무적이거나 귤·빼빼로라 옮길 수 없습니다. 다시 고르세요.',true),true;
    UI.tele={c,R,cells,base:bstr(b),inv:[...inv],rot:0};
    UI.mode='m_tele2';UI.sel=null;
    say(MODE_MSG.m_tele2);return true;
  }
  if(m==='m_tele2'){
    const T=UI.tele,R=M.tele;
    if(!T||bstr(b)!==T.base){UI.tele=null;UI.mode=null;UI.sel=null;UI.pre=null;return say('판이 바뀌어 텔레포트가 취소되었습니다.',true),true}
    const w=telePlan(st,p,T,idx,T.rot),res=w.ok?settleBoard(st,w.board,p):null;
    if(!UI.pre||UI.pre.m!=='m_tele2'||UI.pre.i!==idx||UI.pre.rot!==T.rot){
      UI.pre={m:'m_tele2',i:idx,rot:T.rot};
      say(!w.ok?w.reason+' 다른 자리를 고르세요.':!res.ok?res.reason+' 다른 자리를 고르세요.':'보라색 점선이 옮겨질 모양입니다. 이 자리로 정하려면 같은 곳을 한 번 더 누르세요. (「돌리기」로 모양을 돌릴 수 있습니다)',!w.ok||!res.ok);
      return true;
    }
    UI.pre=null;
    if(!w.ok)return say(w.reason,true),true;
    if(!res.ok)return say(res.reason,true),true;
    const moves=w.moves;
    const tr=moves.map(mv=>{const sk=st.sick&&st.sick[mv.from];return [mv.from,mv.to,mv.c,(st.sp&&st.sp[mv.from])||'',sk?[sk.k,sk.left]:null]});
    const tags={},sks={};
    moves.forEach(mv=>{if(st.sp[mv.from])tags[mv.to]=st.sp[mv.from];if(st.sick&&st.sick[mv.from])sks[mv.to]=st.sick[mv.from];delete st.sp[mv.from];if(st.sick)delete st.sick[mv.from];delete st.shield[mv.from]});
    Object.assign(st.sp,tags);if(st.sick)Object.assign(st.sick,sks);
    {const mp={};moves.forEach(mv=>{mp[mv.from]=mv.to});remapHid(st,mp)}
    castFx(st,'m_tele',p,moves.map(mv=>mv.to),{mv:moves.map(mv=>[mv.from,mv.to]),c:T.c,d:w.d,r:T.R,k:res.captured.length,tr});
    applyBoardRes(st,p,res);
    st.ko=null;payMana(st,p,'m_tele');st.last=moves[moves.length-1].to;
    lg(st,'텔레포트 '+moves.length+'개');
    UI.mode=null;UI.tele=null;UI.sel=null;
    moves.forEach(mv=>{if(st.board[mv.to])mineBoom(st,mv.to,st.board[mv.to])});
    commit('텔레포트! 돌 '+moves.length+'개를 '+cnm(st,w.d)+' 쪽으로 옮겼습니다.'+(res.captured.length?' 사석 '+res.captured.length+'개를 얻었습니다.':'')+' 차례는 그대로입니다. 이어서 착수하세요.');return true;
  }
  return false;
}

/* 전직을 되돌린다(증강 체험에서 전직 카드를 뺄 때): 가진 증강이 모두 비게 된다 */
function dropJob(st,p){
  job7Drop(st,p);
  st.job=st.job||per(()=>null);st.mana=st.mana||per(()=>0);
  st.job[p]=null;st.augs[p]=[];st.left[p]={};st.mana[p]=0;st.mUse=st.mUse||per(()=>({}));st.mUse[p]={};
}
const jobCardId=job=>(AUGS.find(a=>a.type==='job'&&a.job===job)||{}).id;
/* 증강 체험의 「받은 증강」 기록: 전직했다면 직업 전용 증강 대신 전직 카드를 적어 둔다 */
const labPickOf=(st,p)=>jobOf(st,p)?[jobCardId(jobOf(st,p))]:st.augs[p].slice();

/* 텔레포트 연출의 시각표(ms). 스캔선이 위에서 아래로 훑으며 돌이 분해되고(src), 아래에서 위로 훑으며 새 자리에서 맞춰진다(dst).
   캔버스 효과와 판 위 그림이 같은 표를 쓴다. */
const TELE_T={scan0:120,scanD:440,arr0:760,arrD:440,disD:360,asmD:310};
function teleTimes(ev,n){
  const R=ev.r||1,H=2*R+1,y0=((ev.c/n)|0)-R-.5,y1=(((ev.d!=null?ev.d:ev.c)/n)|0)-R-.5,nz=v=>Math.min(1,Math.max(0,v)),mv=ev.mv||[];
  const src=mv.map(m=>Math.round(TELE_T.scan0+nz((((m[0]/n)|0)-y0)/H)*TELE_T.scanD));
  const dst=mv.map(m=>Math.round(TELE_T.arr0+(1-nz((((m[1]/n)|0)-y1)/H))*TELE_T.arrD));
  return Object.assign({src,dst,end:Math.max(TELE_T.arr0+TELE_T.arrD,...dst.map(d=>d+TELE_T.asmD))},TELE_T);
}
/* ===== 새 증강 10종 로직: 빼빼로·하천·해일·빙결·돌려돌려 돌림판·설상가상·범람·증식·핑거스냅·복제 =====
   - 얼음(st.ice)과 복제(hasAug)의 규칙은 core.js 에 있다(착수 불가·무적·소유 판정).
   - 강(st.river)은 한 수가 끝날 때마다 flowTick 이 돌을 한 칸씩 옮긴다. 해일은 같은 이동 계산을 판 전체에 한 번 적용한다.
   - 빼빼로는 귤과 같은 st.tang 항목(칸 3개)으로 저장한다. 칸 수로 종류를 알 수 있다(3칸=빼빼로, 4칸=귤). */
/* 돌림판 확률표(%): [나오는 수, 확률]. 합계는 정확히 100 */
const WHEEL=[[1,58],[2,15],[3,5],[4,1],[5,0.1],[10,0.0001],[0,15],[-1,5],[-2,0.899],[-3,0.0009]];
const anyLegalMove=(st,p)=>{for(let i=0;i<st.n*st.n;i++)if(st.board[i]===0&&checkMove(st,i,p).ok)return true;return false};
const colName=(st,x)=>coordName(st.n,x).replace(/\d+/,'');
Object.assign(MODE_MSG,{
  pocky:'빼빼로를 놓을 자리를 누르세요. 누른 곳이 3×1 칸의 왼쪽(세로면 위쪽) 끝이 되며, 점선으로 표시된 곳이 가능합니다. 표시된 3칸을 한 번 더 누르면 놓이고, 「돌리기」로 가로·세로를 바꿉니다.',
  river:'강이 흐르게 할 열을 고르세요. 그 열의 어느 칸을 눌러도 됩니다.',
  freeze:'얼릴 4×4 구역 안의 한 칸을 고르세요. 고른 칸이 구역의 왼쪽 위 가까이에 오도록 구역이 잡힙니다.'
});
GAMEACTS.add('pockyRot');SPECBLOCK.add('pockyRot');GAMEACTS.add('pockyGo');SPECBLOCK.add('pockyGo');

/* ---- 얼음 ---- */
function addIce(st,pt,exp,seal){   /* seal: 주술사의 봉인(얼음과 규칙은 같고 모양만 다르다) */
  st.ice=st.ice||[];
  const e=st.ice.find(x=>x.pt===pt);
  if(e){if(exp>=e.exp){if(seal)e.seal=1;else delete e.seal}e.exp=Math.max(e.exp,exp)}else st.ice.push(seal?{pt,exp,seal:1}:{pt,exp});
}
const iceCells=st=>(st.ice||[]).filter(e=>e.exp>st.ply).map(e=>e.pt);
/* 빙결 구역: 고른 칸이 구역의 두 번째 줄·열에 오도록 잡고, 판 밖으로 나가면 안쪽으로 민다 */
function freezeBox(n,A,idx){
  const x0=Math.min(n-A,Math.max(0,(idx%n)-1)),y0=Math.min(n-A,Math.max(0,((idx/n)|0)-1)),cells=[];
  for(let y=0;y<A;y++)for(let x=0;x<A;x++)cells.push((y0+y)*n+x0+x);
  return{anchor:y0*n+x0,cells};
}

/* ---- 강과 해일: 돌 이동 계산 ----
   돌 하나, 귤, 빼빼로를 각각 한 덩어리로 보고 덩어리마다 이동 방향을 정한다.
   막히는 경우: 무적인 돌(성벽·베리어·얼음)과 얼어붙은 빈 칸, 가지 않는 덩어리가 앞에 있을 때, 같은 칸을 두고 다툴 때.
   귤·빼빼로는 판 가장자리에서 멈춘다. 돌 하나는 해일에서는 판 밖으로 떠내려가지만, 강(noFall)에서는 가장자리에서 멈춘다.
   계산만 하고 판은 바꾸지 않는다. */
function shiftBodies(st,vecOf,noFall){
  const n=st.n,N=n*n,b=st.board,bodies=[],tc=new Set();
  const lock=i=>(st.shield[i]||0)>st.ply||iceOn(st,i);
  (st.tang||[]).forEach((t,ti)=>{bodies.push({cells:t.pts.slice(),c:t.c,tang:true,ti,fixed:t.pts.some(lock)});t.pts.forEach(k=>tc.add(k))});
  for(let i=0;i<N;i++){if(!b[i]||tc.has(i))continue;bodies.push({cells:[i],c:b[i],tang:false,fixed:lock(i)})}
  bodies.forEach((B,k)=>{B.k=k;B.v=B.fixed?null:vecOf(B);B.go=!!B.v;
    if(!B.go)return;
    B.nc=B.cells.map(c=>{const x=c%n+B.v[0],y=((c/n)|0)+B.v[1];return(x<0||y<0||x>=n||y>=n)?-1:y*n+x});
    if((B.tang||noFall)&&B.nc.some(t=>t<0))B.go=false;
    else if(B.nc.some(t=>t>=0&&!B.cells.includes(t)&&!b[t]&&iceOn(st,t)))B.go=false;
    if(!B.go)B.hard=true;   /* 가장자리·얼음 때문에 처음부터 갈 수 없음 */
  });
  let lost=false;
  for(let ch=true,g=0;ch&&g<bodies.length+8;g++){
    ch=false;
    const occ=new Map();
    bodies.forEach(B=>{(B.go?B.nc:B.cells).forEach(c=>{if(c<0)return;let l=occ.get(c);if(!l)occ.set(c,l=[]);l.push(B)})});
    occ.forEach((L0,cell)=>{
      /* 같은 바퀴에서 앞서 막힌 덩어리는 이 칸을 더 이상 차지하지 않으므로 빼고 센다 */
      const L=L0.filter(B=>B.go?B.nc.includes(cell):B.cells.includes(cell));
      if(L.length<2)return;
      const stay=L.find(B=>!B.go);
      const win=stay||L.slice().sort((x,y)=>(Math.abs(y.v[1])-Math.abs(x.v[1]))||(x.k-y.k))[0];
      L.forEach(B=>{if(B!==win&&B.go){B.go=false;ch=true;if(!stay)lost=true}});
    });
  }
  /* 같은 칸을 다투다 진 덩어리는, 이긴 덩어리가 다른 이유로 못 움직이게 되면 갈 수 있게 된 것이므로 다시 시도한다.
     (이미 움직이기로 한 덩어리는 건드리지 않고, 막힌 덩어리를 우선순위 순서로 하나씩 더해 가며 더 못 늘릴 때까지 반복) */
  if(lost){
    const cand=bodies.filter(B=>B.v&&!B.hard).sort((x,y)=>(Math.abs(y.v[1])-Math.abs(x.v[1]))||(x.k-y.k));
    for(let ch=true,g=0;ch&&g<cand.length+2;g++){
      ch=false;
      const claim=new Set(),still=new Set();
      bodies.forEach(B=>{if(B.go)B.nc.forEach(c=>{if(c>=0)claim.add(c)});else B.cells.forEach(c=>still.add(c))});
      cand.forEach(B=>{
        if(B.go||B.nc.some(t=>t>=0&&!B.cells.includes(t)&&(claim.has(t)||still.has(t))))return;
        B.go=true;ch=true;
        B.nc.forEach(c=>{if(c>=0)claim.add(c)});B.cells.forEach(c=>still.delete(c));
      });
    }
  }
  return bodies;
}
/* shiftBodies 의 결과를 판에 적용한다. 움직인 돌이 없으면 null.
   돌이 옮겨 가면 그 돌에 붙은 표식·병·숨은 돌 기록·입구자 지정·마지막 수 표시도 함께 따라간다. 지뢰가 묻힌 칸에 들어서면 터진다. */
function applyShift(st,bodies){
  const n=st.n,b=st.board,moved=bodies.filter(B=>B.go);
  if(!moved.length)return null;
  const mv=[],fl=[],tm=[],mp={},fall=new Set(),tags={},land=[],sp0=Object.assign({},st.sp||{}),sk0=st.sick?JSON.parse(JSON.stringify(st.sick)):{};
  moved.forEach(B=>B.cells.forEach(c=>{b[c]=0}));
  moved.forEach(B=>{
    if(B.tang){
      B.cells.forEach((c,j)=>{b[B.nc[j]]=B.c;mp[c]=B.nc[j]});
      const t=st.tang[B.ti];if(t)t.pts=B.nc.slice();
      tm.push([B.cells.slice(),B.nc.slice(),B.c]);return;
    }
    const c=B.cells[0],t=B.nc[0];
    if(t<0){fl.push([c,B.c,sp0[c]||'',sk0[c]?[sk0[c].k,sk0[c].left|0]:null]);fall.add(c)}
    else{b[t]=B.c;mp[c]=t;land.push([t,B.c]);if(sp0[c])tags[t]=sp0[c];mv.push([c,t,B.c,sp0[c]||'',sk0[c]?[sk0[c].k,sk0[c].left|0]:null])}
  });
  moved.forEach(B=>{if(B.tang)return;const c=B.cells[0];delete st.sp[c];delete st.shield[c];if(st.bar)delete st.bar[c]});
  if(st.sick)fall.forEach(c=>{delete st.sick[c]});
  Object.keys(tags).forEach(t=>{st.sp[t]=tags[t]});
  if(st.hid&&st.hid.stones)st.hid.stones=st.hid.stones.filter(h=>!fall.has(h.idx));
  remapHid(st,mp,fall);
  if(st.rec3)Object.keys(st.rec3).forEach(q=>{st.rec3[q]=st.rec3[q].map(i=>mp[i]!=null?mp[i]:fall.has(i)?-1:i)});
  (st.timers||[]).forEach(q=>{if(q.kind==='ipgu'){if(mp[q.target]!=null)q.target=mp[q.target];else if(fall.has(q.target))q.target=-1}});
  fl.forEach(f=>{if(f[1]===NEUTC)return;const cr=NP(st)===2?3-f[1]:nextP(st,f[1]);st.prisoners[cr]++});   /* 떠내려간 중립돌은 누구의 몫도 아니다 */
  if(st.last!=null){if(mp[st.last]!=null)st.last=mp[st.last];else if(fall.has(st.last))st.last=null}
  st.ko=null;
  land.forEach(([t,c])=>{if(b[t]===c&&mineAt(st,t))mineBoom(st,t,c)});
  return{mv:mv.slice(0,60),fl:fl.slice(0,60),tm:tm.slice(0,12),n:mv.length+fl.length+tm.length,fall:fl.length,mp};
}
/* 강의 칸마다 흐르는 방향: 세로 강은 아래(↓), 가로 강은 오른쪽(→). 두 강이 겹치면 아래가 우선 */
function riverVec(st){
  const n=st.n,m=new Map();
  (st.river||[]).forEach(r=>{
    for(let k=0;k<n;k++){
      if(r.d==='v')m.set(k*n+r.i,[0,1]);
      else{const i=r.i*n+k;if(!m.has(i))m.set(i,[1,0])}
    }
  });
  return m;
}
/* 덩어리 하나가 흐를 방향: 칸 중 하나라도 세로 강 위에 있으면 아래, 아니면 가로 강 위에 있을 때 오른쪽, 강 위에 없으면 제자리 */
function riverMover(st){
  const vm=riverVec(st);
  return B=>{let v=null;for(const c of B.cells){const x=vm.get(c);if(x&&(!v||(x[1]&&!v[1])))v=x}return v};
}
/* 강 위에 돌을 놓으면 그 수가 끝날 때 돌이 한 칸 흘러가 버린다. 흘러간 자리에서 활로를 잃어 바로 잡히는 자리라면(둔 돌이 그냥 사라진 것처럼 보인다) 착수를 막는다.
   놓은 직후의 판(r.board)에서 강물 이동과 따내기를 판만 복사해 미리 계산한다. 이중 착수·돌림판처럼 같은 차례에 돌이 더 놓일 수 있으면 따지지 않는다. */
function riverDoom(st,idx,p,r){
  if(!st.river||!st.river.length||st.extra||(st.multi&&st.multi.left>1))return false;
  if(!riverVec(st).has(idx))return false;
  const s2={n:st.n,board:r.board.slice(),tang:st.tang,shield:st.shield||{},ply:st.ply,ice:st.ice,river:st.river};
  const bodies=shiftBodies(s2,riverMover(s2),true);
  let pos=idx;
  const B0=bodies.find(B=>!B.tang&&B.cells[0]===idx);
  if(B0&&B0.go)pos=B0.nc[0];
  const b=s2.board,moved=bodies.filter(B=>B.go);
  moved.forEach(B=>B.cells.forEach(c=>{b[c]=0}));
  moved.forEach(B=>B.nc.forEach((t,j)=>{if(t>=0)b[t]=B.c}));
  const seen=new Set(),pass=only=>{
    for(let i=0;i<s2.n*s2.n;i++){
      const c=b[i];if(!c||seen.has(i)||!only(c))continue;
      const g=groupOf(s2,b,i);g.stones.forEach(k=>seen.add(k));
      if(!g.libs.length&&!isProtected(s2,g))g.stones.forEach(k=>{b[k]=0});
    }
  };
  pass(c=>c!==p);pass(c=>c===p);
  return b[pos]!==p;
}
/* 한 수가 끝날 때마다: 녹은 얼음을 정리하고, 강 위의 돌을 한 칸씩 흘려보낸다.
   강의 끝에 닿은 돌은 판 밖으로 나가지 않고 그 자리에 멈춘다(뒤따르는 돌도 그 뒤에 차례로 쌓인다). */
function flowTick(st,mover){
  st.ice=(st.ice||[]).filter(e=>e.exp>st.ply);
  if(!st.river||!st.river.length)return '';
  const bodies=shiftBodies(st,riverMover(st),true);
  const r=applyShift(st,bodies);
  if(!r)return '';
  const le=st.log&&st.log[st.log.length-1];   /* 방금 둔 돌이 흘러갔다면 기록의 마지막 수 표시도 따라간다 */
  if(le&&le.n===st.moveNo&&le.lm!=null&&r.mp[le.lm]!=null)le.lm=r.mp[le.lm];
  fxAdd(st,{kind:'cast',id:'river',p:mover,pts:[],quiet:true,mv:r.mv,tm:r.tm,rv:st.river.map(x=>[x.d==='v'?0:1,x.i]).slice(0,20)});
  lg(st,'강물 '+r.n+'개');
  const sw=sweep(mover);   /* 흘러가서 활로를 잃은 돌 무리는 이 자리에서 바로 잡힌다(둔 쪽 무리는 상대 무리를 먼저 잡은 뒤에 따진다) */
  return '강물에 돌 '+r.n+'개가 흘렀습니다. '+(sw?'강물에 밀려 활로를 잃은 돌 '+sw+'개가 잡혔습니다. ':'');
}

/* ---- 설상가상(패시브): 착수할 때마다 무작위 칸이 얼어붙는다 ---- */
function frostHook(st,p){
  const F=st.P.frost,n=st.n,own=[],opp=[],emp=[];
  for(let i=0;i<n*n;i++){if(iceOn(st,i))continue;const c=st.board[i];(c===p?own:c?opp:emp).push(i)}
  const cats=[[F.own,own],[F.opp,opp],[F.empty,emp]].filter(x=>x[1].length);
  if(!cats.length)return;
  let r=Math.random()*cats.reduce((s,x)=>s+x[0],0),pick=cats[cats.length-1][1];
  for(const [w,l] of cats){if(r<w){pick=l;break}r-=w}
  const i=pick[rnd(pick.length)],had=st.board[i];
  addIce(st,i,st.ply+1+F.plies);
  fxAdd(st,{kind:'cast',id:'frost',p,pts:[i],quiet:true,own:had===p?1:had?2:0});
  lg(st,'서리 '+cnm(st,i));
  st.boomTxt=(st.boomTxt||'')+' 설상가상! '+cnm(st,i)+(had?(had===p?'의 내 돌':'의 상대 돌'):'')+'이(가) '+F.plies+'수 동안 얼어붙었습니다.';
}
/* ---- 증식(패시브): 5% 확률로 무작위 빈 칸에 내 돌이 하나 더 놓인다 ---- */
function spawnHook(st,p){
  if(!chance(st.P.spawn.p))return;
  const n=st.n,cand=[];
  for(let i=0;i<n*n;i++){
    if(st.board[i]||(st.fire||[]).includes(i)||(st.mines||[]).some(m=>m.pt===i))continue;
    const r=simulate(st,i,p);if(r.ok&&st.ko!==i)cand.push([i,r]);
  }
  if(!cand.length)return;
  const [i,r]=cand[rnd(cand.length)];
  madGain(st,st.board,r.captured);st.board=r.board;st.prisoners[p]+=r.captured.length;r.captured.forEach(q=>{delete st.shield[q]});bombBoom(st,r.captured);
  if(r.captured.length){st.ko=null;fxAdd(st,{kind:'cap',p,pts:r.captured.slice()})}
  fxAdd(st,{kind:'cast',id:'spawn',p,pts:[i],quiet:true});
  lg(st,'증식 '+cnm(st,i));
  st.boomTxt=(st.boomTxt||'')+' 증식! '+cnm(st,i)+'에 내 돌이 하나 더 생겼습니다.'+(r.captured.length?' 사석 '+r.captured.length+'개를 얻었습니다.':'');
}
/* ---- 핑거스냅(패시브): 얻는 순간 판 위 돌의 절반이 무작위로 사라진다 ---- */
function snapDo(st,p){
  const n=st.n,inv=invSet(st),units=[],seen=new Set();
  for(let i=0;i<n*n;i++){
    if(!st.board[i]||seen.has(i))continue;
    const t=tangAt(st,i);
    if(t){t.pts.forEach(k=>seen.add(k));units.push({i:t.pts[0],lock:t.pts.some(k=>inv.has(k))})}
    else{seen.add(i);units.push({i,lock:inv.has(i)})}
  }
  const k=Math.floor(units.length*st.P.snap.ratio),gone=shuffle(units.filter(u=>!u.lock)).slice(0,k);
  const gh=ghostList(st,gone.map(u=>u.i),st.board.slice()),cells=removeStones(st,gone.map(u=>u.i));
  st.ko=null;st.tang=(st.tang||[]).filter(q=>q.pts.every(k=>st.board[k]===q.c));
  castFx(st,'snap',p,cells.slice(0,80),{k:gone.length,tot:units.length,gh:gh.slice(0,60)});
  lg(st,'핑거스냅 '+gone.length+'개');
  st.boomTxt=(st.boomTxt||'')+' 핑거스냅! 판 위의 돌 '+gone.length+'개가 사라졌습니다.';
}
/* ---- 범람(패시브): 얻는 순간 무작위 행·열 5곳에 강이 흐른다 ---- */
function floodDo(st,p){
  const n=st.n,all=[];
  for(let i=0;i<n;i++){all.push({d:'v',i});all.push({d:'h',i})}
  const free=all.filter(x=>!(st.river||[]).some(r=>r.d===x.d&&r.i===x.i)),pick=shuffle(free).slice(0,Math.min(st.P.flood.n,free.length));
  st.river=st.river||[];
  pick.forEach(x=>st.river.push({d:x.d,i:x.i,by:p}));
  castFx(st,'flood',p,[],{rv:pick.map(x=>[x.d==='v'?0:1,x.i])});
  lg(st,'범람 '+pick.length+'곳');
  st.boomTxt=(st.boomTxt||'')+' 범람! 무작위 행과 열 '+pick.length+'곳에 강이 흐릅니다.';
}

/* ---- 돌림판 ---- */
function spinWheel(){
  let r=Math.random()*100,acc=0;
  for(const [v,pr] of WHEEL){acc+=pr;if(r<acc)return v}
  return 1;
}
const wheelTxt=r=>r+'수';
function wheelDo(st,p){
  const r=spinWheel();
  spend(st,p,'wheel');
  castFx(st,'wheel',p,[],{r});
  lg(st,'돌림판 '+wheelTxt(r));
  if(r>=2){
    st.multi={left:r,all:r};
    return commit('돌림판: '+wheelTxt(r)+'! 이번 차례에 돌을 '+r+'개 놓을 수 있습니다. 하나씩 착수하세요. 남기고 싶으면 「남은 돌 건너뛰기」를 누르세요.');

    if(!cur||(cur!==sw&&cur!==NEUTC))delete j.orig[pt];
  })});
  if(st.curse)st.curse=st.curse.filter(e=>st.board[e.pt]&&trueColor(st,e.pt)===e.c&&st.sp&&st.sp[e.pt]==='d');
  if(st.boxes)st.boxes=st.boxes.filter(b=>!st.board[b.pt]);
  if(st.cups){const ac=actOf(st);st.cups=st.cups.filter(c=>ac.includes(c.by)&&ac.includes(c.to)&&jobOf(st,c.by)==='clown')}   /* 광대나 고를 사람이 빠지면 농락도 사라진다 */
  if(st.ofs){const shs=actOf(st).filter(q=>jobOf(st,q)==='shaman');st.ofs=st.ofs.filter(i=>st.board[i]&&shs.includes(trueColor(st,i))&&(st.altar||[]).includes(i))}
}

/* ---- 카드: 광대의 자원은 농락(컵 게임)에서만 얻는다. 예전에 따낸 돌에서 광기를 얻던 자리는 비워 둔다 ---- */

/* ---- 중립돌 · 조커 · 공중곡예 · 저주: 수가 끝날 때 기한이 된 것을 푼다 ---- */
function revertNeutral(st,all){
  let k=0;
  (st.neut||[]).forEach(e=>{if(all||e.exp<=st.ply){if(st.board[e.pt]===NEUTC){st.board[e.pt]=e.c;k++}}});
  st.neut=(st.neut||[]).filter(e=>!(all||e.exp<=st.ply)&&st.board[e.pt]===NEUTC);
  return k;
}
function revertJoker(st,all){
  let k=0;
  (st.joker||[]).forEach(j=>{
    if(!(all||j.exp<=st.ply))return;
    Object.keys(j.orig).forEach(pt=>{
      const oc=j.orig[pt],cur=st.board[pt],sw=oc===j.p?j.q:j.p;
      if(cur===sw){st.board[pt]=oc;k++}
      else if(cur===NEUTC){const e=(st.neut||[]).find(x=>x.pt===+pt);if(e&&e.c===sw)e.c=oc}   /* 바뀐 채로 중립돌이 된 돌: 돌아올 색도 원래대로 */
    });
  });
  st.joker=(st.joker||[]).filter(j=>!(all||j.exp<=st.ply));
  (st.tang||[]).forEach(t=>{const c=st.board[t.pts[0]];if(c&&c!==NEUTC&&t.pts.every(i=>st.board[i]===c))t.c=c});
  return k;
}
/* 하늘에서 떨어진 돌: 떠난 자리 그대로 낙하해 그 자리의 돌을 제거하고 놓인다. 낙하한 돌이 상대 무리의 마지막 활로를 메우면 따낸다 */
function landSky(st,all){
  const due=(st.sky||[]).filter(e=>all||e.exp<=st.ply);
  if(!due.length)return '';
  st.sky=(st.sky||[]).filter(e=>!(all||e.exp<=st.ply));
  let n=0,lost=0,crush=0,cap=0;const landed=[],gh=[],fails=[];
  due.forEach(e=>{
    const pt=e.pt,c=e.c,inv=invSet(st);
    if(st.board[pt]){
      if(inv.has(pt)||tangAt(st,pt)){lost++;fails.push(pt);return}
      gh.push(...ghostList(st,[pt],st.board.slice()));
      forget7(st,[pt]);removeStones(st,[pt]);crush++;
    }
    if(iceOn(st,pt)||(st.fire||[]).includes(pt)){lost++;fails.push(pt);return}
    st.board[pt]=c;landed.push(pt);n++;
    if(e.sp)st.sp[pt]=e.sp;
    const seen=new Set();
    nb(st.n,pt).forEach(m=>{
      const d=st.board[m];if(!d||d===c||seen.has(m))return;
      const g=groupOf(st,st.board,m);g.stones.forEach(k=>seen.add(k));
      if(!g.libs.length&&!isProtected(st,g)){
        const pre=st.board.slice();
        g.stones.forEach(k=>{st.board[k]=0;delete st.shield[k]});st.prisoners[c]+=g.stones.length;cap+=g.stones.length;
        madGain(st,pre,g.stones);bombBoom(st,g.stones);
      }
    });
  });
  landed.forEach(pt=>{if(st.board[pt])mineBoom(st,pt,st.board[pt])});
  st.ko=null;
  if(n||lost)fxAdd(st,{kind:'cast',id:'c_sky',p:due[0].by,pts:landed.slice(0,40),quiet:true,land:1,k:crush,cap,gh:gh.slice(0,30),fl:fails.slice(0,20)});
  if(n||lost)lg(st,'낙하 '+n+'개');
  return '하늘로 갔던 돌 '+n+'개가 떨어졌습니다.'+(crush?' 그 자리의 돌 '+crush+'개가 사라졌습니다.':'')+(cap?' 상대 돌 '+cap+'개를 따냈습니다.':'')+(lost?' 낙하할 수 없던 돌 '+lost+'개는 사라졌습니다.':'')+' ';
}
/* endTurn 에서 부른다(ply 가 이미 올라간 뒤). 저주는 기한이 없어 여기서 풀지 않는다 */
function tick7(st,mover){
  ensure7(st);
  let msg='',k;
  if((k=revertNeutral(st)))msg+='중립돌 '+k+'개가 원래 주인의 돌로 돌아왔습니다. ';
  if((k=revertJoker(st)))msg+='조커의 효과가 끝나 돌 '+k+'개의 색이 원래대로 돌아왔습니다. ';
  msg+=landSky(st);
  if(st.cool&&st.cool[mover]>0)st.cool[mover]--;   /* 농락을 쓸 수 없는 차례가 하나 지났다 */
  return msg;
}
/* 종국(계가) 직전: 기한이 남은 효과 중 점수에 섞이면 안 되는 것(중립돌·바뀐 색·하늘의 돌)을 모두 푼다. 저주는 점수 규칙이 알고 있으니 그대로 둔다 */
function settle7(st){
  ensure7(st);
  revertNeutral(st,true);revertJoker(st,true);landSky(st,true);
  st.boxes=[];st.cups=[];
}

/* ---- 깜짝상자 ---- */
const boxAt=(st,i)=>(st.boxes||[]).find(b=>b.pt===i);
const boxesFor=(st,viewer)=>viewer?(st.boxes||[]).filter(b=>b.by===viewer&&!st.board[b.pt]).map(b=>b.pt):[];
/* 깜짝상자가 있는 칸에 상대가 돌을 놓았다(돌이 도착했다): 그 칸의 가로 3·세로 3 십자 범위의 돌이 사라진다. 무적인 돌은 남는다 */
function boxBoom(st,idx,p){
  const all=(st.boxes||[]).filter(b=>b.pt===idx);
  if(!all.length)return 0;
  const hit=all.filter(b=>b.by!==p);
  st.boxes=(st.boxes||[]).filter(b=>b.pt!==idx);   /* 내 상자 위에 내가 두면 조용히 사라진다 */
  if(!hit.length)return 0;
  const n=st.n,cells=crossCells(n,idx).map(c=>c[2]),inv=invSet(st);
  const kill=cells.filter(i=>st.board[i]&&!inv.has(i));
  const gh=ghostList(st,kill,st.board.slice());
  const gone=kill.length?removeStones(st,kill):[];
  const cs=new Set(cells);
  (st.fake||[]).forEach(f=>{f.pts=f.pts.filter(i=>!cs.has(i))});
  st.ko=null;
  fxAdd(st,{kind:'cast',id:'c_box',p:hit[0].by,pts:[idx],quiet:true,boom:1,cells,k:gone.length,gh:gh.slice(0,10)});
  lg(st,'깜짝상자 폭발 '+cnm(st,idx));
  st.boomTxt=(st.boomTxt||'')+'깜짝상자가 터졌습니다! '+cnm(st,idx)+' 십자 범위의 돌 '+gone.length+'개가 사라졌습니다. ';
  return gone.length;
}

/* ---- 농락: 컵 세 개 중 하나에 공을 숨긴다. 상대는 자기 차례가 시작될 때 컵을 고르고, 빗나가면 카드를 얻는다 ---- */
const cupOf=(st,by)=>(st.cups||[]).find(c=>c.by===by);                        /* 내가 걸어 둔(상대의 선택을 기다리는) 농락 */
const cupWait=st=>(st&&!st.over&&!st.phase&&!(st.out||[]).includes(st.turn))?(st.cups||[]).find(c=>c.to===st.turn)||null:null;   /* 지금 차례인 사람이 골라야 하는 농락 */
const cupCool=(st,p)=>(st&&st.cool&&st.cool[p])||0;
const cupCan=(st,p)=>jobOf(st,p)==='clown'&&OPP(st,p)!==p&&!cupOf(st,p)&&cupCool(st,p)<=0;
function cupStart(st,p){
  if(OPP(st,p)===p)return say('농락할 상대가 없습니다.',true),true;
  if(cupOf(st,p))return say('상대가 컵을 고르는 중입니다. 선택이 끝난 뒤에 다시 쓰세요.',true),true;
  if(cupCool(st,p)>0)return say('들켜서 농락을 쓸 수 없습니다. 내 차례 '+cupCool(st,p)+'번이 지나야 다시 쓸 수 있습니다.',true),true;
  UI.pre=null;UI.sel=null;UI.sky=null;UI.mode='c_cup';
  say(MODE_MSG.c_cup);return true;
}
Object.assign(ACT,{
  /* 광대: 공을 숨길 컵 고르기 */
  cupHide(a){
    const st=G.st,p=st.turn,k=+a,N=st.P.clown.cup.n;
    if(UI.mode!=='c_cup'||!(k>=0&&k<N))return;
    if(NET&&!NET.lab&&p!==mySeat())return;
    if(!cupCan(st,p)){UI.mode=null;return say('지금은 농락을 쓸 수 없습니다.',true)}
    const q=OPP(st,p);
    (st.cups=st.cups||[]).push({by:p,to:q,ball:k});
    st.passes=0;st.ko=null;
    castFx(st,'c_cup',p,[],{set:1,q,cn:N});   /* 이벤트의 n은 순번이라 컵 개수는 cn */
    lg(st,'농락');UI.mode=null;
    commit('농락! 컵 하나에 공을 숨겼습니다. '+NAME[q]+'이(가) 다음 차례가 시작될 때 컵을 고릅니다. 차례는 그대로입니다. 이어서 착수하세요.');
  },
  /* 고르는 사람: 컵 하나 고르기 */
  cupPick(a){
    const st=G.st,p=st.turn,k=+a,c=cupWait(st);
    if(!c||!(k>=0&&k<st.P.clown.cup.n))return;
    if(NET&&!NET.lab&&p!==mySeat())return;
    const by=c.by,hit=c.ball===k;
    st.cups=st.cups.filter(x=>x!==c);
    let msg,gain=0;
    if(hit){
      st.cool[by]=st.P.clown.cup.cool;
      msg=NAME[p]+'이(가) 공이 든 컵을 맞혔습니다! '+NAME[by]+'은(는) 내 차례 '+st.P.clown.cup.cool+'번 동안 농락을 쓸 수 없습니다. ';
    }else{
      const mx=st.P.clown.madMax,cur=st.mad[by]||0,add=Math.min(1,mx-cur);
      if(add>0)st.mad[by]=cur+add;
      gain=Math.max(0,add);
      msg=NAME[p]+'이(가) 빈 컵을 골랐습니다. '+NAME[by]+'은(는) '+(add>0?'카드를 1 얻었습니다. (카드 '+st.mad[by]+') ':'카드가 가득 차 더 얻지 못했습니다. ');
    }
    castFx(st,'c_cup',by,[],{res:1,hit,k,ball:c.ball,q:p,cn:st.P.clown.cup.n,card:st.mad[by]||0,gain});
    lg(st,'농락 '+(hit?'적중':'빗나감'));
    commit(msg+'이어서 착수하세요.');
  }
});
/* 판 위의 행동을 막는 관문: 컵을 고르기 전에는 돌을 놓거나 증강을 쓸 수 없다 */
function cupGate(){
  const st=G&&G.st;if(!st||!cupWait(st))return false;

  say('농락! 먼저 컵을 골라야 합니다. 공이 든 컵을 맞히면 상대가 농락을 쓸 수 없게 됩니다.',true);

}

/* ---- 전직할 때·풀 때 ---- */
function shamanInit(st,p){
  if((st.altar||[]).length&&actOf(st).some(q=>q!==p&&jobOf(st,q)==='shaman'))return;   /* 체험에서 주술사가 둘이면 제단을 함께 쓴다 */
  const emp=[];
  for(let i=0;i<st.n*st.n;i++)if(!st.board[i]&&!iceOn(st,i)&&!(st.fire||[]).includes(i))emp.push(i);
  st.altar=shuffle(emp).slice(0,st.P.shaman.altar).sort((a,b)=>a-b);
  st.ofs=[];
}
function job7Reset(st,p,job){
  ensure7(st);
  st.offer[p]=0;st.mad[p]=0;
  if(job==='shaman')shamanInit(st,p);
}
function job7Drop(st,p){
  ensure7(st);
  const was=jobOf(st,p);
  st.offer[p]=0;st.mad[p]=0;
  if(was==='shaman'){
    if(actOf(st).some(q=>q!==p&&jobOf(st,q)==='shaman'))st.ofs=(st.ofs||[]).filter(i=>trueColor(st,i)!==p);   /* 남은 주술사의 제단은 그대로 둔다 */
    else{st.altar=[];st.ofs=[]}
  }
  if(was==='clown'){st.boxes=(st.boxes||[]).filter(b=>b.by!==p);st.cups=(st.cups||[]).filter(c=>c.by!==p);st.cool[p]=0}   /* 숨겨 둔 깜짝상자와 농락도 함께 치운다 */
}

/* ---- 착수 직후: 제물칸에 둔 주술사의 돌은 제물돌 ---- */
function after7(st,idx,p){
  forget7(st,[idx]);
  if(jobOf(st,p)==='shaman'&&(st.altar||[]).includes(idx)&&!(st.ofs||[]).includes(idx)&&st.board[idx]===p){
    (st.ofs=st.ofs||[]).push(idx);   /* 제물돌은 판 위 표시(초록 고리)로만 알린다 — 글자 연출은 없다 */
  }
}

/* 중심 기준 정사각형(가장자리는 안쪽으로 민다) · 왼쪽 위 기준 정사각형 */
const boxC=(n,R,idx)=>{
  const c=meteorCenter(n,R,idx),cx=c%n,cy=(c/n)|0,cells=[];
  for(let y=cy-R;y<=cy+R;y++)for(let x=cx-R;x<=cx+R;x++)cells.push(y*n+x);
  return{key:c,cells,x0:cx-R,y0:cy-R,w:2*R+1,h:2*R+1};
};
const boxTL=(n,A,idx)=>{
  const x0=Math.min(n-A,idx%n),y0=Math.min(n-A,(idx/n)|0),cells=[];
  for(let y=0;y<A;y++)for(let x=0;x<A;x++)cells.push((y0+y)*n+x0+x);
  return{key:y0*n+x0,cells,x0,y0,w:A,h:A};
};
/* 모드별 범위(미리보기와 실행이 같은 계산을 쓴다) */
function area7(st,m,idx){
  const n=st.n;
  if(m==='insane')return boxC(n,st.P.insane.r,idx);
  if(m==='c_sky')return boxC(n,st.P.clown.sky.r,idx);
  if(m==='z_seal'){const A=st.P.shaman.seal.area,b=freezeBox(n,A,idx);return{key:b.anchor,cells:b.cells,x0:b.anchor%n,y0:(b.anchor/n)|0,w:A,h:A}}
  if(m==='z_smite')return boxTL(n,st.P.shaman.smite.area,idx);
  return null;
}

const curseOk=(st,p,i)=>isFoe(st,p,st.board[i])&&!tangAt(st,i)&&!st.sp[i];
const skyOk=(st,p,i,inv)=>st.board[i]===p&&!(inv||invSet(st)).has(i)&&!tangAt(st,i);
const boxOk=(st,p,i)=>st.board[i]===0&&!(st.fire||[]).includes(i)&&!iceOn(st,i)&&!(st.boxes||[]).some(b=>b.by===p&&b.pt===i);
/* 모드에서 눌러 고를 수 있는 곳(점선으로 표시) */
function targets7(st,p,m){
  const t=new Set(),n=st.n;
  if(m==='z_curse'){for(let i=0;i<n*n;i++)if(curseOk(st,p,i))t.add(i)}

/* ---- 저글링: 무작위 칸 3곳에 내 돌. 이미 돌이 있으면 그 돌을 제거하고 생성 ---- */
function juggleDo(st,p){
  const n=st.n,N=n*n,K=st.P.clown.juggle,inv=invSet(st);
  const ok=i=>st.board[i]!==p&&!inv.has(i)&&!tangAt(st,i)&&!(st.fire||[]).includes(i)&&!iceOn(st,i);
  const pool=[];for(let i=0;i<N;i++)if(ok(i))pool.push(i);
  let best=null;
  for(let k=Math.min(K,pool.length);k>=1&&!best;k--){
    for(let t=0;t<80&&!best;t++){
      const pick=shuffle(pool).slice(0,k),b2=st.board.slice();
      pick.forEach(i=>{b2[i]=p});
      const res=settleBoard(st,b2,p);
      if(res.ok)best={pick,res};
    }
  }
  if(!best)return say('저글링으로 돌을 만들 수 있는 자리가 없습니다.',true),true;
  const {pick,res}=best,rep=pick.filter(i=>st.board[i]),gh=ghostList(st,rep,st.board.slice());
  forget7(st,rep);
  pick.forEach(i=>{delete st.shield[i];delete st.sp[i];if(st.sick)delete st.sick[i]});
  castFx(st,'c_juggle',p,pick.slice(),{k:pick.length,rp:rep.length,gh:gh.slice(0,10)});
  applyBoardRes(st,p,res);   /* 따낸 상대 돌의 사석 처리도 여기서 한다 */
  payMana(st,p,'c_juggle');st.ko=null;st.last=pick[pick.length-1];
  lg(st,'저글링 '+pick.length);
  pick.forEach(i=>{if(st.board[i]===p)mineBoom(st,i,p)});
  commit('저글링! 돌 '+pick.length+'개가 생겼습니다.'+(rep.length?' 그 자리에 있던 돌 '+rep.length+'개는 사라졌습니다.':'')+(res.captured.length?' 사석 '+res.captured.length+'개를 얻었습니다.':'')+' 차례는 그대로입니다. 이어서 착수하세요.');
  return true;
}
/* ---- 조커: 내 돌과 상대 돌의 색을 서로 바꾼다 ---- */
function jokerDo(st,p){
  const q=OPP(st,p),orig={};
  if(q===p)return say('바꿀 상대가 없습니다.',true),true;
  if((st.joker||[]).length)return say('조커의 효과가 아직 남아 있습니다. 끝난 뒤에 다시 쓰세요.',true),true;
  let a=0,b=0;
  const inv=invSet(st);
  for(let i=0;i<st.n*st.n;i++){const c=st.board[i];if(inv.has(i))continue;if(c===p){orig[i]=p;a++}else if(c===q){orig[i]=q;b++}}
  if(!a&&!b)return say('판 위에 바꿀 수 있는 돌이 없습니다(무적인 돌은 바뀌지 않습니다).',true),true;
  const pts=Object.keys(orig).map(Number),gh=ghostList(st,pts,st.board.slice());
  pts.forEach(i=>{st.board[i]=orig[i]===p?q:p});
  (st.tang||[]).forEach(t=>{if(t.pts.every(i=>orig[i]!=null))t.c=t.c===p?q:t.c===q?p:t.c});
  (st.joker=st.joker||[]).push({p,q,exp:plyExp(st,st.P.clown.joker.plies),orig});
  payMana(st,p,'c_joker');st.ko=null;
  castFx(st,'c_joker',p,pts.slice(0,200),{q,gh:gh.slice(0,200)});
  lg(st,'조커');
  /* 바뀐 색 때문에 활로가 없는 무리가 생기면 곧바로 따낸다(둔 쪽의 무리는 상대 무리를 먼저 잡은 뒤에 따진다) */
  const sw=sweep(p);
  commit('조커! 내 돌 '+a+'개와 상대 돌 '+b+'개의 색이 다음 '+st.P.clown.joker.plies+'수 동안 서로 바뀝니다.'+(sw?' 활로를 잃은 돌 '+sw+'개가 잡혔습니다.':'')+' 차례는 그대로입니다. 이어서 착수하세요.');
  return true;
}

/* ---- 정신착란: 바뀐 직후의 판을 정리한다. 상대 돌 중 활로가 없는 무리는 따내고(사석), 중립돌 중 활로가 없는 무리는 사라지며(사석 없음),
   내 돌 중 활로가 없는 무리가 생기면 그 범위는 고를 수 없다 ---- */
function neutralSettle(st,b,p){
  const n=st.n,seen=new Set(),capt=[],lost=[];
  for(let i=0;i<n*n;i++){
    const c=b[i];if(!c||c===p||seen.has(i))continue;
    const g=groupOf(st,b,i);g.stones.forEach(k=>seen.add(k));
    if(g.libs.length===0&&!isProtected(st,g)){(c===NEUTC?lost:capt).push(...g.stones)}
  }
  const b2=b.slice();capt.concat(lost).forEach(k=>{b2[k]=0});
  const seen2=new Set();
  for(let i=0;i<n*n;i++){
    if(b2[i]!==p||seen2.has(i))continue;
    const g=groupOf(st,b2,i);g.stones.forEach(k=>seen2.add(k));
    if(g.libs.length===0&&!isProtected(st,g))return{ok:false};
  }
  return{ok:true,board:b2,capt,lost};
}

  /* 귤·빼빼로처럼 여러 칸을 차지하는 돌도 판 색으로 덮을 수 있게 가운데 칸과 모양을 구한다 */
  const cov=g=>{const [x,y]=xy(g[0]),k=g[4]||0;return k===1?coverSvg(x+C/2,y+C/2,1):k===2?coverSvg(x+C,y,2):k===3?coverSvg(x,y+C,3):coverSvg(x,y,0)};
  /* 봉인 문양: 두 겹의 고리와 여덟 갈래 별, 가운데 자물쇠(글자 없이 그린다) */
  const sigil=(x,y,R)=>{
    const sqr=o=>'M'+[0,1,2,3].map(j=>{const a=o+j*Math.PI/2;return f1(x+Math.cos(a)*R*.74)+' '+f1(y+Math.sin(a)*R*.74)}).join('L')+'Z';
    return `<circle cx="${f1(x)}" cy="${f1(y)}" r="${R}" fill="rgba(214,255,226,.92)" stroke="#0f7a3a" stroke-width="4"/><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(R*.84)}" fill="none" stroke="#1f8a4c" stroke-width="1.6" stroke-dasharray="3 3"/><path d="${sqr(0)}" fill="none" stroke="#1f8a4c" stroke-width="2" stroke-linejoin="round"/><path d="${sqr(Math.PI/4)}" fill="none" stroke="#1f8a4c" stroke-width="2" stroke-linejoin="round"/>`
      +`<path d="M${f1(x-7)} ${f1(y-2)}v-7a7 7 0 0 1 14 0v7" fill="none" stroke="#0d6a35" stroke-width="3.4" stroke-linecap="round"/><rect x="${f1(x-11)}" y="${f1(y-2)}" width="22" height="16" rx="3.4" fill="#c9f5da" stroke="#0d6a35" stroke-width="2.6"/><circle cx="${f1(x)}" cy="${f1(y+5)}" r="2.6" fill="#0d6a35"/><path d="M${f1(x)} ${f1(y+6)}v4.6" stroke="#0d6a35" stroke-width="2.6" stroke-linecap="round"/>`;
  };
  let s='';
  switch(ev.id){
    case 'insane':{
      const T=1100,[cx2,cy2]=ev.c!=null?xy(ev.c):[mid,mid],Hh=((ev.r||1)+.5)*C,opp=c=>c===1?2:c===2?1:c===3?4:c===4?3:2;
      s+=`<rect class="fxzone" style="--t:1300ms;stroke:#9a90d8;fill:rgba(160,150,220,.14)" x="${f1(cx2-Hh)}" y="${f1(cy2-Hh)}" width="${f1(2*Hh)}" height="${f1(2*Hh)}" rx="6"/>`;
      gh.forEach(g=>{const [x,y]=xy(g[0]);
        s+=`<g class="fxcv" style="--t:${Math.round(T*.78)}ms">${coverSvg(x,y,0)}</g><g class="fxflk1" style="--t:${T}ms">${ghostDraw(g)}</g><g class="fxflk2" style="--t:${T}ms">${stoneDraw(x,y,opp(g[1]),g[2]||'',g[3]||null)}</g>`+sw(x,y,20,'#cfc8f5',Math.round(T*.78),700)});
      if(!cvOn)s+=gl(cx2,cy2,Hh*1.6,'#8f84d8',0,1300,true)+strk(spiral(cx2,cy2,Hh*1.5,2.4,1,0),'#d8d2f8',0,900,3)+strk(spiral(cx2,cy2,Hh*1.4,2.8,-1,2.1),'#8f84d8',60,900,2.4)
        +sw(cx2,cy2,Hh*1.1,'#cfc8f5',860,800)+sw(cx2,cy2,Hh*.8,'#ffffff',930,700)+`<text class="fxfl" style="--s:900ms" x="${f1(cx2)}" y="${f1(cy2-Hh-10)}" text-anchor="middle">중립돌</text>`;
      break}
    case 'shaman':{
      s+=gl(mid,mid,S*.28,'#34d47c',0,1500,true)+sw(mid,mid,S*.26,'#34d47c',0,1100)+sw(mid,mid,S*.26,'#d6ffe6',120,900);
      (ev.al||[]).slice(0,12).forEach((i,k)=>{const [x,y]=xy(i),dl=860+k*110;
        s+=gl(x,y,34,'#34d47c',dl,1500,true)+sw(x,y,20,'#34d47c',dl+200,700)
          +(cvOn?'':`<circle class="fxrise" style="--s:${dl+240}ms;--t:1100ms;--dx:${r1((rn(k)-.5)*14)}px;--dy:-36px" cx="${x}" cy="${y}" r="3" fill="#b8ff8a"/>`)});
      break}
    case 'clown':{
      FX7C.forEach((c,k)=>{s+=gl(mid+(k-1.5)*S*.12,mid-(k%2?1:-1)*S*.04,S*.12,c,k*90,1500,true)});
      s+=sw(mid,mid,S*.3,'#f5b800',520,1100)+sw(mid,mid,S*.3,'#ffffff',620,900);
      if(!cvOn)for(let j=0;j<28;j++){const a=rn(j*3+1)*6.283,d=40+rn(j*3+2)*S*.3;
        s+=`<rect class="fxdbr" style="--s:${520+r1(rn(j)*260)}ms;--t:1500ms;--dx:${r1(Math.cos(a)*d)}px;--dy:${r1(Math.sin(a)*d)}px" x="${f1(mid)}" y="${f1(mid)}" width="6" height="3" fill="${FX7C[j%4]}"/>`}
      break}
    case 'z_sac':{
      gh.slice(0,40).forEach((g,k)=>{const [x,y]=xy(g[0]),dl=Math.min(k,12)*60+100;
        s+=`<g class="fx6melt" style="--t:1000ms;--s:${dl}ms;--dx:0px;--dy:-44px">${ghostDraw(g)}</g>`+gl(x,y,30,'#34d47c',dl,1000)+sw(x,y,20,'#34d47c',dl,700);
        if(!cvOn)s+=`<circle class="fxrise" style="--s:${dl+60}ms;--t:1300ms;--dx:${r1((rn(k)-.5)*30)}px;--dy:-90px" cx="${x}" cy="${y}" r="4" fill="#b8ff8a"/>`});
      break}
    case 'z_seal':{
      if(ev.box==null)break;
      const A=ev.A||4,[bx0,by0]=xy(ev.box),x0=bx0-C/2,y0=by0-C/2,W=A*C,cx2=x0+W/2,cy2=y0+W/2;
      s+=`<rect class="fxzone" style="--t:1500ms;--s:300ms;stroke:#26c070;fill:rgba(40,175,95,.16)" x="${f1(x0)}" y="${f1(y0)}" width="${W}" height="${W}" rx="6"/>`
        +gl(cx2,cy2,W*.8,'#34d47c',560,1100)+sw(cx2,cy2,W*.7,'#34d47c',560,900)
        +`<g class="fx6stamp" style="--t:1700ms;--s:560ms">${sigil(cx2,cy2,38)}</g>`;
      break}
    case 'z_curse':{
      pts.slice(0,30).forEach((i,k)=>{const [x,y]=xy(i),dl=Math.min(k,12)*45;
        s+=gl(x,y,30,'#2a9a5c',dl,1300)+`<circle class="fxring" style="--s:${dl}ms;stroke:#34d47c" cx="${x}" cy="${y}" r="22"/>`
          +`<circle class="fxfall2" style="--s:${dl+300}ms;--t:1000ms;--dy:36px" cx="${f1(x+(rn(k)-.5)*14)}" cy="${y+8}" r="2.8" fill="#34d47c"/>`});
      break}
    case 'z_smite':{
      if(ev.box==null)break;
      const A=ev.A||2,[bx0,by0]=xy(ev.box),x0=bx0-C/2,y0=by0-C/2,W=A*C,cx2=x0+W/2,cy2=y0+W/2,TS=600;
      gh.forEach(g=>{s+=`<g class="fxcv" style="--t:${TS}ms">${ghostDraw(g)}</g>`});
      s+=`<rect class="fxzone" style="--t:${TS+500}ms;stroke:#26c070;fill:rgba(40,175,95,.16)" x="${f1(x0)}" y="${f1(y0)}" width="${W}" height="${W}" rx="6"/>`
        +gl(cx2,cy2,W*1.1,'#34d47c',TS,1500,true)+gl(cx2,cy2,W*.6,'#eafff2',TS,500)+sw(cx2,cy2,W*1.3,'#34d47c',TS,900)+sw(cx2,cy2,W*1.0,'#ffffff',TS+90,800)
        +`<circle class="fxscorch" style="--s:${TS}ms" cx="${f1(cx2)}" cy="${f1(cy2)}" r="${f1(W*.62)}" fill="${gr('#0a2e1c')}"/>`;
      /* 땅의 금: 번개가 꽂힌 자리에서 사방으로 갈라져 한동안 남는다 */
      for(let c=0;c<9;c++){const a=c/9*6.283+rn(c+3)*.5,len=W*(.9+rn(c+11)*1.2);let d=`M${f1(cx2)} ${f1(cy2)}`,px=cx2,py=cy2,aa=a;
        for(let q=1;q<=6;q++){aa+=(rn(c*9+q)-.5)*.8;px+=Math.cos(aa)*len/6;py+=Math.sin(aa)*len/6;d+=`L${f1(px)} ${f1(py)}`}
        s+=`<path class="fxscorch" style="--s:${TS}ms;fill:none;stroke:#0a2e1c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round" d="${d}"/>`}
      if(!cvOn){
        const N=34,P5=[[],[],[],[],[]],core=[];
        for(let i=0;i<=N;i++){const q=i/N,yy=cy2*q,xx=cx2+(rn(7)-.5)*20*(1-q),amp=W*.4*(.25+.75*q);
          for(let k=0;k<5;k++)P5[k].push(f1(xx+amp*Math.sin(yy*.045+k*1.2566)+(rn(i*7+k)-.5)*3)+' '+f1(yy));
          core.push(f1(xx+(rn(i*3)-.5)*3)+' '+f1(yy))}
        const bolt=(d,w)=>`<path class="fxbolt2" style="--s:${TS}ms;stroke:#34d47c;stroke-opacity:.3;stroke-width:${w*3}px" d="${d}"/><path class="fxbolt2" style="--s:${TS}ms;stroke:#34d47c;stroke-width:${w}px" d="${d}"/><path class="fxbolt2" style="--s:${TS}ms;stroke:#eafff2;stroke-width:${Math.max(1.4,w*.4)}px" d="${d}"/>`;
        s+=`<rect class="fxglare" style="--s:${TS}ms;fill:#c4ffde;fill-opacity:.45" x="0" y="0" width="${S}" height="${S}"/>`;
        P5.forEach(p=>{s+=bolt('M'+p.join('L'),2.6)});
        s+=`<path class="fxbolt2" style="--s:${TS}ms;stroke:#ffffff;stroke-width:3.2px" d="M${core.join('L')}"/>`;
      }
      break}
    case 'c_juggle':{
      const rp=gh;
      pts.forEach((i,k)=>{const [x,y]=xy(i),land=60+k*260+760;
        s+=`<g class="fxcv" style="--t:${land}ms">${coverSvg(x,y,0)}${rp.filter(g=>g[0]===i).map(ghostDraw).join('')}</g>`
          +`<g class="fx6bud" style="--t:520ms;--s:${land}ms">${stoneDraw(x,y,stb[i]||ev.p,'',null)}</g>`
          +star(x,y,26,'#ffffff',land,900)+sw(x,y,26,FX7C[k%4],land,800)});
      break}
    case 'c_sky':{
      if(ev.land){
        pts.forEach((i,k)=>{const [x,y]=xy(i),d=Math.min(k,12)*55,T=480;
          s+=`<g class="fxcv" style="--t:${d+T}ms">${coverSvg(x,y,0)}${ghOf(i)}</g>`
            +`<g class="fx6drop" style="--t:520ms;--s:${Math.max(0,d+T-374)}ms;--dy:${-(Math.round(y)+40)}px">${stoneDraw(x,y,stb[i]||ev.p,'',null)}</g>`});
        break}
      const [cx2,cy2]=ev.c!=null?xy(ev.c):[mid,mid],Hh=((ev.r||2)+.5)*C;
      s+=`<rect class="fxzone" style="--t:1000ms;stroke:#f5b800;fill:rgba(245,184,0,.13)" x="${f1(cx2-Hh)}" y="${f1(cy2-Hh)}" width="${f1(2*Hh)}" height="${f1(2*Hh)}" rx="6"/>`;
      gh.slice(0,60).forEach((g,k)=>{const [x,y]=xy(g[0]),dl=120+Math.min(k,12)*40;
        s+=`<g class="fxsky" style="--s:${dl}ms;--t:760ms;--dy:${-(Math.round(y)+90)}px">${ghostDraw(g)}</g>`+sw(x,y,20,FX7C[k%4],dl,700)});
      break}
    case 'c_box':{
      if(!ev.boom||!pts.length)break;
      const [x,y]=xy(pts[0]),T0=230,arms=(ev.cells||[]).filter(i=>i!==pts[0]).map(i=>xy(i));
      gh.forEach(g=>{s+=`<g class="fxcv" style="--t:${T0}ms">${ghostDraw(g)}</g>`});
      if(cvOn)break;   /* 상자·팔·섬광은 캔버스 장면이 그린다. 아래는 캔버스를 끈 경우의 대체 연출 */
      /* 상자: 돌이 닿는 순간 몸통이 튀고 뚜껑이 날아가며, 용수철 달린 광대 얼굴이 불쑥 솟는다 */
      s+=`<g class="fxpop" style="--t:1000ms;--s:${T0}ms"><rect x="${x-11}" y="${y-4}" width="22" height="17" rx="2.5" fill="#e9473b" stroke="#7a1410" stroke-width="1.6"/><path d="M${x} ${y-4}V${y+13}" stroke="#2f6fe0" stroke-width="3.4"/></g>`
        +`<g class="fxlid" style="--t:1000ms;--s:${T0}ms"><rect x="${x-13}" y="${y-11}" width="26" height="8" rx="2.5" fill="#f5b800" stroke="#9a6a00" stroke-width="1.6"/><path d="M${x} ${y-11}V${y-3}" stroke="#2f6fe0" stroke-width="3.4"/><circle cx="${x-4}" cy="${y-14}" r="3.4" fill="#2aa860" stroke="#146b36"/><circle cx="${x+4}" cy="${y-14}" r="3.4" fill="#2aa860" stroke="#146b36"/></g>`
        +`<g class="fxspr" style="--t:1250ms;--s:${T0+30}ms"><path d="M${x} ${y-6}l-8 -4l16 -5l-16 -5l16 -5l-8 -4" fill="none" stroke="#7d7d86" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x}" cy="${y-48}" r="11" fill="#ffe7cf" stroke="#2a2230" stroke-width="1.8"/><path d="M${x-10} ${y-53}L${x} ${y-72}L${x+10} ${y-53}Z" fill="#e8463a" stroke="#2a2230" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${x}" cy="${y-72}" r="2.8" fill="#f5b800"/><circle cx="${x-4}" cy="${y-50}" r="1.6" fill="#2a2230"/><circle cx="${x+4}" cy="${y-50}" r="1.6" fill="#2a2230"/><circle cx="${x}" cy="${y-46}" r="2.6" fill="#e8463a"/><path d="M${x-5} ${y-42}q5 5 10 0" fill="none" stroke="#2a2230" stroke-width="1.5" stroke-linecap="round"/></g>`;
      arms.forEach(a=>{
        const dx=a[0]-x,dy=a[1]-y,hz=dy===0,ci=dy<0?0:dx>0?1:dy>0?2:3,cc=FX7C[ci],
          rx=hz?(dx>0?x:x-C):x-7,ry=hz?y-7:(dy>0?y:y-C),org=hz?(dx>0?'0% 50%':'100% 50%'):(dy>0?'50% 0%':'50% 100%');
        s+=`<rect class="fxarm" style="--t:1300ms;--s:${T0+60}ms;--x0:${hz?0:1};--y0:${hz?1:0};transform-origin:${org}" x="${f1(rx)}" y="${f1(ry)}" width="${hz?C:14}" height="${hz?14:C}" rx="7" fill="${cc}" stroke="#ffffff" stroke-width="2"/>`
          +`<circle class="fxpop" style="--t:1200ms;--s:${T0+260}ms" cx="${a[0]}" cy="${a[1]}" r="14" fill="${cc}" stroke="#ffffff" stroke-width="2.5"/>`
          +star(a[0],a[1],22,'#ffffff',T0+260,800)});
      s+=star(x,y,34,'#ffffff',T0,900)+gl(x,y,C*1.3,'#ffe27a',T0,900);
      if(!cvOn)FX7C.forEach((c,k)=>{s+=sparks(x,y,c,7,70,T0,3.2,1100,true)});
      break}
    case 'c_joker':{
      const T=800,np=ev.p,nq=ev.q;
      gh.slice(0,200).forEach(g=>{const [x,y]=xy(g[0]),dl=r1((x-M)/Math.max(1,S-2*M)*650),nc=g[1]===np?nq:np,ng=[g[0],nc,g[2],g[3],g[4]];
        s+=`<g class="fxcv" style="--t:${dl+T+20}ms">${cov(g)}</g><g class="fxflip1" style="--t:${T}ms;--s:${dl}ms">${ghostDraw(g)}</g><g class="fxflip2" style="--t:${T}ms;--s:${dl}ms">${ghostDraw(ng)}</g>`});
      if(!cvOn)FX7C.forEach((c,k)=>{s+=sw(mid,mid,S*(.2+k*.08),c,300+k*110,900)});
      break}
    case 'c_cup':{
      /* 컵 연출은 캔버스 장면이 그린다. 아래는 캔버스를 끈 경우의 대체 연출 */
      if(cvOn)break;
      const cc=['#e8463a','#f5b800','#2f6fe0'];
      [-1,0,1].forEach((o,k)=>{const x=mid+o*60,y=mid;
        s+=`<g class="fxpop" style="--t:900ms;--s:${k*110}ms"><path d="M${x-9} ${y-26}L${x-17} ${y+8}H${x+17}L${x+9} ${y-26}Z" fill="${cc[k]}" stroke="#fff" stroke-width="2"/><rect x="${x-21}" y="${y+8}" width="42" height="7" rx="3" fill="${cc[k]}" stroke="#fff" stroke-width="1.6"/></g>`});
      s+=gl(mid,mid,S*.2,'#f5b800',0,1400,true)+sw(mid,mid,S*.2,'#f5b800',200,900);
      if(ev.res)s+=`<text class="fxbig" style="--s:700ms" x="${mid}" y="${f1(mid-46)}" fill="${ev.hit?'#7ee0a8':'#fff35a'}">${ev.hit?'공 발견!':(ev.gain===0?'빈 컵!':'빈 컵! 카드 +1')}</text>`;
      break}
    case 'fumble':{
      if(pts.length<2)break;
      const [ax,ay]=xy(pts[0]),[bx,by]=xy(pts[1]);
      s+=`<circle class="fxring" style="--t:1000ms;stroke:#9a95c0;stroke-dasharray:4 4" cx="${ax}" cy="${ay}" r="22"/>`
        +strk(`M${ax} ${ay}Q${f1((ax+bx)/2+14)} ${f1((ay+by)/2-26)} ${bx} ${by}`,'#c9c2f5',60,700,2.6)
        +gl(bx,by,38,'#ffd24a',420,800)+sw(bx,by,22,'#ffd24a',420,700);
      if(!cvOn)s+=`<text class="fxfl" style="--s:420ms" x="${bx}" y="${by-20}" text-anchor="middle">허수!</text>`;
      break}
  }
  return s;

/* 이미지는 문서에 딱 한 번만 올려 두고 <use>로 가져다 쓴다(효과를 그릴 때마다 큰 이미지를 해석하지 않도록) */
function sprInit(){
  if(typeof document==='undefined'||!document.body||document.getElementById('sprdefs'))return;
  try{
    document.body.insertAdjacentHTML('beforeend',`<svg id="sprdefs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;left:-9px;top:-9px;width:0;height:0;pointer-events:none"><defs><image id="spW" href="${SPR.wave}" width="1320" height="141"/></defs></svg>`);
  }catch(e){}
}

/* ===== 방 시스템: 서버 없이 WebRTC(PeerJS)로 두 기기를 직접 연결한다 =====
   방 코드 = 호스트 기기가 PeerJS 중계 서버에 등록하는 이름(abk-코드). 호스트 기기가 방 데이터(문서 저장소)를 들고 있고,
   참가자는 같은 인터페이스(get/set/update/delete/onSnapshot)를 가진 원격 저장소로 호스트에 접속한다. */
const CID=(()=>{
  try{let c=sessionStorage.getItem('abk_cid');if(!c){c=Math.random().toString(36).slice(2,10);sessionStorage.setItem('abk_cid',c)}return c}
  catch(e){return Math.random().toString(36).slice(2,10)}
})();
let DBH=null;
const NO_LIB='연결 라이브러리(PeerJS)를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.';
const NO_SERVER='연결 서버에 접속하지 못했습니다. 잠시 뒤 다시 시도하세요.';
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},

const PID=code=>'abk-'+code;

/* 접속자·자리 관리(claimSeat · dropSeat · setRole · patchSettings 등)는 room_common.js 에 있다 */

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function loadPeerLib(){
  if(typeof Peer!=='undefined')return Promise.resolve(true);
  const urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
  const tryLoad=i=>i>=urls.length?Promise.resolve(false):new Promise(res=>{
    const s=document.createElement('script');s.src=urls[i];
    s.onload=()=>res(typeof Peer!=='undefined');s.onerror=()=>res(false);
    document.head.appendChild(s);
  }).then(ok=>ok?true:tryLoad(i+1));
  return tryLoad(0);
}
/* 호스트 기기의 방 저장소. 새로고침해도 방이 살아 있도록 탭 저장소에도 적어 둔다. */
function mkStore(init){
  const m=new Map(Object.entries(init||{})),subs=new Map();
  const snap=p=>({id:p.split('/').pop(),exists:m.has(p),data:()=>m.has(p)?JSON.parse(m.get(p)):undefined});
  const save=()=>{try{sessionStorage.setItem('abk_store',JSON.stringify(Object.fromEntries(m)))}catch(e){}};
  const notify=p=>{(subs.get(p)||[]).slice().forEach(f=>setTimeout(()=>{try{f(snap(p))}catch(e){console.error(e)}},0));save()};
  return{m,doc:p=>({
    get:async()=>snap(p),
    set:async d=>{m.set(p,JSON.stringify(d));notify(p)},
    update:async d=>{
      if(!m.has(p))throw {code:'not_found',message:'방 정보가 없습니다.'};
      m.set(p,JSON.stringify(Object.assign(JSON.parse(m.get(p)),JSON.parse(JSON.stringify(d)))));notify(p)},
    delete:async()=>{m.delete(p);notify(p)},
    onSnapshot:f=>{
      if(!subs.has(p))subs.set(p,[]);subs.get(p).push(f);
      setTimeout(()=>{try{f(snap(p))}catch(e){console.error(e)}},0);
      return()=>{const l=subs.get(p)||[],i=l.indexOf(f);if(i>=0)l.splice(i,1)};
    }})};
}
/* 연결 한 번에 보낼 수 있는 크기(약 16KB)를 넘는 메시지는 조각으로 나눠 보내고, 받는 쪽에서 다시 합친다. */
let CK_ID=0;
function csend(conn,o){
  const s=JSON.stringify(o);
  if(s.length<=3500){conn.send(o);return}
  const id=Date.now().toString(36)+'.'+(++CK_ID),n=Math.ceil(s.length/3500);
  for(let i=0;i<n;i++)conn.send({ck:id,i,n,s:s.slice(i*3500,(i+1)*3500)});
}
function conOn(conn,h){
  const buf=new Map();
  conn.on('data',m=>{
    if(m&&typeof m==='object'&&m.ck){
      let b=buf.get(m.ck);if(!b){b={a:[],c:0};buf.set(m.ck,b)}
      if(b.a[m.i]==null){b.a[m.i]=m.s;b.c++}
      if(b.c<m.n)return;
      buf.delete(m.ck);
      let o;try{o=JSON.parse(b.a.join(''))}catch(e){return}
      return h(o);
    }
    return h(m);
  });
}
/* 호스트: 참가자의 요청을 저장소에 적용하고, 구독 중인 문서가 바뀌면 알려 준다. */
function hostServe(conn,store,code){
  HOST_CONNS.add(conn);
  const mine=new Map(),send=o=>{try{csend(conn,o)}catch(e){}};
  let rx=Date.now();
  const hb=setInterval(()=>{
    if(conn.open===false){clearInterval(hb);return}
    try{conn.send({hb:1})}catch(e){}
    if(!document.hidden&&Date.now()-rx>25000){clearInterval(hb);try{conn.close()}catch(e){}}
  },4000);
  conOn(conn,async m=>{
    rx=Date.now();
    if(!m||typeof m!=='object')return;
    if(m.hello){conn._cid=String(m.hello).slice(0,24);return}
    const p=String(m.p||'');
    if(p!==roomMeta(code)&&!p.startsWith('rooms/'+code+'/'))return;
    try{
      const d=store.doc(p);
      if(m.op==='sub'){if(!mine.has(p))mine.set(p,d.onSnapshot(s=>send({snap:1,p,ex:s.exists,d:s.exists?s.data():null})))}
      else if(m.op==='unsub'){const u=mine.get(p);if(u){u();mine.delete(p)}}
      else if(m.op==='get'){const s=await d.get();send({r:m.id,res:{ex:s.exists,d:s.exists?s.data():null}})}
      else if(m.op==='set'){await d.set(m.d);send({r:m.id,res:1})}
      else if(m.op==='update'){await d.update(m.d);send({r:m.id,res:1})}
      else if(m.op==='delete'){await d.delete();send({r:m.id,res:1})}
    }catch(e){send({r:m.id,err:e.code||'error',msg:e.message||''})}
  });
  conn.on('close',()=>{
    clearInterval(hb);
    mine.forEach(u=>u());mine.clear();
    /* 참가자 연결이 끊긴 채 한참 돌아오지 않으면 자리를 비워, 새 탭·새 기기로도 다시 들어올 수 있게 한다 */
    HOST_CONNS.delete(conn);
    const cid=conn._cid;
    setTimeout(async()=>{
      try{
        const d=store.doc(roomMeta(code)),s=await d.get();
        if(!s.exists)return;
        const m=s.data();
        if(cid){
          /* 연결이 끊긴 그 접속자(참가자·관전자)만 20초 뒤에 내보낸다 (같은 사람이 다시 연결했다면 그대로 둔다) */
          if([...HOST_CONNS].some(c=>c._cid===cid))return;
          await dropSeat(d,cid);
          return;
        }
        /* 이름표를 못 받은 옛 접속: 2인 방에서 연결이 하나도 안 남았다면 상대 자리를 비운다 */
        if((m.np||2)<=2&&!HOST_CONNS.size&&m.guestCid)await d.update({guestCid:null});
      }catch(e){}
    },20000);
  });
  conn.on('error',()=>{});
}
const HOST_CONNS=new Set();
function hostAttach(peer,store,code){
  peer.on('connection',conn=>hostServe(conn,store,code));

  const back=async()=>{
    for(let i=0;i<60&&NET&&NET.peer===peer&&!peer.destroyed&&peer.disconnected;i++){
      try{peer.reconnect()}catch(e){}
      await sleep(2500);
    }
  };
  peer.on('disconnected',back);
  peer.on('close',async()=>{
    if(!NET||NET.peer!==peer||NET.code!==code)return;
    for(let i=0;i<30&&NET&&NET.code===code&&NET.peer===peer;i++){
      try{const np=await openPeer(PID(code));if(!NET||NET.code!==code){killPeer(np);return}NET.peer=np;hostAttach(np,store,code);return}

/* 참가자: 호스트의 저장소를 같은 인터페이스로 다룬다. */
function mkRemote(conn){
  let seq=0;const pend=new Map(),subs=new Map();
  const mkSnap=(p,ex,d)=>({id:p.split('/').pop(),exists:!!ex,data:()=>d});
  conn._rx=Date.now();
  conOn(conn,m=>{
    conn._rx=Date.now();
    if(!m||typeof m!=='object')return;
    if(m.r){const q=pend.get(m.r);if(!q)return;pend.delete(m.r);m.err?q.rej({code:m.err,message:m.msg}):q.res(m.res)}
    else if(m.snap){(subs.get(m.p)||[]).slice().forEach(f=>{try{f(mkSnap(m.p,m.ex,m.d))}catch(e){console.error(e)}})}
  });
  const rpc=(op,p,d)=>new Promise((res,rej)=>{
    const id=++seq;pend.set(id,{res,rej});
    try{csend(conn,{id,op,p,d})}catch(e){pend.delete(id);return rej({code:'closed',message:'연결이 끊겼습니다.'})}
    setTimeout(()=>{if(pend.has(id)){pend.delete(id);rej({code:'timeout',message:'응답이 없습니다.'})}},10000);
  });
  return{doc:p=>({
    get:async()=>{const r=await rpc('get',p);return mkSnap(p,r.ex,r.d)},
    set:d=>rpc('set',p,d),update:d=>rpc('update',p,d),delete:()=>rpc('delete',p),
    onSnapshot:f=>{
      if(!subs.has(p))subs.set(p,[]);
      const l=subs.get(p);l.push(f);
      if(l.length===1){try{conn.send({op:'sub',p})}catch(e){}}
      return()=>{const i=l.indexOf(f);if(i>=0)l.splice(i,1);if(!l.length){try{conn.send({op:'unsub',p})}catch(e){}}};
    }})};
}
function openPeer(id){
  return new Promise((res,rej)=>{
    let done=false;
    const peer=new Peer(id||undefined,{config:{iceServers:ICE}});
    const t=setTimeout(()=>{if(done)return;done=true;try{peer.destroy()}catch(e){}rej({code:'timeout'})},12000);
    peer.on('open',()=>{if(done)return;done=true;clearTimeout(t);res(peer)});
    peer.on('error',e=>{if(done)return;done=true;clearTimeout(t);try{peer.destroy()}catch(_){}rej({code:(e&&e.type)||'error'})});
  });
}
function connectTo(peer,id){
  return new Promise((res,rej)=>{
    let done=false;
    const fin=(f,v)=>{if(done)return;done=true;clearTimeout(t);f(v)};
    const t=setTimeout(()=>fin(rej,{code:'timeout'}),15000);
    const conn=peer.connect(id,{serialization:'json',reliable:true});
    conn.on('open',()=>fin(res,conn));
    conn.on('error',()=>fin(rej,{code:'error'}));
    peer.on('error',e=>fin(rej,{code:(e&&e.type)||'error'}));
  });
}

/* 알림이 한 번 빠져도 화면이 영영 멈추지 않도록, 몇 초마다 방 문서를 직접 읽어 확인한다 */

        }

        st.v=nv;
        await ref.set({v:nv,gid:st.gid,json:JSON.stringify(st),by:mySeat()||0,at:Date.now()});
      }

    }catch(e){
      if(NET===N&&(N.retry||0)<8){
        /* 연결이 잠깐 흔들렸을 수 있으니, 내 동작이 사라지지 않도록 잠시 뒤 다시 올린다 */
        N.retry=(N.retry||0)+1;N.dirty=true;

        setTimeout(()=>{if(NET===N){N.running=false;pushState()}},1200*N.retry);
        return;
      }

    }

  })();
}

/* ===== 방 공통: 참가자·관전자·내보내기 (net.js 와 net_db_backup.js 가 같이 쓴다) =====
   방 정보(rooms/코드)의 접속자 칸
   · hostCid: 방장                      · guestCid: 2인 방의 상대 / 3·4인 방의 첫 참가자
   · guests: 3·4인 방의 참가자 목록     · seats: 돌 색 → 접속자 (3·4인, 대국 중)
   · specs: 관전자 목록                 · banned: 방장이 내보낸 접속자(다시 들어올 수 없다)
   자리(참가자)가 가득 차도 방에는 얼마든지 들어올 수 있고, 그때는 관전자가 된다. */
const BANNED_MSG='방장이 이 방에서 내보낸 기기입니다. 다시 입장할 수 없습니다.';
const waitMs=ms=>new Promise(r=>setTimeout(r,ms));
/* 방장을 뺀 참가자 목록 */
const guestsOf=m=>(m.np||2)>2?(m.guests||[]).slice():(m.guestCid?[m.guestCid]:[]);
const isGuestOf=m=>guestsOf(m).includes(CID);
const isSpecOf=m=>(m.specs||[]).includes(CID);
const hasCid=(m,c)=>m.hostCid===c||guestsOf(m).includes(c)||(m.specs||[]).includes(c);
/* 3·4인 대국 중 이미 기권해 대국에서 빠진 자리(돌 색). 이 기기가 아는 판 기준 */
const deadSeats=()=>{const st=G&&G.st;return st&&!st.over&&NP(st)>2?(st.out||[]):[]};
/* 대국 중 비어 있는 자리(돌 색) 목록. 이미 기권한 자리는 이어받아도 둘 수 없으니 뺀다 */
function freeSeats(m){
  const seats=m.seats||{},dead=deadSeats();
  return Object.keys(seats).filter(c=>!seats[c]&&!dead.includes(+c));
}
/* 참가자 자리가 비어 있는가 (방장 자리는 세지 않는다) */
function seatFree(m){
  const np=m.np||2;
  if(np<=2)return !m.guestCid;
  if(m.status==='playing'&&m.seats)return freeSeats(m).length>0;
  return (m.guests||[]).length<np-1;
}
/* cid 를 참가자로 앉히는 변경분 */
function seatPatch(m,cid){
  const np=m.np||2,specs=(m.specs||[]).filter(x=>x!==cid);
  if(np<=2)return{guestCid:cid,specs};
  const guests=(m.guests||[]).filter(x=>x!==cid).concat([cid]),patch={guests,guestCid:guests[0],specs};
  if(m.status==='playing'&&m.seats){
    const seats=Object.assign({},m.seats),free=freeSeats(m),any=Object.keys(seats).filter(c=>!seats[c]),c0=free.length?free[0]:any[0];
    if(c0!=null){seats[c0]=cid;patch.seats=seats}
  }
  return patch;
}
/* cid 를 참가자 자리에서 빼는 변경분 (진행 중이면 그 자리를 비운다) */
function leavePatch(m,cid){
  const np=m.np||2;
  if(np<=2)return m.guestCid===cid?{guestCid:null}:{};
  const guests=(m.guests||[]).filter(g=>g!==cid),up={guests,guestCid:guests[0]||null};
  if(m.seats){const seats=Object.assign({},m.seats);for(const c in seats)if(seats[c]===cid)seats[c]=null;up.seats=seats}
  return up;
}
/* 대국 중 cid 의 돌 색(자리 번호). 대국 전이거나 참가자가 아니면 null */
function seatOfCid(m,cid){
  if(!m||m.status!=='playing')return null;
  if((m.np||2)>2){for(const k in (m.seats||{}))if(m.seats[k]===cid)return +k;return null}
  if(!m.hostSeat)return null;
  if(cid===m.hostCid)return m.hostSeat;
  return m.guestCid===cid?3-m.hostSeat:null;
}
/* 대국 중 돌 색(자리 번호) p 를 맡은 접속자. 대국 전이거나 비어 있으면 null */
function cidOfSeat(m,p){
  if(!m||m.status!=='playing')return null;
  if((m.np||2)>2)return (m.seats||{})[p]||null;
  if(!m.hostSeat)return null;
  if(p===m.hostSeat)return m.hostCid||null;
  return p===3-m.hostSeat?(m.guestCid||null):null;
}

/* ===== 접속자 이름: 닉네임 =====
   방에 들어올 때 직접 닉네임(1~12자)을 입력한다. 한 방 안에서 이름이 겹치면 뒤에 들어온 사람에게 ' 2', ' 3'… 을 붙인다.
   닉네임은 방 정보의 names(접속자 → 닉네임)에 적어 두어, 누가 나가거나 자리를 바꿔도 바뀌지 않는다.
   names 에 번호가 적힌 예전 방은 60갑자 이름(갑자·을축·병인…)으로 보여 준다. */
const GAN=[...'갑을병정무기경신임계'],JI=[...'자축인묘진사오미신유술해'];
const ROOM_MAX=60;
const GAPJA=Array.from({length:ROOM_MAX},(_,i)=>GAN[i%10]+JI[i%12]);
const NICK_MAX=12;
const ROOM_FULL_MSG='방이 가득 찼습니다. 한 방에는 최대 '+ROOM_MAX+'명까지 들어올 수 있습니다.';
const NICK_MSG='닉네임을 입력하세요 (1~12자).';
const cleanNick=v=>String(v==null?'':v).replace(/[\u0000-\u001f\u007f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,NICK_MAX).trim();
const storedNick=()=>{try{return cleanNick(localStorage.getItem('abk_nick'))}catch(e){return ''}};
/* 이 기기에서 입장에 쓸 닉네임 (입력칸이 없는 환경에서는 저장된 값, 그것도 없으면 '손님') */
const myNick=()=>cleanNick(UI.nick)||storedNick()||'손님';
/* 방에 있는 모든 접속자: 방장 → 참가자 → 관전자 순, 겹치지 않게 */
function memberCids(m){
  const seen={},out=[];
  [m.hostCid].concat(guestsOf(m),m.specs||[]).forEach(c=>{if(c&&!seen[c]){seen[c]=1;out.push(c)}});
  return out;
}
const roomCount=m=>memberCids(m).length;
/* 접속자 → 보여 줄 이름. 적어 둔 닉네임을 쓰고(예전 방의 번호는 60갑자 이름), 적혀 있지 않으면 비어 있는 갑자 이름을 준다.
   같은 이름이 겹치면 방장 → 참가자 → 관전자 순으로 앞사람이 그대로 쓰고 뒷사람에게 숫자를 붙인다.
   같은 방 정보를 보는 기기는 모두 같은 결과를 얻는다 */
function nickMap(m){
  const stored=m.names||{},list=memberCids(m),base={},idxUsed={},res={},seen={};
  list.forEach(c=>{
    const v=stored[c];
    if(typeof v==='string'&&cleanNick(v))base[c]=cleanNick(v);
    else if(Number.isInteger(v)&&v>=0&&v<ROOM_MAX&&!idxUsed[v]){idxUsed[v]=1;base[c]=GAPJA[v]}
  });
  let k=0;
  list.forEach(c=>{if(base[c]==null){while(idxUsed[k])k++;idxUsed[k]=1;base[c]=GAPJA[k%ROOM_MAX]}});
  list.forEach(c=>{
    let n=base[c],i=1;
    while(seen[n.toLowerCase()]){i++;n=base[c]+' '+i}
    seen[n.toLowerCase()]=1;res[c]=n;
  });
  return res;
}
const nickOf=(m,cid)=>nickMap(m||{})[cid]||'';
/* cid 가 새로 들어올 때 적을 이름 목록: 지금 접속자들의 이름은 그대로 두고 cid 에게 닉네임을 준다 (겹치면 숫자를 붙인다) */
function namesWith(m,cid,nick){
  const cur=nickMap(m),out={},taken={};
  memberCids(m).forEach(c=>{if(c!==cid){out[c]=cur[c];taken[cur[c].toLowerCase()]=1}});
  const b=cleanNick(nick)||'손님';let n=b,i=1;
  while(taken[n.toLowerCase()]){i++;n=b+' '+i}
  out[cid]=n;return out;
}
/* cid 가 방을 떠날 때 적을 이름 목록 (그 이름은 다시 비어 다음 사람이 쓸 수 있다) */
function namesWithout(m,cid){
  const cur=nickMap(m),out={};
  memberCids(m).forEach(c=>{if(c!==cid)out[c]=cur[c]});
  return out;
}
/* 동시에 입장하다 내 이름이 방 정보에서 지워졌거나 예전 번호로 남아 있으면 한 번 다시 적는다 */
async function healName(){
  const N=NET,m=N&&!N.lab&&N.meta;
  if(!m||!DBH||N.healing||!memberCids(m).includes(CID)||typeof (m.names||{})[CID]==='string')return;
  N.healing=true;
  try{
    const ref=DBH.doc(roomMeta(N.code)),s=await ref.get();
    if(s.exists&&memberCids(s.data()).includes(CID)&&typeof (s.data().names||{})[CID]!=='string')await ref.update({names:namesWith(s.data(),CID,myNick())});
  }catch(e){}
  N.healing=false;
}
/* 대국 중 돌 색 p 를 맡은 접속자의 이름 (방이 아니거나 빈 자리면 빈 문자열) */
function seatNick(p){
  const m=NET&&!NET.lab&&NET.meta;if(!m)return '';
  const c=cidOfSeat(m,p);return c?nickOf(m,c):'';
}
/* 방 접속자 목록: 방장 → 참가자 → 관전자 순 */
function membersOf(m){
  const out=[],add=(c,role)=>out.push({cid:c,role,me:c===CID,seat:role==='spec'?null:seatOfCid(m,c)});
  add(m.hostCid,'host');
  guestsOf(m).forEach(c=>add(c,'player'));
  (m.specs||[]).forEach(c=>add(c,'spec'));
  const nm=nickMap(m);
  out.forEach(x=>{x.nick=nm[x.cid]||'?'});
  return out;
}

/* 방에 들어간다. 자리가 비어 있고 관전을 고르지 않았다면 참가자로, 아니면 관전자로.
   여러 명이 동시에 들어와 서로 덮어써도, 쓴 뒤에 다시 읽어 확인하고 어긋났으면 다시 시도한다 */
async function claimSeat(ref,asSpec){
  for(let t=0;t<6;t++){
    const s=await ref.get();
    if(!s.exists||s.data().status==='closed')return{err:'존재하지 않는 방 코드입니다. 숫자를 다시 확인하세요.'};
    const m=s.data();
    if(m.hostCid===CID)return{host:true,m};
    if((m.banned||[]).includes(CID))return{err:BANNED_MSG};
    if(isGuestOf(m))return{ok:true,m};
    const wantSeat=!asSpec&&seatFree(m);
    if(isSpecOf(m)&&!wantSeat)return{ok:true,spec:true,m};
    /* 이미 들어와 있는 관전자가 참가자 자리로 옮겨 앉는 경우는 인원이 늘지 않는다 */
    const member=isSpecOf(m);
    if(!member&&roomCount(m)>=ROOM_MAX)return{err:ROOM_FULL_MSG};
    const patch=wantSeat?seatPatch(m,CID):{specs:(m.specs||[]).concat([CID])};
    if(!member)patch.names=namesWith(m,CID,myNick());
    await ref.update(patch);
    const v=await ref.get(),vm=v.exists?v.data():null;
    if(vm&&(wantSeat?isGuestOf(vm):isSpecOf(vm))){
      /* 마지막 한 자리를 두고 동시에 들어와 60명을 넘겼다면 나중에 확인한 쪽이 물러난다 */
      if(!member&&roomCount(vm)>ROOM_MAX){await dropSeat(ref,CID);return{err:ROOM_FULL_MSG}}
      return{ok:true,spec:!wantSeat,full:!asSpec&&!wantSeat,m:vm};
    }
    await waitMs(60+rnd(200));
  }
  return{err:'입장하지 못했습니다. 잠시 뒤 다시 시도하세요.'};
}
/* 접속자를 방에서 뺀다 (참가자·관전자 모두). 진행 중이면 그 자리를 비워 다른 사람이 이어받을 수 있게 한다.
   ban 이 참이면 내보낸 접속자 명단에도 올린다 */
async function dropSeat(ref,cid,ban){
  for(let t=0;t<4;t++){
    const s=await ref.get();if(!s.exists)return;
    const m=s.data();
    const inSeat=guestsOf(m).includes(cid)||!!(m.seats&&Object.values(m.seats).includes(cid)),inSpec=(m.specs||[]).includes(cid);
    const needBan=!!ban&&!(m.banned||[]).includes(cid);
    if(!inSeat&&!inSpec&&!needBan)return;
    const up=inSeat?leavePatch(m,cid):{};
    if(inSpec)up.specs=(m.specs||[]).filter(x=>x!==cid);
    if(needBan)up.banned=(m.banned||[]).concat([cid]);
    if(inSeat||inSpec)up.names=namesWithout(m,cid);   /* 나간 사람의 이름은 비워 둔다 */
    await ref.update(up);
    const v=await ref.get(),vm=v.exists?v.data():null;
    if(!vm||(!hasCid(vm,cid)&&(!ban||(vm.banned||[]).includes(cid))))return;
    await waitMs(60+rnd(200));
  }
}
/* 참가자 ↔ 관전자 전환 (방장은 바꿀 수 없다) */
async function setRole(ref,cid,toSpec){
  for(let t=0;t<5;t++){
    const s=await ref.get();
    if(!s.exists||s.data().status==='closed')return{err:'방이 닫혔습니다.'};
    const m=s.data();
    if(m.hostCid===cid)return{err:'방장은 관전자로 바꿀 수 없습니다.'};
    if((m.banned||[]).includes(cid))return{err:BANNED_MSG};
    const inSeat=guestsOf(m).includes(cid),inSpec=(m.specs||[]).includes(cid);
    let patch;
    if(toSpec){
      if(inSpec&&!inSeat)return{ok:true,m};
      patch=Object.assign(leavePatch(m,cid),{specs:(m.specs||[]).filter(x=>x!==cid).concat([cid])});
    }else{
      if(inSeat)return{ok:true,m};
      if(!seatFree(m))return{err:'빈 자리가 없어 참가자가 될 수 없습니다.'};
      patch=seatPatch(m,cid);
    }
    await ref.update(patch);
    const v=await ref.get(),vm=v.exists?v.data():null;
    if(vm&&(toSpec?((vm.specs||[]).includes(cid)&&!guestsOf(vm).includes(cid)):guestsOf(vm).includes(cid)))return{ok:true,m:vm};
    await waitMs(60+rnd(200));
  }
  return{err:'바꾸지 못했습니다. 잠시 뒤 다시 시도하세요.'};
}
/* 방을 나가기 전에: 3·4인 대국 중이었다면 먼저 기권 처리해서 다른 사람들이 계속할 수 있게 한다 */
async function forfeitBeforeLeave(N){
  try{
    if(!N||N.role!=='guest'||!G||!G.st||G.st.over||NP(G.st)<=2)return;
    const me=mySeat();if(me==null||!actOf(G.st).includes(me))return;
    doResign(me);
    for(let i=0;i<30&&(N.running||N.dirty);i++)await waitMs(100)
  }catch(e){}
}
const yieldTie=()=>((NET&&NET.meta&&NET.meta.np)||2)>2?NET.role==='guest':mySeat()===2;
function startSettingsOk(m){const np=(m.settings&&m.settings.np)||m.np||2;return np>2?(m.guests||[]).length>=np-1:!!m.guestCid}
function assignSeats(m){
  const s=m.settings,np=s.np||2,ord=ORDERS[np].slice(),hc={black:1,white:2,blue:3,red:4}[s.hostColor];
  const hostC=ord.includes(hc)?hc:ord[rnd(np)];
  const rest=shuffle(ord.filter(c=>c!==hostC)),seats={};
  seats[hostC]=m.hostCid;(m.guests||[]).forEach((g,i)=>{seats[rest[i]]=g});
  return{hostC,seats};
}
async function patchSettings(patch){
  if(!NET||NET.role!=='host')return;
  const m=NET.meta,cur=Object.assign({},m.settings,patch);
  cur.np=cur.np>=3?Math.min(cur.np,4):2;
  if(cur.np>2)cur.handi=0;
  if(!colOpts(cur.np).includes(cur.hostColor))cur.hostColor='random';
  cur.handi=Math.min(cur.handi||0,maxHandi(cur.size));
  const gl=guestsOf(m);
  if(gl.length>cur.np-1){UI.roomMsg='참가자가 더 많아 인원을 줄일 수 없습니다. 먼저 일부를 관전으로 바꾸거나 내보내세요.';return render()}
  UI.roomMsg='';
  const up={settings:cur,np:cur.np,guests:cur.np>2?gl:[],guestCid:gl[0]||null};
  NET.meta=Object.assign({},m,up);render();
  try{await DBH.doc(roomMeta(NET.code)).update(up)}catch(e){netErr(e)}
}

/* 참가자 ↔ 관전자 전환, 내보내기. 되돌리기 어려운 동작(내보내기·대국 중 기권)은 4초 안에 한 번 더 눌러야 한다 */
async function roleAct(kind,cid){
  const N=NET;if(!N||N.lab||!N.meta||!DBH||!cid)return;
  const m=N.meta,host=N.role==='host',me=cid===CID;
  if(!host&&!me)return;
  if(kind==='kick'&&(!host||me))return;
  const note=t=>{UI.peopleMsg=t||'';UI.roleArm=null;render()};
  if(cid===m.hostCid)return note('방장은 관전자로 바꾸거나 내보낼 수 없습니다.');
  const st=G&&G.st,seat=seatOfCid(m,cid);
  /* 3·4인 대국 중에 자리를 떠나면 다른 사람들이 계속할 수 있도록 먼저 기권 처리한다 (2인 대국은 자리만 비운다) */
  const forfeit=!!(st&&!st.over&&NP(st)>2&&seat!=null&&actOf(st).includes(seat)&&(kind==='toSpec'||kind==='kick'));
  const key=kind+':'+cid;
  if((kind==='kick'||forfeit)&&UI.roleArm!==key){
    UI.roleArm=key;clearTimeout(UI.roleTm);
    UI.roleTm=setTimeout(()=>{if(UI.roleArm===key){UI.roleArm=null;render()}},4000);
    UI.peopleMsg=kind==='kick'?'내보내면 이 방에 다시 들어올 수 없습니다. 4초 안에 한 번 더 누르세요.':(me?'대국 중에 관전으로 바꾸면 기권 처리됩니다. 4초 안에 한 번 더 누르세요.':'대국 중인 참가자를 관전으로 바꾸면 기권 처리됩니다. 4초 안에 한 번 더 누르세요.');
    return render();
  }
  UI.roleArm=null;clearTimeout(UI.roleTm);UI.peopleMsg='';
  try{
    if(forfeit){doResign(seat);for(let i=0;i<30&&(N.running||N.dirty);i++)await waitMs(100)}
    const ref=DBH.doc(roomMeta(N.code));
    if(kind==='kick'){await dropSeat(ref,cid,true);kickConn(cid);return render()}
    const r=await setRole(ref,cid,kind==='toSpec');
    if(r&&r.err)return note(r.err);
    render();
  }catch(e){netErr(e)}
}

/* ===== 채팅 =====
   방에 있는 누구나(참가자·관전자) 글을 쓴다. 글은 쓴 사람의 문서(rooms/코드/chat/접속자)에 최근 40개만 적고,
   다른 사람들은 방의 접속자마다 그 문서를 구경(구독)해 한 줄로 합쳐 보여 준다. 쓰는 곳이 사람마다 달라 서로 덮어쓰지 않는다.
   받은 글은 이 기기의 기록에 쌓아 두므로 글쓴이가 나가도 이미 본 글은 남는다. */
const CHAT_MAX=200,CHAT_KEEP=40;
const chatPath=(code,cid)=>'rooms/'+code+'/chat/'+cid;
const cleanMsg=v=>String(v==null?'':v).replace(/[\u0000-\u001f\u007f]/g,' ').replace(/\s+/g,' ').trim().slice(0,CHAT_MAX);
function chatInit(N){return N.chat=N.chat||{log:{},subs:{},mine:[],unread:0,seq:0,last:0}}
/* 방 정보가 바뀔 때마다: 새로 들어온 접속자의 글 문서를 구경하기 시작한다 */
function chatSync(){
  const N=NET,m=N&&!N.lab&&N.meta;if(!m||!DBH)return;
  const ch=chatInit(N);
  memberCids(m).forEach(c=>{
    if(ch.subs[c])return;
    ch.subs[c]=true;
    try{N.subs.push(DBH.doc(chatPath(N.code,c)).onSnapshot(s=>chatIn(N,c,s),()=>{}))}catch(e){ch.subs[c]=false}
  });
}
function chatIn(N,c,snap){
  if(NET!==N||!snap||!snap.exists)return;
  const ch=chatInit(N),d=snap.data()||{},list=Array.isArray(d.m)?d.m:[],since=((N.meta&&N.meta.created)||0)-5000;
  if(c===CID&&!ch.mine.length)ch.mine=list.filter(x=>x&&typeof x.x==='string').slice(-CHAT_KEEP);
  let fresh=0;
  list.forEach(x=>{
    if(!x||typeof x.x!=='string'||typeof x.i!=='string'||!(x.t>=since))return;
    const key=c+':'+x.i;if(ch.log[key])return;
    ch.log[key]={c,i:x.i,t:+x.t,x:cleanMsg(x.x),n:nickOf(N.meta,c)||'?'};
    if(c!==CID)fresh++;
  });
  if(!fresh)return;
  if(!(UI.screen==='lobby'||UI.chat))ch.unread+=fresh;
  render();
}
async function chatSend(){
  const N=NET;if(!N||N.lab||!DBH||!N.meta)return;
  let el=null;try{el=document.getElementById('chat')}catch(e){}
  const x=cleanMsg(el?el.value:UI.chatDraft);if(!x)return;
  const ch=chatInit(N),now=Date.now();
  if(now-ch.last<500)return;   /* 연타 방지: 입력한 글은 그대로 둔다 */
  ch.last=now;
  const e={i:now.toString(36)+(++ch.seq),t:now,x};
  ch.mine=(ch.mine||[]).concat([e]).slice(-CHAT_KEEP);
  ch.log[CID+':'+e.i]={c:CID,i:e.i,t:e.t,x,n:nickOf(N.meta,CID)||myNick()};
  UI.chatDraft='';UI.chatErr='';if(el)el.value='';render();
  try{await DBH.doc(chatPath(N.code,CID)).set({m:ch.mine})}catch(err){if(NET===N){UI.chatErr='메시지를 보내지 못했습니다. 연결을 확인하세요.';render()}}
}
const hhmm=t=>{const d=new Date(t),z=n=>('0'+n).slice(-2);return z(d.getHours())+':'+z(d.getMinutes())};

    <div class="chatin"><input id="chat" class="input sm" maxlength="${CHAT_MAX}" autocomplete="off" enterkeyhint="send" placeholder="메시지를 입력하세요" aria-label="채팅 메시지" value="${esc(UI.chatDraft||'')}"><button class="btn pri" data-act="chatSend">보내기</button></div>`;

/* ===== 새 버전 자동 확인·적용 =====
   페이지를 열어 둔 채로 두면 업데이트 뒤에도 옛 버전이 그대로 남는다. 그래서 페이지가 스스로 새 버전이 있는지 확인한다.
   · 웹사이트(외부 파일): 이 페이지의 주소를 다시 받아 문서 앞쪽의 빌드 표지(build-id)를 비교한다.
   · claude.ai 아티팩트(내부): 공유 저장소의 taunts/ver 문서에 적힌 최신 빌드 표지와 비교한다.
   새 버전이 있으면 처음 화면에서는 곧바로 새로고침하고, 대국·방·체험·튜토리얼 중에는 작은 알림만 띄운다(진행 중인 것을 잃지 않도록).
   빌드 표지는 빌드할 때 stamp.py 가 채운다. */
const BUILD_ID='1d62ebedaf',BUILD_AT=Number('1794530210693')||0,UPD_MODE='web';
const UPD={mode:UPD_MODE,last:0,busy:false,pending:null,hidden:false,stuck:false,arm:false,applying:false,msg:'',gate:'abk_upd',timer:null};
const UPD_RE=/<meta name="build-id" content="([0-9a-f]{6,40})" data-at="(\d{10,16})"/;
function updLoad(){try{return JSON.parse(sessionStorage.getItem(UPD.gate)||'null')||{}}catch(e){return{}}}
function updSave(o){try{if(o)sessionStorage.setItem(UPD.gate,JSON.stringify(o));else sessionStorage.removeItem(UPD.gate)}catch(e){}}
const updUrl=()=>String(location.href).split('#')[0];
const updWebOk=()=>typeof location!=='undefined'&&/^https?:$/.test(location.protocol||'')&&typeof fetch==='function';
/* 웹: 이 주소의 최신 문서를 받아 앞부분에서 빌드 표지만 읽고 나머지는 받지 않는다 */
async function updFetchWeb(){
  const r=await fetch(updUrl(),{cache:'no-cache',credentials:'same-origin'});
  if(!r||!r.ok)return null;
  let m=null;
  if(r.body&&typeof r.body.getReader==='function'&&typeof TextDecoder!=='undefined'){
    const rd=r.body.getReader(),dec=new TextDecoder();let txt='';
    try{
      for(let i=0;i<80&&txt.length<400000;i++){
        const x=await rd.read();if(x.done)break;
        txt+=dec.decode(x.value,{stream:true});
        m=UPD_RE.exec(txt);if(m)break;
      }
    }finally{try{rd.cancel()}catch(e){}}
  }else m=UPD_RE.exec(await r.text());
  return m?{id:m[1],at:+m[2]}:null;
}
/* 아티팩트: 공유 저장소의 버전 문서 */
async function updFetchArt(){
  const db=typeof getDb==='function'?await getDb():null;
  if(!db)return null;
  const s=await db.doc('taunts/ver').get(),d=s&&s.exists?s.data():null;
  return d&&typeof d.id==='string'&&+d.at>0?{id:d.id,at:+d.at}:null;

/* 아티팩트: 이 빌드가 문서에 적힌 것보다 새롭고 보는 사람이 편집 권한이 있으면(주인) 이 빌드를 최신으로 적어 둔다.

async function updCheck(manual,force){

  if(UPD.mode==='web'&&!updWebOk()){if(manual){UPD.msg='이 환경(파일로 직접 열었거나 오프라인)에서는 새 버전을 확인할 수 없습니다.';updRefresh(true)}return}

  if(res&&res.id!==BUILD_ID&&res.at>BUILD_AT){

async function updApply(manual){

  try{if(UPD.mode==='web'&&updWebOk())await fetch(updUrl(),{cache:'reload'})}catch(e){}

}

function augNote(st,p,id,viewer){
  const timer=id==='ipgu'?st.timers.find(t=>t.owner===p&&t.kind==='ipgu'):null;
  const own=!NET||viewer===p;

  if(id==='fog'&&st.fog.some(f=>f.owner===p))n+=' · 안개 진행 중';
  if(timer)n+=' · 발동까지 내 차례 '+Math.max(timer.left-1,0)+'번';
  if(id==='conch'&&conchActive(st,p))n+=' · 소라고동 진행 중(남은 '+st.conch.find(c=>c.owner===p).left+'수)'+((NET&&NET.lab&&st.turn===p&&UI.rec&&UI.rec.done&&UI.rec.p===p&&UI.rec.fake)?' · 지금 표시된 수는 거짓 수':'');   /* 체험에서는 거짓 수가 나왔을 때 알려 준다 */
  if(id==='glare'&&(st.glare||[]).some(g=>g.owner===p))n+=' · 눈뽕 진행 중(상대 '+st.glare.find(g=>g.owner===p).left+'수)';
  if(id==='ember'&&(st.fire||[]).length)n+=' · 불씨 '+st.fire.length+'칸 타오르는 중';
  if(id==='mirror'&&st.echoArm===p)n+=' · 이번 착수가 대칭으로 놓임';
  if(id==='bomb'&&st.bombArm===p)n+=' · 이번 착수가 자폭병이 됨';
  if(id==='fate'&&(viewer==null||viewer===p)&&(st.fate||[]).some(f=>f.by===p))n+=' · 예측 걸어 둠 (상대 다음 수)';
  if(id==='gen'&&own)n+=' · 발전도 '+(st.gen[p]||0)+'%';
  if(id==='plague'&&st.plagueArm===p)n+=' · 이번 착수가 병원균이 됨';
  if(id==='mine'&&own&&(st.mines||[]).some(m=>m.by===p))n+=' · 지뢰 '+st.mines.filter(m=>m.by===p).length+'개 묻혀 있음';
  n+=note7(st,p,id,own);
  return n.replace(/^ · /,'');
}

/* 증강을 지금 쓸 수 있는가: 직업 전용 증강은 마나, 나머지는 남은 횟수 */
function augUsable(st,p,id,canAct){
  const a=AUG[id];
  if(a.type!=='active'||!canAct)return false;
  if(id==='m_charge'&&manaFull(st,p))return false;
  if(a.cls&&manaCost(id,st,p)>MANA_MAX&&!manaFree())return false;
  if(id==='c_cup')return cupCan(st,p);

  if(a.mode==='leap1'){

  }

    if(b[i]!==0||manh(5,a.sel,i)<1||manh(5,a.sel,i)>3){a.msg='가로+세로 합 3칸 이내의 빈 점만 가능합니다.';return render()}

  }

function augBoard(kind){
  const a=augPrac(kind),st=a.st,tg=new Set();
  if(a.mode==='snipe')st.board.forEach((c,i)=>{if(c===2)tg.add(i)});
  if(a.mode==='leap1')st.board.forEach((c,i)=>{if(c===1)tg.add(i)});

  if(a.mode==='convert')st.board.forEach((c,i)=>{if(cvNear(st.board,i))tg.add(i)});
  const live=!(a.used&&a.kind!=='snipe')&&!(a.used&&a.kind==='snipe'&&a.turn===2);
  return boardSvg(st,{live,act:'tutAugPt',targets:tg,sel:a.sel,gh:(a.used&&a.kind==='snipe'&&a.turn===1)?1:0});
