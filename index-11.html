<style>
/* 레이아웃: 상단 바 + 중앙 컬럼. 대국 화면은 바둑판(좌) / 플레이어·증강 패널(우), 좁으면 세로로 쌓임 */
:root{
  --bg:#e7ece8;--surface:#f5f7f5;--sunk:#dbe2dd;--ink:#14201b;--ink2:#52625a;--line:#c3cdc6;
  --wood:#d9ab63;--wood-edge:#a9793a;--grid:#3f2d14;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1613;--surface:#17211d;--sunk:#0c120f;--ink:#e4ece8;--ink2:#9aada3;--line:#27352f;
  --wood:#b98a46;--wood-edge:#7b5a2a;--grid:#2b1d0b;
  --passive:#52c4a2;--active:#f08068;--on:#0b110e;--shield:#5ab0ee;--warnbg:#2a1814;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1613;--surface:#17211d;--sunk:#0c120f;--ink:#e4ece8;--ink2:#9aada3;--line:#27352f;
  --wood:#b98a46;--wood-edge:#7b5a2a;--grid:#2b1d0b;
  --passive:#52c4a2;--active:#f08068;--on:#0b110e;--shield:#5ab0ee;--warnbg:#2a1814;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--passive);outline-offset:2px}
.top{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#666,#0b0b0b);display:inline-block;box-shadow:12px 0 0 -2px #e9e9e4}
.brand span{margin-left:12px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.act{background:var(--active);color:var(--on);border-color:var(--active);font-weight:700}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.wrap{max-width:1080px;margin:0 auto}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:32px;align-items:center;padding:16px 0 8px}
.hero h1{font-size:clamp(36px,7vw,60px);margin-bottom:14px}
.lead{color:var(--ink2);max-width:46ch;margin-bottom:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sm{padding:4px 12px;min-height:34px;font-size:14px}

.rules{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:8px;color:var(--ink2);font-size:14px;max-width:52ch}
.rules li{padding-left:16px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--ink2)}
.board{display:block;width:100%;height:auto}
.bd{fill:var(--wood);stroke:var(--wood-edge);stroke-width:2}
.ln{stroke:var(--grid);stroke-width:1.2;fill:none}
.star{fill:var(--grid)}
.lab{fill:var(--grid);font-size:11px;font-family:var(--f-body);opacity:.8}
.pt{cursor:pointer}
.gh{fill:transparent}
.rvfx .rvg{display:none}
.ghc{opacity:0;fill:#b4bfd3}
.pt:hover .ghc{opacity:.9}
.pt:hover .gh.p1{fill:rgba(0,0,0,.38)}
.pt:hover .gh.p2{fill:rgba(255,255,255,.6)}

.pt:hover .gh.p4{fill:rgba(220,50,40,.5)}
.sh{fill:none;stroke:var(--shield);stroke-width:3}
.tg{fill:none;stroke:var(--active);stroke-width:2.5;stroke-dasharray:3 3}
.sl{fill:none;stroke:var(--active);stroke-width:3.5}
.lm1{fill:#fff}.lm2{fill:#111}.lm3,.lm4{fill:#fff}
.uq{fill:none;stroke:#e8a400;stroke-width:2.5;stroke-dasharray:4 3}
.tmk1{fill:#111}.tmk2{fill:#f6f6f2;stroke:#111;stroke-width:1}
.tmk3{fill:#2f6fe0}.tmk4{fill:#d83a30}
.tmkn{fill:var(--grid);opacity:.45}
.dx{stroke:var(--active);stroke-width:3;fill:none}
.fogown{fill:rgba(110,120,150,.2);stroke:rgba(80,90,130,.7);stroke-width:1.2;stroke-dasharray:3 3}
.fogopp{fill:rgba(168,176,186,.96)}
.tpk{fill:none;stroke:var(--passive);stroke-width:3}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:20px}
.card p{color:var(--ink2);font-size:14px}
.card.dim{opacity:.6}
.pickable:hover{border-color:var(--ink);transform:translateY(-2px)}
.pickable{transition:transform .12s,border-color .12s}
.seal{width:48px;height:48px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:26px;color:var(--on);flex:none}
.seal.passive{background:var(--passive)}.seal.active{background:var(--active)}
.ch{display:flex;gap:12px;align-items:center}
.ch .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;padding:1px 8px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.tag.passive{color:var(--passive)}.tag.active{color:var(--active)}
.tag.turn{color:var(--ink);background:var(--warnbg);border-color:var(--active)}
.only{font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pickhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
.pickhead p{color:var(--ink2);flex-basis:100%}
.stn{width:22px;height:22px;border-radius:50%;display:inline-block;flex:none}
.stn.s1{background:radial-gradient(circle at 35% 30%,#666,#0b0b0b)}
.stn.s2{background:radial-gradient(circle at 35% 30%,#fff,#c9c9c4);box-shadow:0 0 0 1px var(--line)}
.stn.s3{background:radial-gradient(circle at 35% 30%,#a6cdff,#1c4fbd)}
.stn.s4{background:radial-gradient(circle at 35% 30%,#ffaaa0,#bd2418)}
.stn.mini{width:13px;height:13px}
.game{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:24px;align-items:start}
.side{display:grid;gap:12px;min-width:0}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.pc.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who b{font-family:var(--f-disp);font-size:18px}
.who .pr{color:var(--ink2);font-size:13px}
.who .turn{margin-left:auto;font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);padding:1px 10px;border-radius:999px}
.who .me{font-size:12px;font-weight:700;color:var(--passive)}
.nk{font-size:12px;font-weight:700;color:var(--ink2);background:var(--sunk);border-radius:999px;padding:0 8px;white-space:nowrap}
.pc2 .who .nk{font-size:11.5px;padding:0 7px}
.augs{display:grid;gap:10px}
.aug{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding-top:10px;border-top:1px solid var(--line)}
.aug:first-child{border-top:0;padding-top:0}
.aug .seal{width:36px;height:36px;font-size:20px}
.aug h3{font-size:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.aug p{font-size:13px;color:var(--ink2)}
.aug .use{grid-column:2}
.st{font-size:12px;font-weight:700;color:var(--ink2)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.msg{min-height:3em;font-size:14px;color:var(--ink2);padding:2px 2px}
.msg.err{color:var(--active)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res h3{font-size:18px;margin-bottom:6px}
.res .tot{font-family:var(--f-disp);font-size:34px;font-weight:700}
.res dl{margin:8px 0 0;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;color:var(--ink2)}
.res dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.res.multi{grid-template-columns:repeat(2,minmax(0,1fr))}
.res>div{min-width:0}
.res dt{min-width:0;overflow-wrap:anywhere}
.res.multi .tot{font-size:28px}
.res .outcol{opacity:.55}
.tb.rk{margin:6px 0 12px;width:100%;min-width:0;table-layout:fixed}
.tb.rk th:first-child,.tb.rk td:first-child{width:34%}.tb.rk th:last-child,.tb.rk td:last-child{width:26%;text-align:right}
.tb.rk .outrow{opacity:.6}
.pc.out{padding:8px 12px;opacity:.8}
/* 관전·접속자 */
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer;margin:2px 0 4px;color:var(--ink)}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--ink)}
.chk small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.ppl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pp.me{border-color:var(--passive)}
.pp .ppn{display:flex;gap:8px;align-items:center;min-width:0}
.pp .ppn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .me{font-size:12px;font-weight:700;color:var(--passive)}
.pp .ppt{font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--sunk);color:var(--ink2);justify-self:end;white-space:nowrap}
.pp .ppt.host{background:var(--ink);color:var(--bg)}
.pp .ppt.spec{background:var(--warnbg);color:var(--ink)}
.pp .ppa{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.arm{background:#c0392b;color:#fff;border-color:#c0392b}
.ppbtn{min-height:26px;padding:0 10px;font-size:12px}
@media (max-width:780px),(max-aspect-ratio:1/1){.g-info .ppbtn{min-height:0;height:18px;padding:0 8px;font-size:10.5px;line-height:16px;position:relative}.g-info .ppbtn::after{content:'';position:absolute;inset:-8px -4px}}
.ppbox{width:min(520px,100%)}
.nickrow{margin:0 0 10px;gap:8px;align-items:center;flex-wrap:nowrap}.nickrow .input.sm{max-width:220px;min-width:0;margin-bottom:0}
.chatbox{display:grid;gap:8px}
.chatlist{list-style:none;margin:0;padding:8px 10px;display:flex;flex-direction:column;gap:8px;min-height:96px;max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.chm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:baseline}
.chm .chn{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chm .cht{font-size:11px;color:var(--ink2)}
.chm .chx{grid-column:1/-1;margin:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.chm.me .chn{color:var(--passive)}
.chempty{color:var(--ink2);font-size:13px;text-align:center;padding:14px 0}
.chatin{display:flex;gap:6px}.chatin .input.sm{flex:1;min-width:0;margin-bottom:0}
.input.bad{border-color:#c0392b;box-shadow:0 0 0 2px rgba(192,57,43,.25)}
.chbtn{position:relative}
.chbadge{display:inline-block;min-width:15px;height:15px;margin-left:5px;padding:0 4px;border-radius:999px;background:#c0392b;color:#fff;font-size:10px;line-height:15px;font-weight:700;text-align:center;vertical-align:1px}
.chsheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);max-height:60vh;z-index:70;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;box-shadow:0 -6px 24px rgba(0,0,0,.28)}
.chsheet .chatlist{max-height:32vh}
.only.warnc{color:var(--active);font-weight:700}
.spectbar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;background:var(--warnbg);border:1px solid var(--active);border-radius:10px;box-shadow:0 -4px 14px rgba(0,0,0,.18);font-size:14px}
.verdict{font-family:var(--f-disp);font-size:26px;margin-bottom:4px}
.sec{margin:8px 0 14px}
.sec h2{font-size:24px}
.sec p{color:var(--ink2);max-width:60ch;margin-top:4px}
.sub{font-size:13px;color:var(--ink2)}
.lbl{font-size:13px;color:var(--ink2);margin:0 0 6px}
.info{font-size:13px;color:var(--ink2);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.warn{font-size:13px;color:var(--active);margin:0}
button:disabled{opacity:.5;cursor:not-allowed}
.tw{overflow-x:auto;max-width:100%}
.tb{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.tb th,.tb td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb thead th{font-size:12px;color:var(--ink2);letter-spacing:.04em}
.tb tbody th{font-family:var(--f-disp);font-weight:700;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:0 0 14px}
.mode{gap:8px}
.mode h3{font-size:18px}
.code{font-family:var(--f-disp);font-size:clamp(36px,10vw,56px);letter-spacing:.18em;font-weight:700;font-variant-numeric:tabular-nums}
.input{font:inherit;font-size:28px;letter-spacing:.3em;text-align:center;width:100%;max-width:300px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.banner{background:var(--warnbg);border:1px solid var(--active);border-radius:8px;padding:10px 12px;display:grid;gap:8px;font-size:14px}
.okbox{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.tut{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
.tut h2{font-size:26px;margin-bottom:8px}
.tut p{margin-bottom:10px}
.dots{display:flex;gap:6px;margin:0 0 16px}
.dot{width:28px;height:8px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--ink)}
.dot.done{background:var(--passive)}
.card.sel{border-color:var(--passive);box-shadow:0 0 0 2px var(--passive)}
.input.sm{font-size:15px;letter-spacing:0;text-align:left;max-width:100%;padding:8px 10px;margin-bottom:8px}
.botbox{margin:0 0 14px}
.bub{display:grid;gap:2px;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);animation:bubin .35s ease-out}
.bub b{font-size:11px;letter-spacing:.04em;color:var(--ink2)}
.bub.taunt{background:var(--warnbg);border-color:var(--active)}
.bub .hint{font-weight:700;color:var(--passive)}
.bub i{font-style:normal;color:var(--ink2)}
@keyframes bubin{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.game>div:first-child{position:relative}
.cring{fill:none;stroke:#e6b422;stroke-width:3;animation:conchp 1.4s ease-in-out infinite}
.cring2{fill:rgba(230,180,34,.2);stroke:none}
.cglyph{fill:none;stroke:#7a5600;stroke-width:2.6;stroke-linecap:round}
@keyframes conchp{0%,100%{stroke-opacity:1;stroke-width:3}50%{stroke-opacity:.45;stroke-width:5}}
/* 증강 효과 */
.fxring{fill:none;stroke-width:3.5;transform-box:fill-box;transform-origin:center;opacity:0;animation:fxring 1s ease-out forwards}
@keyframes fxring{0%{opacity:.95;transform:scale(.35)}100%{opacity:0;transform:scale(2.3)}}
.fxpar{opacity:0;animation:fxpar .9s ease-out forwards}
@keyframes fxpar{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.fxcross{opacity:0;transform-box:fill-box;transform-origin:center;animation:fxcross 1s ease-out forwards}
@keyframes fxcross{0%{opacity:0;transform:scale(2.2) rotate(-40deg)}35%{opacity:1;transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}
.fxtrail{stroke-width:4;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;opacity:0;animation:fxtrail 1.1s ease-out forwards}
@keyframes fxtrail{0%{opacity:1;stroke-dashoffset:400}45%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
.fxx{stroke:#e0482f;stroke-width:4;stroke-linecap:round;opacity:0;animation:fxx 1s ease-out forwards}
@keyframes fxx{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.fxfl{font:700 18px var(--f-body);fill:#ffd24a;stroke:#5a3c00;stroke-width:3px;paint-order:stroke;opacity:0;animation:fxfl 1.5s ease-out forwards}
@keyframes fxfl{0%{opacity:0;transform:translateY(4px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.fxline{fill:none;stroke:#ffd24a;stroke-width:8;stroke-linecap:round;opacity:0;animation:fxline 2.2s ease-out forwards}
@keyframes fxline{0%{opacity:0}15%{opacity:1}60%{opacity:1}100%{opacity:0}}
.fxpuff{opacity:0;transform-box:fill-box;transform-origin:center;animation:fxpuff 1.9s ease-out forwards}
@keyframes fxpuff{0%{opacity:0;transform:scale(.3)}30%{opacity:.62}100%{opacity:0;transform:scale(1.25)}}
.fxwave{fill:none;stroke-width:4;transform-box:fill-box;transform-origin:center;opacity:0;animation:fxwave 1.6s ease-out forwards}
@keyframes fxwave{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}
.fxglare{fill:#fff;opacity:0;animation:fxglare 1.5s ease-out forwards}
@keyframes fxglare{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
.fxspin{fill:none;stroke-width:5;stroke-dasharray:18 12;transform-box:fill-box;transform-origin:center;opacity:0;animation:fxspin 1.6s ease-in-out forwards}
@keyframes fxspin{0%{opacity:0;transform:rotate(0)}20%{opacity:.9}100%{opacity:0;transform:rotate(-300deg)}}

<script>
'use strict';
const NAME={1:'흑',2:'백',3:'청',4:'적'};
/* 3·4인 대국: 착수 순서는 흑→청→(적)→백. 돌 색 번호는 1=흑 2=백 3=청 4=적 */
const ORDERS={2:[1,2],3:[1,3,2],4:[1,3,4,2]};
const ordOf=st=>(st&&st.order)||ORDERS[2];
const NP=st=>ordOf(st).length;
/* 기권한 사람(st.out)은 차례에서 빠진다 */
const actOf=st=>ordOf(st).filter(q=>!((st&&st.out)||[]).includes(q));
const nextP=(st,p)=>{const o=ordOf(st);let i=o.indexOf(p);for(let k=0;k<o.length;k++){i=(i+1)%o.length;if(!((st&&st.out)||[]).includes(o[i]))return o[i]}return p};
const prevP=(st,p)=>{const o=ordOf(st);let i=o.indexOf(p);for(let k=0;k<o.length;k++){i=(i-1+o.length)%o.length;if(!((st&&st.out)||[]).includes(o[i]))return o[i]}return p};
const othersOf=(st,p)=>actOf(st).filter(q=>q!==p);
/* 「상대」가 한 명이어야 하는 효과의 대상: 내 다음 차례 플레이어 (2인에서는 상대방) */
const OPP=(st,p)=>nextP(st,p);
const isFoe=(st,p,c)=>c!==0&&c!==p&&ordOf(st).includes(c);
const per=f=>({1:f(),2:f(),3:f(),4:f()});
/* 돌 무리 stones(색 c)가 따내어졌을 때 사석을 받을 사람. 2인은 상대, 3·4인은 그 무리와 가장 많이 맞닿은 다른 색 */
function creditTo(st,c,stones){
  if(NP(st)===2)return 3-c;
  const cnt={};
  stones.forEach(k=>nb(st.n,k).forEach(m=>{const d=st.board[m];if(d&&d!==c&&ordOf(st).includes(d))cnt[d]=(cnt[d]||0)+1}));
  let best=null,bn=0;
  ordOf(st).forEach(q=>{if((cnt[q]||0)>bn){bn=cnt[q];best=q}});
  return best||nextP(st,c);
}
const NEUT=9;   /* 어느 쪽 집도 아닌 칸 표시 */
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=v=>String(Math.round(v*100)/100);

/* ===== 바둑 엔진 ===== */
function nb(n,i){const x=i%n,y=(i/n)|0,r=[];if(x>0)r.push(i-1);if(x<n-1)r.push(i+1);if(y>0)r.push(i-n);if(y<n-1)r.push(i+n);return r}
function cheb(n,a,b){return Math.max(Math.abs(a%n-b%n),Math.abs(((a/n)|0)-((b/n)|0)))}
function manh(n,a,b){return Math.abs(a%n-b%n)+Math.abs(((a/n)|0)-((b/n)|0))}
function groupOf(st,board,i){
  const c=board[i],seen=new Set([i]),stack=[i],libs=new Set();
  while(stack.length){const k=stack.pop();for(const m of nb(st.n,k)){
    if(board[m]===0)libs.add(m);else if(board[m]===c&&!seen.has(m)){seen.add(m);stack.push(m)}}}
  return{stones:[...seen],libs:[...libs]};
}
/* 얼음: st.ice=[{pt,exp}] — 수(ply)가 exp가 되기 전까지 그 칸은 얼어 있다. 얼어붙은 빈 칸에는 착수할 수 없고, 얼어붙은 돌은 성벽처럼 무적이다 */
const iceOn=(st,i)=>{const a=st&&st.ice;if(!a||!a.length)return false;for(let k=0;k<a.length;k++)if(a[k].pt===i&&a[k].exp>st.ply)return true;return false};
function isProtected(st,g){return g.stones.some(k=>(st.shield[k]||0)>st.ply||iceOn(st,k))}
/* 성벽은 무적: 성벽으로 보호 중인 그룹의 돌 전체. 따내기뿐 아니라 저격·유성·벼락·무심 같은 제거 효과도 받지 않는다 */
function invSet(st){
  const s=new Set(),L=st.n*st.n;
  for(let i=0;i<L;i++){
    if(s.has(i)||!st.board[i]||((st.shield[i]||0)<=st.ply&&!iceOn(st,i)))continue;
    groupOf(st,st.board,i).stones.forEach(k=>s.add(k));
  }
  return s;
}
function simulate(st,idx,p,boardIn){
  const board=(boardIn||st.board).slice();
  if(board[idx]!==0)return{ok:false,reason:'이미 돌이 있는 자리입니다.'};
  if(st.fire&&st.fire.length&&st.fire.includes(idx))return{ok:false,reason:'불타는 칸에는 돌을 둘 수 없습니다.'};
  if(st.ice&&st.ice.length&&iceOn(st,idx))return{ok:false,reason:'얼어붙은 칸에는 돌을 둘 수 없습니다.'};
  board[idx]=p;
  const captured=[],done=new Set();
  for(const m of nb(st.n,idx)){
    if(board[m]!==0&&board[m]!==p&&!done.has(m)){
      const g=groupOf(st,board,m);g.stones.forEach(k=>done.add(k));
      if(g.libs.length===0&&!isProtected(st,g))captured.push(...g.stones);
    }
  }
  captured.forEach(k=>{board[k]=0});
  const own=groupOf(st,board,idx);
  if(own.libs.length===0)return{ok:false,reason:'활로가 없는 자리입니다. 성벽으로 보호된 돌은 따낼 수 없습니다.'};
  return{ok:true,board,captured,own};
}
/* 상대가 환각으로 깔아 둔 거짓돌 자리는 내 눈에는 돌이다. 일반 착수는 거짓돌을 지우고 그 자리에 그대로 놓이고, 증강 대상으로는 진짜 돌처럼 취급한다 */
const fkAt=(st,p,i)=>(st.fake||[]).some(f=>f.owner!==p&&f.pts.includes(i));
function checkMove(st,idx,p){
  if(st.extra&&st.extra.from!=null&&cheb(st.n,idx,st.extra.from)>1)
    return{ok:false,reason:'두 번째 돌은 첫 돌 바로 옆 8칸 안에만 둘 수 있습니다.'};
  if(st.ko===idx)return{ok:false,reason:'패입니다. 바로 되따낼 수 없으니 다른 곳에 한 수 두세요.'};
  const r=simulate(st,idx,p);
  if(r.ok&&st.river&&st.river.length&&riverDoom(st,idx,p,r))return{ok:false,reason:'강물에 떠내려가 활로를 잃고 바로 잡히는 자리입니다. 강 위에는 흘러간 뒤에도 살아남는 자리에 두세요.'};
  return r;
}
function starPts(n){const a=n<=9?2:3;return{a,c:n-1-a,m:(n-1)/2}}
const maxHandi=n=>n===9?5:9;
function handicapPoints(n,k){
  const {a,c,m}=starPts(n),P=(x,y)=>y*n+x;
  const corners=[P(c,c),P(a,a),P(c,a),P(a,c)],side=[P(a,m),P(c,m),P(m,a),P(m,c)];
  if(k<=4)return corners.slice(0,k);
  if(k===5)return[...corners,P(m,m)];
  if(k===6)return[...corners,side[0],side[1]];
  if(k===7)return[...corners,side[0],side[1],P(m,m)];
  if(k===8)return[...corners,...side];
  return[...corners,...side,P(m,m)];
}
/* 일직선으로 끊김 없이 이어진 같은 색 돌이 len개 이상인지 (가로·세로·대각선) */
function hasLine(st,p,len){
  const n=st.n,b=st.board,dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(b[y*n+x]!==p)continue;
    for(const [dx,dy] of dirs){
      let k=1,X=x+dx,Y=y+dy;
      while(X>=0&&Y>=0&&X<n&&Y<n&&b[Y*n+X]===p){k++;X+=dx;Y+=dy}
      if(k>=len)return true;
    }
  }
  return false;
}
function linePts(st,p,len){
  const n=st.n,b=st.board,dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(b[y*n+x]!==p)continue;
    for(const [dx,dy] of dirs){
      const pts=[y*n+x];let X=x+dx,Y=y+dy;
      while(X>=0&&Y>=0&&X<n&&Y<n&&b[Y*n+X]===p){pts.push(Y*n+X);X+=dx;Y+=dy}
      if(pts.length>=len)return pts;
    }
  }
  return [];
}
/* 눈목자(가로1·세로3 또는 가로3·세로1)로 이어진 같은 색 돌 무리 중 돌 2개 이상인 무리의 수 */
function nunmokClusters(st,p,deadSet){
  const n=st.n,idx=[];
  for(let i=0;i<n*n;i++)if(st.board[i]===p&&!deadSet.has(i))idx.push(i);
  const par=new Map(idx.map(i=>[i,i])),find=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x)}return x};
  for(const i of idx){
    const x=i%n,y=(i/n)|0;
    for(const [dx,dy] of [[1,3],[3,1],[-1,3],[-3,1]]){
      const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=n||Y>=n)continue;
      const j=Y*n+X;if(par.has(j))par.set(find(i),find(j));
    }
  }
  const size=new Map();idx.forEach(i=>{const r=find(i);size.set(r,(size.get(r)||0)+1)});
  let c=0;size.forEach(v=>{if(v>=2)c++});return c;
}

/* ===== 자동 판세 판독 (Pachi와 같은 방식: 몬테카를로 모의 대국 + 생사 판정) ===== */
const DXY=[[-1,-1],[1,-1],[-1,1],[1,1]];
function trueEye(b,n,idx,p,a){
  for(let j=0;j<a.length;j++)if(b[a[j]]!==p)return false;
  const x=idx%n,y=(idx/n)|0;let bad=0,edge=false;
  for(let d=0;d<4;d++){
    const X=x+DXY[d][0],Y=y+DXY[d][1];
    if(X<0||Y<0||X>=n||Y>=n){edge=true;continue}
    if(b[Y*n+X]===3-p)bad++;
  }

function bensonAlive(st,c){
  const n=st.n,N=n*n,b=st.board,cid=new Int32Array(N).fill(-1),chains=[];
  for(let i=0;i<N;i++){
    if(b[i]!==c||cid[i]>=0)continue;
    const id=chains.length,s=[i],stones=[i];cid[i]=id;
    while(s.length){const k=s.pop();for(const m of nb(n,k)){if(b[m]===c&&cid[m]<0){cid[m]=id;s.push(m);stones.push(m)}}}
    chains.push(stones);
  }
  const rid=new Int32Array(N).fill(-1),regs=[];
  for(let i=0;i<N;i++){
    if(b[i]===c||rid[i]>=0)continue;
    const id=regs.length,s=[i],reg={empties:[],adj:new Set(),vital:new Set()};rid[i]=id;
    while(s.length){const k=s.pop();
      if(b[k]===0)reg.empties.push(k);
      for(const m of nb(n,k)){
        if(b[m]===c)reg.adj.add(cid[m]);
        else if(rid[m]<0){rid[m]=id;s.push(m)}}}
    if(reg.empties.length){
      for(const ch of reg.adj){
        if(reg.empties.every(e=>nb(n,e).some(m=>cid[m]===ch)))reg.vital.add(ch);
      }
    }
    regs.push(reg);
  }
  const aliveCh=new Set(chains.map((_,i)=>i)),liveReg=new Set(regs.map((_,i)=>i));
  let changed=true;
  while(changed){
    changed=false;
    for(const ci of [...aliveCh]){
      let k=0;for(const ri of liveReg)if(regs[ri].vital.has(ci))k++;
      if(k<2){aliveCh.delete(ci);changed=true}
    }
    for(const ri of [...liveReg]){
      for(const a of regs[ri].adj){if(!aliveCh.has(a)){liveReg.delete(ri);changed=true;break}}
    }
  }
  const res=[];aliveCh.forEach(ci=>res.push(...chains[ci]));
  return res;
}
function sekiStones(st){
  const groups=[],seen=new Set();
  for(let i=0;i<st.n*st.n;i++){
    if(!st.board[i]||seen.has(i))continue;
    const g=groupOf(st,st.board,i);g.stones.forEach(k=>seen.add(k));
    groups.push({c:st.board[i],stones:g.stones,key:g.libs.slice().sort((x,y)=>x-y).join(','),nl:g.libs.length});
  }
  const by=new Map();
  groups.forEach(g=>{if(g.nl<2)return;if(!by.has(g.key))by.set(g.key,[]);by.get(g.key).push(g)});
  const res=[];
  by.forEach(list=>{if(list.some(g=>g.c===1)&&list.some(g=>g.c===2))list.forEach(g=>res.push(...g.stones))});
  return res;
}
function makeEstimator(st,total){
  const n=st.n,N=n*n,own=new Float32Array(N),nbs=[];
  for(let i=0;i<N;i++)nbs.push(nb(n,i));
  const base=Int8Array.from(st.board),mark=new Int32Array(N),buf=new Int32Array(N);
  const arr=new Int32Array(N),pos=new Int32Array(N),capd=[];
  let stamp=0,gl=0,gc=0,done=0,b=null,cnt=0,last=-1;
  function grp(i){
    const c=b[i];stamp++;gl=0;gc=1;buf[0]=i;mark[i]=stamp;let h=0;
    while(h<gc){const a=nbs[buf[h++]];for(let j=0;j<a.length;j++){const m=a[j];
      if(mark[m]===stamp)continue;
      if(b[m]===0){mark[m]=stamp;gl++}else if(b[m]===c){mark[m]=stamp;buf[gc++]=m}}}
  }
  function swp(x,y){const u=arr[x],v=arr[y];arr[x]=v;arr[y]=u;pos[v]=x;pos[u]=y}
  function libPoint(){
    for(let q=0;q<gc;q++){const a=nbs[buf[q]];for(let j=0;j<a.length;j++)if(b[a[j]]===0)return a[j]}
    return -1;
  }
  function play(idx,p,minLibs){
    b[idx]=p;capd.length=0;
    const a=nbs[idx];
    for(let j=0;j<a.length;j++){const m=a[j];
      if(b[m]===3-p){grp(m);if(gl===0){for(let q=0;q<gc;q++){b[buf[q]]=0;capd.push(buf[q])}}}}
    grp(idx);
    if(capd.length===0&&gl<minLibs){b[idx]=0;return false}
    const pi=pos[idx];swp(pi,cnt-1);pos[idx]=-1;cnt--;
    for(let q=0;q<capd.length;q++){const k=capd[q];arr[cnt]=k;pos[k]=cnt++}
    last=idx;return true;
  }
  function localMove(p){
    if(last<0)return false;
    const a=nbs[last],cand=[];
    for(let j=0;j<a.length;j++){
      const m=a[j],c=b[m];if(c===0)continue;
      grp(m);if(gl!==1)continue;
      const lp=libPoint();if(lp<0)continue;
      cand.push(lp*4+(c===p?2:1));
    }
    while(cand.length){
      const r=(Math.random()*cand.length)|0,v=cand[r];cand.splice(r,1);
      const idx=v>>2;
      if(b[idx]!==0)continue;
      if(play(idx,p,v&3))return true;
    }
    return false;
  }
  function playout(t){
    b=Int8Array.from(base);pos.fill(-1);cnt=0;last=-1;
    for(let i=0;i<N;i++)if(b[i]===0){arr[cnt]=i;pos[i]=cnt++}
    let p=(t&1)?st.turn:3-st.turn,passes=0,moves=0;
    while(passes<2&&moves<N*1.6){
      let played=false;
      if(Math.random()<0.85&&localMove(p))played=true;
      if(!played){
        let ec=cnt;
        while(ec>0){
          const r=(Math.random()*ec)|0,idx=arr[r];swp(r,ec-1);ec--;
          if(trueEye(b,n,idx,p,nbs[idx]))continue;
          if(play(idx,p,1)){played=true;break}
        }
      }
      if(played)passes=0;else{passes++;last=-1}
      p=3-p;moves++;
    }
    stamp++;
    for(let i=0;i<N;i++){
      if(b[i]){own[i]+=b[i]===1?1:-1;continue}
      if(mark[i]===stamp)continue;
      let h=0,k=1,bl=0,wh=0;buf[0]=i;mark[i]=stamp;
      while(h<k){const a=nbs[buf[h++]];for(let j=0;j<a.length;j++){const m=a[j];
        if(b[m]===0){if(mark[m]!==stamp){mark[m]=stamp;buf[k++]=m}}else if(b[m]===1)bl=1;else wh=1}}
      const v=bl&&!wh?1:wh&&!bl?-1:0;
      if(v)for(let q=0;q<k;q++)own[buf[q]]+=v;
    }
  }
  return{
    run(k){const end=Math.min(total,done+k);while(done<end)playout(done++)},
    finished(){return done>=total},
    more(k){total+=k},
    area(){let s=0;for(let i=0;i<N;i++)s+=own[i];return s/Math.max(done,1)},
    progress(){return done/total},
    result(){
      const prot=new Set();
      bensonAlive(st,1).forEach(k=>prot.add(k));bensonAlive(st,2).forEach(k=>prot.add(k));
      sekiStones(st).forEach(k=>prot.add(k));
      const dead=[],unc=[],seen=new Set(),dn=Math.max(done,1),info=[],gid=new Int32Array(N).fill(-1);
      for(let i=0;i<N;i++){
        if(!base[i]||seen.has(i))continue;
        const g=groupOf(st,st.board,i);g.stones.forEach(k=>seen.add(k));
        const id=info.length;g.stones.forEach(k=>{gid[k]=id});
        if(g.stones.some(k=>prot.has(k))){info.push({stones:g.stones,s:1,dead:false,prot:true});continue}
        const sg=base[i]===1?1:-1;let s=0;g.stones.forEach(k=>{s+=own[k]*sg});s=s/g.stones.length/dn;
        info.push({stones:g.stones,s,dead:s<-0.05,unc:Math.abs(s)<0.45});
      }
      /* 서로 맞닿은 두 그룹이 동시에 죽었다고 나오는 모순이 있으면, 더 살아남은 쪽을 살리고 둘 다 불확실로 표시한다 */
      for(let a=0;a<info.length;a++){
        const A=info[a];if(!A.dead)continue;
        const nbG=new Set();A.stones.forEach(k=>{for(const m of nbs[k])if(base[m]&&gid[m]!==a&&base[m]!==base[k])nbG.add(gid[m])});
        nbG.forEach(bi=>{
          const B=info[bi];
          if(!B||!B.dead||!A.dead)return;
          if(A.s>=B.s){A.dead=false}else{B.dead=false}
          A.unc=B.unc=true;
        });
      }
      info.forEach(g=>{if(g.dead)dead.push(...g.stones);if(g.unc)unc.push(...g.stones)});
      return{dead,unc};
    }
  };
}

/* ===== 집 지도와 점수 ===== */
/* 죽은 돌 = 표시된 사석 + 기권한 사람의 돌 전부 */
function deadSet(st){const d=new Set(st.dead||[]),o=st.out||[];if(o.length)st.board.forEach((v,i)=>{if(v&&o.includes(v))d.add(i)});return d}
function terrInfo(st){
  const n=st.n,dead=deadSet(st),b=st.board.map((v,i)=>dead.has(i)?0:v),map=new Int8Array(n*n),seen=new Set(),regions=[];
  let bigNeutral=0,openSplit=0;
  const addRegion=(pts,color)=>{
    const bs=new Set();pts.forEach(k=>{for(const m of nb(n,k))if(b[m]===color)bs.add(m)});
    regions.push({pts,color,stones:bs.size,b:[...bs],closed:false});
  };
  for(let i=0;i<n*n;i++){
    if(b[i]||seen.has(i))continue;
    const reg=[i],stack=[i],bd=new Set(),bs=new Set();seen.add(i);
    while(stack.length){const k=stack.pop();for(const m of nb(n,k)){
      if(b[m]===0){if(!seen.has(m)){seen.add(m);stack.push(m);reg.push(m)}}else{bd.add(b[m]);bs.add(m)}}}
    if(bd.size===1){
      const v=[...bd][0];
      reg.forEach(k=>{map[k]=v});
      regions.push({pts:reg,color:v,stones:bs.size,b:[...bs],closed:true});
      continue;
    }
    if(bd.size===0){reg.forEach(k=>{map[k]=NEUT});continue}
    /* 흑·백이 모두 맞닿은 빈 영역: 경계가 덜 닫힌 판(공배가 비어 있거나 열린 경계)이다.
       가장 가까운 돌 기준으로 나누고, 서로 다른 쪽 집이 맞닿는 점은 공배로 남긴다. */
    const inReg=new Set(reg),dist={},cols=[...bd];
    for(const c of cols){
      const D=dist[c]=new Map(),q=[];
      reg.forEach(k=>{if(nb(n,k).some(m=>b[m]===c)){D.set(k,1);q.push(k)}});
      for(let h=0;h<q.length;h++){const k=q[h];for(const m of nb(n,k)){if(inReg.has(m)&&!D.has(m)){D.set(m,D.get(k)+1);q.push(m)}}}
    }
    const own=new Map();
    reg.forEach(k=>{
      let best=1e9,bc=NEUT,tie=false;
      for(const c of cols){const d=dist[c].get(k)||1e9;if(d<best){best=d;bc=c;tie=false}else if(d===best)tie=true}
      own.set(k,tie||best>=1e9?NEUT:bc);
    });
    const fin=new Map();
    reg.forEach(k=>{
      const o=own.get(k);
      fin.set(k,(o!==NEUT&&nb(n,k).some(m=>inReg.has(m)&&own.get(m)!==NEUT&&own.get(m)!==o))?NEUT:o);
    });
    reg.forEach(k=>{map[k]=fin.get(k)});
    for(const c of cols){
      const done=new Set();
      reg.forEach(k=>{
        if(fin.get(k)!==c||done.has(k))return;
        const comp=[k],st2=[k];done.add(k);
        while(st2.length){const x=st2.pop();for(const m of nb(n,x)){if(inReg.has(m)&&fin.get(m)===c&&!done.has(m)){done.add(m);st2.push(m);comp.push(m)}}}
        addRegion(comp,c);
        if(comp.length>=10)openSplit++;   /* 경계가 열린 채 거리로 나눈 넓은 집 */
      });
    }
    /* 어느 쪽 집도 아닌 넓은 빈 영역 */
    const doneN=new Set();
    reg.forEach(k=>{
      if(fin.get(k)!==NEUT||doneN.has(k))return;
      let size=0;const st2=[k];doneN.add(k);
      while(st2.length){const x=st2.pop();size++;for(const m of nb(n,x)){if(inReg.has(m)&&fin.get(m)===NEUT&&!doneN.has(m)){doneN.add(m);st2.push(m)}}}

function terrMap(st){return terrInfo(st).map}
function countGroups(st,stones){
  const seen=new Set();let c=0;
  for(const i of stones){if(seen.has(i))continue;c++;groupOf(st,st.board,i).stones.forEach(k=>seen.add(k))}
  return c;
}
/* 복제: 상대가 가진 패시브 증강(전직 전용 제외)이 나에게도 적용된다. 현재 가진 것뿐 아니라 앞으로 얻는 것도 이 계산으로 곧바로 반영된다 */
const copyable=id=>{const a=AUG[id];return !!a&&a.type==='passive'&&!a.cls&&id!=='copy'};
function copiedPassives(st,p){
  const mine=(st.augs&&st.augs[p])||[];
  if(!mine.includes('copy'))return [];
  const out=[];
  othersOf(st,p).forEach(q=>{((st.augs&&st.augs[q])||[]).forEach(id=>{if(copyable(id)&&!mine.includes(id)&&!out.includes(id))out.push(id)})});
  return out;
}
const augsEff=(st,p)=>{const own=(st.augs&&st.augs[p])||[];return own.includes('copy')?own.concat(copiedPassives(st,p)):own};
const hasAugC=(st,p,id)=>{
  const a=(st.augs&&st.augs[p])||[];
  if(a.includes(id))return true;
  if(!a.includes('copy')||!copyable(id))return false;
  return othersOf(st,p).some(q=>((st.augs&&st.augs[q])||[]).includes(id));
};
/* 한국식 계가: 집(빈 점) + 사석 + 증강 점수 */
function finalScore(st){
  const n=st.n,mid=(n-1)/2,dead=deadSet(st);
  const b=st.board.map((v,i)=>dead.has(i)?0:v);
  const ha=st.hadj||{1:0,2:0},ord=ordOf(st),np=ord.length;
  const pris={};ord.forEach(q=>{pris[q]=(st.prisoners[q]||0)+(ha[q]||0)});
  const T=terrInfo(st),terr={};ord.forEach(q=>{terr[q]=0});
  /* 사석: 2인은 상대의 몫, 3·4인은 그 돌이 놓인 자리를 집으로 가진 사람의 몫 */
  dead.forEach(i=>{const c=st.board[i];if(np===2){pris[3-c]++;return}const o=T.map[i];if(o&&o!==NEUT&&o!==c&&pris[o]!=null)pris[o]++});
  T.regions.forEach(r=>{terr[r.color]+=r.pts.length});
  const P=st.P,rows={};
  for(const p of ord){
    const parts=[['집',terr[p]],['사석',pris[p]]];
    if(np===2&&p===2)parts.push(['덤',st.komi]);
    for(const id of augsEff(st,p)){
      if(id==='komi')parts.push(['두터운 덤',P.komi]);
      if(id==='prize')parts.push(['포로 보상 (사석 '+pris[p]+'개)',pris[p]*P.prize]);
      if(id==='estate')parts.push(['부동산 투자자 (집 '+terr[p]+')',terr[p]*P.estate]);
      if(id==='center'){let c=0;const r=P.center.r;for(let i=0;i<n*n;i++){if(b[i]===p&&Math.abs(i%n-mid)<=r&&Math.abs(((i/n)|0)-mid)<=r)c++}parts.push(['중원의 기세 ('+c+'개)',c*P.center.v])}
      if(id==='nun'){const c=nunmokClusters(st,p,dead);parts.push(['눈목자 (무리 '+c+'개)',c*P.nun])}
    }
    if(st.sp){
      let d=0,jn=0,dn=0;
      T.regions.forEach(r=>{
        if(r.color!==p)return;
        const hasJ=r.b.some(k=>st.sp[k]==='j'),hasD=r.b.some(k=>st.sp[k]==='d');
        if(hasJ)jn++;if(hasD)dn++;
        d+=r.pts.length*((hasJ?P.sp.joy:1)*(hasD?P.sp.despair:1)-1);
      });
      if(Math.abs(d)>1e-9)parts.push(['황홀·절망 보정'+(jn?' (황홀 집 '+jn+'곳)':'')+(dn?' (절망 집 '+dn+'곳)':''),d]);
    }
    /* 천원·오만 */
    if(hasAugC(st,p,'tengen')&&b[mid*n+mid]===p)parts.push(['천원 (중앙의 돌)',P.tengen.v]);
    {const k=othersOf(st,p).filter(q=>hasAugC(st,q,'pride')).length;if(k)parts.push(['오만 (상대가 준 점수'+(k>1?' ×'+k:'')+')',P.pride.give*k])}
    if(hasAugC(st,p,'pride')){
      let adj=0;
      if(st.sp)T.regions.forEach(r=>{if(r.color!==p)return;const hasJ=r.b.some(k=>st.sp[k]==='j'),hasD=r.b.some(k=>st.sp[k]==='d');adj+=r.pts.length*((hasJ?P.sp.joy:1)*(hasD?P.sp.despair:1)-1)});
      const base=terr[p]+adj;
      parts.push(['오만 (집 ×'+fmt(P.pride.mul)+')',base*(P.pride.mul-1)]);
    }
    rows[p]={parts,total:parts.reduce((s,x)=>s+x[1],0)};
  }
  /* 소수 점수(0.1·0.25 등)의 계산 오차 때문에 무승부가 「0점 승」으로 나오지 않도록 반올림한다 */
  if(np===2){
    const diff=Math.round((rows[1].total-rows[2].total)*1e6)/1e6;
    return{rows,winner:diff>0?1:2,diff:Math.abs(diff),ranking:(diff>0?[1,2]:[2,1])};
  }
  /* 3·4인: 개인전. 점수 순으로 줄을 세우고, 같은 점수는 공동 순위 */
  const outs=(st.out||[]).filter(q=>ord.includes(q)),act=ord.filter(q=>!outs.includes(q));
  outs.forEach(q=>{rows[q].out=true});
  const rk0=act.slice().sort((a,b)=>Math.round((rows[b].total-rows[a].total)*1e6)-0||ord.indexOf(a)-ord.indexOf(b));
  const rk=rk0.concat(outs.slice().reverse());   /* 기권한 사람은 맨 아래, 늦게 기권한 사람이 위 */
  const top=Math.round(rows[rk0[0]].total*1e6)/1e6;
  const tied=rk0.filter(q=>Math.round(rows[q].total*1e6)/1e6===top);
  const second=rk0.find(q=>!tied.includes(q));
  const diff=second==null?0:Math.round((top-rows[second].total)*1e6)/1e6;
  return{rows,winner:rk0[0],winners:tied,diff:tied.length>1?0:diff,ranking:rk,multi:true,outs};
}

/* 도둑·의심으로 몰래 오가는 사석까지 합친 실제 사석 수 */
const effPris=(st,p)=>Math.round(((st.prisoners[p]||0)+((st.hadj&&st.hadj[p])||0))*10)/10;

/* ===== 알까기 물리엔진 =====
   단위: 줄 간격 = 1. 돌은 반지름 R인 원판, 바닥 마찰로 감속하고 서로 탄성 충돌한다.
   성벽 보호 돌과 귤은 움직이지 않는 장애물이다. 판 가장자리를 넘은 돌은 떨어진다.
   끝난 뒤 연속 좌표를 교차점으로 정리하고, 바둑에서 나올 수 없는 배치는 가장 가까운 합법 자리로 조정한다. */
function settleBoard(st,board,p){
  const n=st.n,b=board.slice(),captured=[],seen=new Set();
  for(let i=0;i<n*n;i++){
    if(b[i]===0||b[i]===p||seen.has(i))continue;
    const g=groupOf(st,b,i);g.stones.forEach(k=>seen.add(k));
    if(g.libs.length===0&&!isProtected(st,g))captured.push(...g.stones);
  }
  captured.forEach(k=>{b[k]=0});
  for(let i=0;i<n*n;i++){
    if(b[i]!==p)continue;
    const g=groupOf(st,b,i);
    if(g.libs.length===0&&!isProtected(st,g))return{ok:false,reason:'그렇게 하면 내 돌이 활로를 잃어 잡힙니다.'};
  }
  return{ok:true,board:b,captured};
}
/* 큰 돌(귤 2×2 · 빼빼로 3×1) 도우미: 종류 1=귤, 2=가로 빼빼로, 3=세로 빼빼로 */

/* ===== 알까기 재생 계획 =====

    let lo=0,hi=p.length-1;while(hi-lo>1){const k=(lo+hi)>>1;if(p[k][0]<=m)lo=k;else hi=k}
    const w=p[hi][0]-p[lo][0],f=w>0?(m-p[lo][0])/w:0;
    return[p[lo][1]+(p[hi][1]-p[lo][1])*f,p[lo][2]+(p[hi][2]-p[lo][2])*f];
  };
  return{end,stones,hits,big,posAt,ms:t=>ms(t*DT),FADE};
}

  desc:P=>`상대가 착수할 때 ${Math.round(P.misery.p*100)}% 확률로 상대 돌이 절망돌이 됩니다. 절망돌로 만든 집은 점수가 ${P.sp.despair}배입니다.`,
  det:P=>`상대가 착수할 때 ${Math.round(P.misery.p*100)}% 확률로 절망돌이 놓입니다. 절망돌로 만든 집은 점수 ×${P.sp.despair}.`,
  vals:P=>`${Math.round(P.misery.p*100)}% · ×${P.sp.despair}`},
 {id:'thief',type:'passive',glyph:'盜',name:'도둑',online:true,
  desc:P=>`내 차례마다 상대 사석을 몰래 ${P.thief.n}개까지 훔칩니다. 상대가 의심해 맞히면 무효가 되고 사석 ${P.doubt.gain}개를 내줍니다.`,
  det:P=>`내 차례마다 상대 사석을 ${P.thief.n}개까지 몰래 훔칩니다. 의심: 직전의 수상한 행동이 있었다면 모두 무효가 되고 사석 ${P.doubt.gain}개를 받으며, 빗나가면 ${P.doubt.cool}수 동안 의심할 수 없습니다.`,
  vals:P=>`차례당 ${P.thief.n}개 · 의심 쿨타임 ${P.doubt.cool}수`},
 {id:'cheat',type:'passive',glyph:'騙',name:'타짜',online:true,
  desc:P=>`내 차례마다 돌을 몰래 한 개 더 둡니다. 상대가 의심해 맞히면 무효가 되고 사석 ${P.doubt.gain}개를 내줍니다.`,
  det:P=>`내 차례마다 돌을 한 개 더 몰래 둡니다. 의심: 직전의 수상한 행동이 있었다면 모두 무효가 되고 사석 ${P.doubt.gain}개를 받으며, 빗나가면 ${P.doubt.cool}수 동안 의심할 수 없습니다.`,
  vals:P=>`차례당 1개 · 의심 쿨타임 ${P.doubt.cool}수`},
 {id:'halluc',type:'passive',glyph:'幻',name:'환각',online:true,
  desc:P=>`상대 눈에만 진짜처럼 보이는 거짓돌을 ${P.halluc.n}개 깝니다. 상대가 그 자리에 두면 사라집니다.`,
  det:P=>`상대에게는 진짜처럼 보이지만 상대가 그 자리에 착수하면 사라집니다. 내 화면에는 반투명 돌로 보이며, 내가 그 자리에 두거나 저격·유성·벼락을 받아도 사라집니다.`,
  vals:P=>`거짓돌 ${P.halluc.n}개`},
 {id:'delusion',type:'passive',glyph:'妄',name:'망상',online:true,
  desc:P=>`상대 화면에서 두 사람의 사석 수가 가려져 보이지 않습니다.`,
  det:P=>`상대 화면에서 두 사람의 사석 수가 모두 가려집니다.`,
  vals:P=>`상시`},
 {id:'king',type:'passive',glyph:'王',name:'왕귀',
  desc:P=>`사석 ${P.king.n}개를 모으면 즉시 승리합니다.`,
  det:P=>`내 사석이 ${P.king.n}개 이상이 되면 즉시 승리합니다.`,
  vals:P=>`사석 ${P.king.n}개`},
 {id:'ghost',type:'passive',glyph:'霊',name:'귀신',online:true,
  desc:P=>`상대가 착수할 때 ${Math.round(P.ghost.p*100)}% 확률로 귀신 사진이 상대 화면에 튀어나옵니다.`,
  det:P=>`상대가 착수할 때 ${Math.round(P.ghost.p*100)}% 확률로 귀신 사진이 상대 화면에 나타납니다.`,
  vals:P=>`${Math.round(P.ghost.p*100)}%`},
 {id:'chaos',type:'passive',glyph:'混',name:'혼돈',online:true,
  desc:P=>`내가 착수할 때마다 상대 화면의 판이 무작위 각도로 돌아갑니다.`,
  det:P=>`내가 착수할 때마다 상대 화면의 판이 90°·180°·270° 중 무작위로 회전합니다.`,
  vals:P=>`착수마다`},
 {id:'bolt',type:'passive',glyph:'雷',name:'청천벽력',
  desc:P=>`내가 ${P.bolt.every}수 둘 때마다 무작위 칸에 벼락이 떨어져 그 자리의 돌을 파괴합니다.`,
  det:P=>`내가 ${P.bolt.every}수 둘 때마다 무작위 칸에 벼락이 떨어집니다. 확률: 내 돌 ${Math.round(P.bolt.own*100)}% · 상대 돌 ${Math.round(P.bolt.opp*100)}% · 빈 칸 ${Math.round(P.bolt.empty*100)}%. 성벽 보호 돌은 막힙니다.`,
  vals:P=>`${P.bolt.every}수마다 · 내 ${Math.round(P.bolt.own*100)}% / 상대 ${Math.round(P.bolt.opp*100)}% / 빈칸 ${Math.round(P.bolt.empty*100)}%`},
 {id:'taunt',type:'passive',glyph:'嘲',name:'조롱',
  desc:P=>`상대가 수를 둘 때마다 상대 화면에 약 올리는 말이 큰 글씨로 뜹니다.`,
  det:P=>`상대가 착수하거나 패스할 때마다 약 올리는 문구가 상대 화면에 뜹니다. 점수와 결과에는 영향이 없습니다.`,
  vals:P=>`상시`},
 {id:'advice',type:'passive',glyph:'訓',name:'훈수',
  desc:P=>`AI가 내 수를 평가하고, 내 차례마다 ${Math.round(P.advice.hint*100)}% 확률로 최선수를 알려 줍니다.`,
  det:P=>`내 차례마다 ${Math.round(P.advice.hint*100)}% 확률로 AI의 최선수를 말풍선으로 알려 주고, 둔 수는 최선과 비교해 평가해 줍니다.`,
  vals:P=>`최선수 ${Math.round(P.advice.hint*100)}%`},
 {id:'ember',type:'active',glyph:'火',name:'불씨',
  desc:P=>`빈 칸에 불씨를 놓으면 한 수마다 불길이 번져가며 닿는 돌을 모두 태웁니다.`,
  det:P=>`지정한 3×3 구역의 빈 칸에 불씨를 최대 ${P.ember.max}개 놓습니다. 그다음 수부터 한 수마다 한 세대씩 번집니다. 꺼진 칸은 곁 8칸 중 3칸이 타오르면 타오르고, 타오르는 칸은 곁 8칸 중 2~3칸이 타오르면 계속 타오르며 그 밖에는 꺼집니다. 판 가장자리 줄은 항상 꺼집니다. 타오르는 칸에는 돌을 놓을 수 없고 그 칸의 돌은 사라지며(사석 아님), 성벽·베리어 보호 돌은 남습니다. 간파와 감상의 무심은 불꽃을 모두 지웁니다.`,
  vals:P=>`${P.uses}회 · 3×3 안 최대 ${P.ember.max}개`},
 {id:'mirror',type:'active',glyph:'響',name:'메아리',
  desc:P=>`이번에 두는 돌이 천원, 좌우, 상하로 대칭한 세 자리에도 같은 색으로 놓입니다.`,
  det:P=>`쓴 차례의 첫 착수가 천원·가로 중앙선·세로 중앙선 기준으로 대칭한 세 자리에도 놓입니다. 이미 차 있거나 불타는 칸이거나 활로가 없어지는 자리는 건너뜁니다. 대칭으로 놓인 돌이 상대 돌을 따내면 사석을 얻습니다.`,
  vals:P=>`${P.uses}회 · 대칭 3곳`},
 {id:'dispel',type:'active',glyph:'破',name:'간파',
  desc:P=>`상대의 모든 긍정적 효과와 나의 모든 부정적 효과를 제거합니다.`,
  det:P=>`상대가 건 안개, 성벽, 베리어, 입구자 예약, 소라고동, 황홀 예약·황홀돌, 환각 거짓돌, 지뢰, 병원균을 지웁니다. 나에게 걸린 실수, 망각, 눈뽕, 절망 예약·절망돌, 상대의 예측, 내 돌에 퍼진 병, 번지는 불꽃도 지웁니다. 지울 효과가 없으면 쓸 수 없습니다.`,
  vals:P=>`${P.uses}회`},
 {id:'fate',type:'active',glyph:'命',name:'예측',
  desc:P=>`상대의 다음 수를 예측합니다. 예측이 적중하면 상대의 수를 취소하고 한번 더 둡니다.`,
  det:P=>`빈 자리 하나를 비밀로 고릅니다. 상대가 다음 차례에 그 자리에 두려 하면 돌이 놓이지 않고 상대 차례가 끝나며, 내가 한 번 더 둡니다. 못 맞혀도 효과는 상대의 다음 차례 한 번으로 끝납니다.`,
  vals:P=>`${P.uses}회`},
 {id:'bomb',type:'active',glyph:'爆',name:'자폭병',
  desc:P=>`이번에 착수하는 돌이 자폭병이 됩니다. 자폭병이 잡히면 주변 ${sq(P.bomb.r)}의 돌이 모두 제거됩니다.`,
  det:P=>`쓴 차례의 첫 착수가 자폭병이 됩니다. 자폭병이 잡히면 주변 3×3의 돌이 모두 사라지며 사석으로 세지 않습니다. 성벽·얼음으로 보호 중인 돌은 남습니다.`,
  vals:P=>`${P.uses}회 · 주변 3×3`},
 {id:'wisdom',type:'passive',glyph:'知',name:'지식',
  desc:P=>`이후 증강 선택의 선택지가 ${P.wisdom.n}개로 증가합니다.`,
  det:P=>`증강 선택의 선택지가 3개가 아니라 ${P.wisdom.n}개 나옵니다.`,
  vals:P=>`선택지 ${P.wisdom.n}개`},
 {id:'tengen',type:'passive',glyph:'元',name:'천원',
  desc:P=>`판 한가운데인 천원에 돌이 있다면 계가에서 ${fmt(P.tengen.v)}점을 얻습니다.`,
  det:P=>`판 한가운데가 천원입니다. 계가할 때 그 자리에 살아 있는 내 돌이 있으면 +${fmt(P.tengen.v)}점입니다.`,
  vals:P=>`+${fmt(P.tengen.v)}점`},
 {id:'gen',type:'passive',glyph:'電',name:'발전기',online:true,
  desc:P=>`발전기의 발전도를 원하는 만큼 직접 입력해 올립니다. 한 번에 최대 ${P.gen.max}%이고, 100%가 되면 즉시 승리합니다.`,
  det:P=>`올릴 양을 직접 입력합니다. 한 번에 최대 ${P.gen.max}%이고 한 차례에 한 번만 할 수 있으며, 100%가 되면 승리합니다. 발전은 의심당할 수 있습니다. 의심: 직전의 수상한 행동이 있었다면 모두 무효가 되고 사석 ${P.doubt.gain}개를 받으며, 빗나가면 ${P.doubt.cool}수 동안 의심할 수 없습니다.`,
  vals:P=>`한 번에 최대 ${P.gen.max}%`},
 {id:'pride',type:'passive',glyph:'傲',name:'오만',
  desc:P=>`종국 점수에서 상대에게 ${fmt(P.pride.give)}점을 주는 대신 내 집 점수를 ${fmt(P.pride.mul)}배로 계산합니다.`,
  det:P=>`계가할 때 상대에게 +${fmt(P.pride.give)}점이 더해지고, 내 집 점수(황홀·절망 반영)는 ${fmt(P.pride.mul)}배가 됩니다.`,
  vals:P=>`상대 +${fmt(P.pride.give)}점 · 내 집 ×${fmt(P.pride.mul)}`},
 {id:'mine',type:'active',glyph:'埋',name:'지뢰',turn:true,online:true,
  desc:P=>`빈 칸에 지뢰를 묻습니다. 지뢰는 상대에게 보이지 않고, 상대가 그 칸에 두면 십자 5칸의 돌이 터져 사라집니다.`,
  det:P=>`빈 칸에 지뢰를 ${P.uses}개 묻습니다. 묻은 사람의 화면에만 보입니다. 상대가 그 칸에 착수하면 십자 5칸의 돌이 모두 사라지며(방금 둔 돌 포함), 사석으로 세지 않습니다. 성벽 보호 돌은 남습니다. 내가 내 지뢰 위에 두면 지뢰만 제거됩니다.`,
  vals:P=>`${P.uses}회 · 십자 5칸`},
 {id:'plague',type:'active',glyph:'疫',name:'전염병',turn:false,
  desc:P=>`이번에 두는 돌이 병원균이 됩니다. 병원균은 곁의 돌에 병을 옮기고, 병든 돌은 ${P.plague.inf}수 뒤 사라집니다.`,
  det:P=>`쓴 차례의 첫 착수가 병원균이 됩니다. 병원균과 병든 돌은 한 수가 끝날 때마다 곁 8칸의 돌에 ${Math.round(P.plague.p*100)}% 확률로 병을 옮깁니다. 병든 돌은 ${P.plague.inf}수 뒤, 병원균은 ${P.plague.src}수 뒤에 사라지며 사석으로 세지 않습니다. 성벽 보호 돌과 귤에는 옮기지 못하고, 간파로 지울 수 있습니다.`,
  vals:P=>`${P.uses}회 · 전염 ${Math.round(P.plague.p*100)}% · 병든 돌 ${P.plague.inf}수 · 병원균 ${P.plague.src}수`},
 {id:'screen',type:'passive',glyph:'幕',name:'가림막',online:true,
  desc:P=>`상대 화면에서 내 증강 목록과 증강 사용 알림이 가려집니다.`,
  det:P=>`상대 화면에서 내 증강 목록, 증강 사용 알림, 기보 속 증강 이름이 가려집니다. 결과는 판 위에서 그대로 보이고, 발전도 막대는 가려지지 않으며, 대국이 끝나면 공개됩니다.`,
  vals:P=>`상시`},
 {id:'pocky',type:'active',glyph:'棒',name:'빼빼로',turn:true,
  desc:P=>`빈 3×1칸에 3칸을 차지하는 거대한 빼빼로 돌을 놓습니다.`,
  det:P=>`귤과 같은 방식의 거대한 돌입니다. 가로 또는 세로로 놓을 수 있고, 놓은 뒤 내 돌이 잡히게 되면 놓을 수 없습니다. 알까기로 밀려나고, 저격하면 통째로 사라집니다. 3칸이 한 덩어리라 따내려면 덩어리 전체의 활로를 막아야 합니다. 강물과 해일에는 한 덩어리로 밀려나지만 판 가장자리에서는 멈춥니다.`,
  vals:P=>`${P.uses}회 · 3×1`},
 {id:'river',type:'active',glyph:'川',name:'하천',
  desc:P=>`원하는 열에 강이 흐르게 합니다. 강 위의 돌은 한 수가 지날 때마다 한 칸씩 아래로 흘러갑니다.`,
  det:P=>`고른 열에 강이 생기고, 강은 계속 흐릅니다. 강 위에 있는 돌은 한 수가 끝날 때마다 강을 따라 아래로 한 칸 이동하며, 강의 끝(맨 아래 줄)에 닿은 돌은 판 밖으로 나가지 않고 그 자리에 멈춥니다. 뒤따르는 돌도 앞의 돌에 막혀 차례로 쌓입니다. 무적인 돌과 얼어붙은 빈 칸도 강을 막아 서고, 귤과 빼빼로는 한 덩어리로 함께 이동합니다. 이동으로 활로가 없어진 돌 무리는 잡힙니다. 이미 강이 흐르는 열은 고를 수 없고, 감상의 무심이 강을 지웁니다.`,
  vals:P=>`${P.uses}회 · 열 1개`},
 {id:'tsunami',type:'active',glyph:'波',name:'해일',
  desc:P=>`판 위의 모든 돌이 아래로 한 칸씩 밀려납니다. 맨 아래 줄의 돌은 판 밖으로 쓸려 나갑니다.`,
  det:P=>`판 위의 돌이 모두 아래로 한 칸 밀려납니다. 맨 아래 줄의 돌은 판 밖으로 나가 상대의 사석이 되고, 귤과 빼빼로는 한 덩어리로 움직입니다. 무적인 돌과 얼어붙은 빈 칸은 해일을 막아 서고, 밀려나 활로가 없어진 돌 무리는 잡힙니다. 밀려날 돌이 없으면 쓸 수 없습니다.`,
  vals:P=>`${P.uses}회 · 한 칸`},
 {id:'freeze',type:'active',glyph:'氷',name:'빙결',
  desc:P=>`지정한 ${P.freeze.area}×${P.freeze.area} 구역을 얼립니다. 얼어붙은 칸에는 착수할 수 없고 얼어붙은 돌은 무적이 됩니다.`,
  det:P=>`고른 칸 가까이에 ${P.freeze.area}×${P.freeze.area} 구역을 잡아 다음 ${P.freeze.plies}수 동안 얼립니다. 가장자리를 골라도 구역은 판 안으로 밀려 들어옵니다. 얼어붙은 빈 칸에는 누구도 돌을 놓을 수 없고, 얼어붙은 돌은 성벽처럼 무적이라 따내지도, 저격·유성·벼락으로 지우지도, 알까기로 밀어내지도 못합니다. 얼음이 녹은 뒤 활로가 없으면 그때 잡힙니다. 감상의 무심이 얼음을 지웁니다.`,
  vals:P=>`${P.uses}회 · ${P.freeze.area}×${P.freeze.area} · ${P.freeze.plies}수`},
 {id:'wheel',type:'active',glyph:'輪',name:'돌려돌려 돌림판',
  desc:P=>`돌림판을 돌려 이번 차례에 착수할 수 있는 돌의 개수를 정합니다. 0수나 마이너스도 나옵니다.`,
  det:P=>`확률: 1수 58%, 2수 15%, 3수 5%, 4수 1%, 5수 0.1%, 10수 0.0001%, 0수 15%, -1수 5%, -2수 0.899%, -3수 0.0009%.<br>1수는 평소와 같고, 2수 이상이면 이번 차례에 그만큼 돌을 연달아 놓습니다. 남은 돌은 건너뛸 수 있습니다. 0수면 이번 차례에 착수하지 못하고 넘어갑니다. 마이너스는 여기에 더해 내 다음 차례를 그 수만큼 더 쉽니다. 돌림판은 차례를 쓰지 않으며 결과는 바로 적용됩니다.`,
  vals:P=>`${P.uses}회 · 최대 10수`},
 {id:'frost',type:'passive',glyph:'霜',name:'설상가상',
  desc:P=>`착수할 때마다 무작위 칸이 ${P.frost.plies}수 동안 얼어붙습니다. 얼어붙은 칸에는 착수할 수 없고 돌은 무적입니다.`,
  det:P=>`내가 돌을 놓을 때마다 무작위 칸 하나가 이후 ${P.frost.plies}수 동안 얼어붙습니다. 얼음이 생기는 칸은 내 돌 ${Math.round(P.frost.own*100)}%, 상대 돌 ${Math.round(P.frost.opp*100)}%, 빈 칸 ${Math.round(P.frost.empty*100)}%의 비율로 고릅니다. 얼어붙은 빈 칸에는 누구도 돌을 놓을 수 없고, 얼어붙은 돌은 성벽처럼 무적입니다. 얼음이 녹은 뒤 활로가 없으면 그때 잡힙니다.`,
  vals:P=>`착수마다 1칸 · ${P.frost.plies}수`},
 {id:'flood',type:'passive',glyph:'濫',name:'범람',
  desc:P=>`얻는 즉시 무작위 행과 열 ${P.flood.n}곳에 강이 흐릅니다. 강 위의 돌은 한 수마다 한 칸씩 강을 따라 흘러갑니다.`,
  det:P=>`이 증강을 얻는 순간 무작위 행과 열 중 ${P.flood.n}곳에 강이 생기고, 강은 계속 흐릅니다. 세로 강은 아래로, 가로 강은 오른쪽으로 흐르며 두 강이 겹친 칸에서는 아래로 흐릅니다. 강 위의 돌은 한 수가 끝날 때마다 한 칸 이동하고, 강의 끝에 닿은 돌은 판 밖으로 나가지 않고 그 자리에 멈춥니다. 강은 상대에게도 똑같이 적용되며, 감상의 무심이 강을 지웁니다.`,
  vals:P=>`강 ${P.flood.n}개`},
 {id:'spawn',type:'passive',glyph:'殖',name:'증식',
  desc:P=>`착수할 때마다 ${Math.round(P.spawn.p*100)}% 확률로 무작위 위치에 내 돌 하나가 소환됩니다.`,
  det:P=>`내가 돌을 놓을 때마다 ${Math.round(P.spawn.p*100)}% 확률로, 돌을 놓을 수 있는 빈 칸 중 무작위 한 곳에 내 돌이 하나 더 놓입니다. 소환된 돌이 상대 돌을 따내면 사석을 얻고, 소환된 돌도 상대에게 따내질 수 있습니다.`,
  vals:P=>`착수마다 ${Math.round(P.spawn.p*100)}%`},
 {id:'snap',type:'passive',glyph:'指',name:'핑거스냅',
  desc:P=>`얻는 즉시 판 위에 있는 모든 돌의 ${Math.round(P.snap.ratio*100)}%를 무작위로 제거합니다.`,
  det:P=>`이 증강을 얻는 순간 판 위의 돌 ${Math.round(P.snap.ratio*100)}%가 무작위로 사라집니다. 내 돌과 상대 돌을 가리지 않고, 소수점은 버리며, 사석으로 세지 않습니다. 귤과 빼빼로는 한 개로 세고 통째로 사라집니다. 무적인 돌은 사라지지 않습니다.`,
  vals:P=>`1회 · 돌의 ${Math.round(P.snap.ratio*100)}%`},
 {id:'copy',type:'passive',glyph:'複',name:'복제',
  desc:P=>`상대가 가진 모든 패시브 증강이 나에게도 적용됩니다. 앞으로 상대가 얻는 패시브도 마찬가지입니다.`,
  det:P=>`상대가 지금 가진 패시브 증강과 앞으로 얻게 될 패시브 증강의 효과가 나에게도 똑같이 적용됩니다. 얻는 순간 한 번만 일어나는 효과는 다시 일어나지 않습니다. 직업 전용 증강과 복제는 복사되지 않으며, 복제로 받은 패시브는 내 증강 칸을 차지하지 않습니다.`,
  vals:P=>`상대의 패시브 전부`},
 {id:'mage',type:'job',job:'mage',glyph:'魔',name:'마법사',
  desc:P=>`마법사로 전직합니다. 가진 증강이 모두 마법사 증강으로 바뀌고, 이후 다른 증강은 얻지 못합니다.`,
  det:P=>`가진 증강이 모두 사라지고 마법사 증강 ${classAugs('mage').length}개로 바뀝니다. 증강을 하나 이상 가져야 나오고, 상대가 마법사면 나오지 않습니다.<br>마나는 최대 ${MANA_MAX}개까지 모을 수 있고, 마법을 쓸 때마다 그 마법의 필요 마나가 1씩 늘어납니다.<br>`+classAugs('mage').map(a=>`${a.name}: ${a.desc(P)}`).join('<br>'),
  vals:P=>`전직 · 마법사 증강 ${classAugs('mage').length}개`},
 {id:'m_charge',type:'active',cls:'mage',glyph:'充',name:'마나 충전',turn:true,cost:0,
  desc:P=>`마나를 1 충전합니다. 최대 ${MANA_MAX}개까지 모을 수 있습니다.`,
  det:P=>`마나가 가득 차면 쓸 수 없습니다. 패스로 세지 않습니다.`,
  vals:P=>`마나 +1`},
 {id:'m_bolt',type:'active',cls:'mage',glyph:'雷',name:'낙뢰',turn:false,cost:MANA.bolt,
  desc:P=>`원하는 돌 하나를 제거합니다.`,
  det:P=>`마나 ${MANA.bolt}을 씁니다. 내 돌·상대 돌 모두 고를 수 있고 이어진 돌은 남습니다. 귤·빼빼로는 칸 전체가 통째로 사라지며, 무적인 돌은 고를 수 없습니다. 쓸 때마다 필요 마나가 1씩 늘어납니다.`,
  vals:P=>`마나 ${MANA.bolt} · 돌 1개`},
 {id:'m_barrier',type:'active',cls:'mage',glyph:'護',name:'베리어',turn:false,cost:MANA.barrier,
  desc:P=>`내 돌 한 덩어리를 내 차례 ${P.mage.barrier}번이 지날 때까지 무적으로 만듭니다.`,
  det:P=>`마나 ${MANA.barrier}을 씁니다. 무적인 돌은 따낼 수 없고, 제거 효과와 알까기에도 남습니다. 이미 무적인 무리에는 쓸 수 없습니다. 감상의 무심과 간파는 베리어를 지웁니다. 풀린 뒤 활로가 없으면 그때 잡힙니다. 쓸 때마다 필요 마나가 1씩 늘어납니다.`,
  vals:P=>`마나 ${MANA.barrier} · 내 차례 ${P.mage.barrier}번`},
 {id:'m_meteor',type:'active',cls:'mage',glyph:'隕',name:'메테오',turn:false,cost:MANA.meteor,
  desc:P=>`${sq(P.mage.meteor.area)} 범위를 지정하면 그 안의 무작위 ${sq(P.mage.meteor.hit)} 범위의 돌이 모두 파괴됩니다.`,
  det:P=>`마나 ${MANA.meteor}을 씁니다. 지정한 ${sq(P.mage.meteor.area)} 범위 안의 무작위 ${sq(P.mage.meteor.hit)} 범위의 돌이 모두 사라집니다. 같은 곳을 한 번 더 누르면 확정되고, 무적인 돌은 남습니다. 쓸 때마다 필요 마나가 1씩 늘어납니다.`,
  vals:P=>`마나 ${MANA.meteor} · ${sq(P.mage.meteor.area)} 중 ${sq(P.mage.meteor.hit)}`},
 {id:'m_tele',type:'active',cls:'mage',glyph:'瞬',name:'텔레포트',turn:false,cost:MANA.tele,
  desc:P=>`지정한 ${sq(P.mage.tele)} 범위 안의 돌을 모양 그대로 원하는 다른 자리로 옮깁니다.`,
  det:P=>`마나 ${MANA.tele}을 씁니다. 공간이동의 강화판입니다. 옮길 ${sq(P.mage.tele)} 범위의 중심과 옮길 자리의 중심을 차례로 고르며, 내 돌·상대 돌이 모양 그대로 옮겨집니다. 「돌리기」로 90도씩 돌릴 수 있고, 범위가 겹쳐도 됩니다. 무적인 돌과 귤·빼빼로는 제자리에 남고, 불타는 칸이나 얼어붙은 칸으로는 옮길 수 없습니다. 내 돌이 활로를 잃는 배치는 고를 수 없고, 상대 돌이 활로를 잃으면 따냅니다. 쓸 때마다 필요 마나가 1씩 늘어납니다.`,
  vals:P=>`마나 ${MANA.tele} · ${sq(P.mage.tele)} 범위`},
 {id:'fumble',type:'passive',glyph:'虛',name:'허수',
  desc:P=>`매 턴 착수마다 확률적으로 실수가 발동합니다.`,
  det:P=>`돌을 놓을 때마다 실수가 발동할 수 있습니다. 확률은 내가 돌을 놓을 때 ${Math.round(P.fumble.me*100)}%, 상대가 돌을 놓을 때 ${Math.round(P.fumble.foe*100)}%입니다. 실수가 발동하면 누른 자리가 아니라 지금 놓을 수 있는 무작위 빈 칸에 돌이 놓입니다. 이중 착수의 두 번째 돌은 첫 돌 옆의 빈 칸 중에서 정해집니다.`,
  vals:P=>`나 ${Math.round(P.fumble.me*100)}% · 상대 ${Math.round(P.fumble.foe*100)}%`},
 {id:'insane',type:'active',glyph:'狂',name:'정신착란',turn:false,
  desc:P=>`지정한 ${sq(P.insane.r)} 범위의 돌들을 모두 중립돌로 ${P.insane.plies}수간 변경합니다.`,
  det:P=>`고른 곳 가까이에 ${sq(P.insane.r)} 범위를 잡아 그 안의 돌을 내 돌·상대 돌 가리지 않고 다음 ${P.insane.plies}수 동안 중립돌로 바꿉니다. 가장자리를 골라도 범위는 판 안으로 밀려 들어옵니다. 중립돌은 그 누구의 돌도 아닌 제3의 돌입니다. 중립돌끼리만 한 무리가 되고, 활로가 막히면 누구든 따낼 수 있습니다. 시간이 지나면 원래 주인의 돌로 돌아옵니다. 무적인 돌과 귤·빼빼로는 바뀌지 않습니다. 바뀐 순간 활로를 잃은 중립돌은 사라지고, 활로를 잃은 상대 돌은 따냅니다. 내 돌이 활로를 잃는 범위는 고를 수 없습니다.`,
  vals:P=>`${P.uses}회 · ${sq(P.insane.r)} · ${P.insane.plies}수`},
 {id:'shaman',type:'job',job:'shaman',glyph:'巫',name:'주술사',
  desc:P=>`주술사로 전직합니다. 가진 증강이 모두 주술사 증강으로 바뀌고, 이후 다른 증강은 얻지 못합니다.`,
  det:P=>`가진 증강이 모두 사라지고 주술사 증강 ${classAugs('shaman').length}개로 바뀝니다. 증강을 하나 이상 가져야 나오고, 상대가 주술사면 나오지 않습니다.<br>제물은 희생으로 얻고 봉인·저주·천벌을 쓸 때 씁니다. 희생은 차례를 소모하고, 제물을 쓰는 증강은 차례를 소모하지 않습니다.<br>`+classAugs('shaman').map(a=>`${a.name}: ${a.desc(P)}`).join('<br>'),
  vals:P=>`전직 · 주술사 증강 ${classAugs('shaman').length}개`},
 {id:'z_altar',type:'passive',cls:'shaman',glyph:'壇',name:'제단',
  desc:P=>`전직 이후 무작위 빈 칸 ${P.shaman.altar}칸에 제물칸을 만듭니다. 제물칸에 놓은 내 돌은 제물돌이 됩니다.`,
  det:P=>`전직하는 순간 그때 비어 있는 칸 중 무작위 ${P.shaman.altar}칸이 제물칸이 되어 초록빛 제단으로 표시됩니다. 주술사가 제물칸에 돌을 놓으면 그 돌은 제물돌이 됩니다. 상대가 제물칸에 놓은 돌은 제물돌이 되지 않습니다. 제물돌이 제물칸 밖으로 밀려나거나 사라지면 더는 제물돌이 아닙니다.`,
  vals:P=>`제물칸 ${P.shaman.altar}칸`},
 {id:'z_sac',type:'active',cls:'shaman',glyph:'犧',name:'희생',turn:true,cost:0,
  desc:P=>`지금 제물칸 위에 있는 제물돌을 모두 희생시키고, 희생시킨 돌 수만큼 제물을 얻습니다.`,
  det:P=>`제물칸 위에 있는 내 제물돌이 모두 사라지고, 사라진 돌 하나마다 제물을 1 얻습니다. 사라진 돌은 사석으로 세지 않습니다. 제물칸은 그대로 남아 다시 쓸 수 있습니다. 무적인 돌은 희생시킬 수 없습니다. 희생을 쓰면 내 차례가 끝납니다.`,
  vals:P=>`돌 1개당 제물 +1`},
 {id:'z_seal',type:'active',cls:'shaman',glyph:'封',name:'봉인',turn:false,cost:1,
  desc:P=>`지정한 ${P.shaman.seal.area}×${P.shaman.seal.area} 구역을 봉인합니다. 봉인된 칸에는 착수할 수 없고 봉인된 돌은 잡히지 않습니다.`,
  det:P=>`제물 1을 씁니다. 고른 칸 가까이에 ${P.shaman.seal.area}×${P.shaman.seal.area} 구역을 잡아 다음 ${P.shaman.seal.plies}수 동안 봉인합니다. 가장자리를 골라도 구역은 판 안으로 밀려 들어옵니다. 봉인된 빈 칸에는 누구도 돌을 놓을 수 없고, 봉인된 돌은 성벽처럼 무적이 됩니다.`,
  vals:P=>`제물 1 · ${P.shaman.seal.area}×${P.shaman.seal.area} · ${P.shaman.seal.plies}수`},
 {id:'z_curse',type:'active',cls:'shaman',glyph:'呪',name:'저주',turn:false,cost:1,
  desc:P=>`상대의 돌 한 무리를 영구히 절망돌로 바꿉니다.`,
  det:P=>`제물 1을 씁니다. 고른 상대 돌과 이어진 한 무리가 영구히 절망돌이 됩니다. 절망돌로 만든 집은 점수가 ${P.sp.despair}배가 됩니다. 이미 표식이 붙은 돌과 귤·빼빼로는 바뀌지 않고, 저주는 돌이 따내어지거나 사라질 때까지 풀리지 않습니다.`,
  vals:P=>`제물 1 · 돌 한 무리 · 영구`},
 {id:'z_smite',type:'active',cls:'shaman',glyph:'罰',name:'천벌',turn:false,cost:2,
  desc:P=>`원하는 ${P.shaman.smite.area}×${P.shaman.smite.area} 지점에 거대한 번개가 내려옵니다.`,
  det:P=>`제물 2를 씁니다. 고른 칸을 왼쪽 위로 하는 ${P.shaman.smite.area}×${P.shaman.smite.area} 칸에 초록빛 번개가 내려 그 안의 돌(내 돌·상대 돌 모두)을 모두 없앱니다. 가장자리를 골라도 범위는 판 안으로 밀려 들어옵니다. 귤·빼빼로는 칸 전체가 통째로 사라지고, 무적인 돌은 남습니다. 사라진 돌은 사석으로 세지 않습니다.`,
  vals:P=>`제물 2 · ${P.shaman.smite.area}×${P.shaman.smite.area}`},
 {id:'clown',type:'job',job:'clown',glyph:'丑',name:'광대',
  desc:P=>`광대로 전직합니다. 가진 증강이 모두 광대 증강으로 바뀌고, 이후 다른 증강은 얻지 못합니다.`,
  det:P=>`가진 증강이 모두 사라지고 광대 증강 ${classAugs('clown').length}개로 바뀝니다. 증강을 하나 이상 가져야 나오고, 상대가 광대면 나오지 않습니다.<br>카드는 농락에서 상대가 컵을 빗나가게 골랐을 때 얻으며 최대 ${P.clown.madMax}개까지 모을 수 있습니다. 카드를 쓰는 증강은 차례를 소모하지 않습니다.<br>`+classAugs('clown').map(a=>`${a.name}: ${a.desc(P)}`).join('<br>'),
  vals:P=>`전직 · 광대 증강 ${classAugs('clown').length}개`},

/* 전직 계열: 직업 카드(type 'job')와 그 직업 전용 증강(cls). 직업 전용 증강은 일반 선택지에 나오지 않는다 */
function classAugs(job){return AUGS.filter(a=>a.cls===job)}
const baseAugs=()=>AUGS.filter(a=>!a.cls&&a.type!=='job');
/* 도감·체험의 종류 구분: passive · active · job(전직 카드와 직업 전용 증강) */
const augKind=a=>(a.cls||a.type==='job')?'job':a.type;
const MAX_AUGS=5;
const AUG=Object.fromEntries(AUGS.map(a=>[a.id,a]));
const augAllowed=(a,n,online)=>(!a.sizes||a.sizes.includes(n))&&(!a.online||online);
/* ---- 가나다순 정렬 ----
   한글 음절은 유니코드에서 초성→중성→종성 순으로 이미 늘어서 있어 코드 값 비교가 곧 가나다순이다(ㄲ은 ㄱ 다음, ㅆ은 ㅅ 다음).
   숫자·영문은 한글보다 앞에 온다. 도감·증강 체험은 목록을 그릴 때마다 이름으로 다시 정렬하므로,
   증강이 새로 추가돼도 목록 순서를 따로 손볼 곳이 없다(AUGS 배열 자체의 순서는 건드리지 않는다). */
const nameKey=s=>String(s==null?'':s).replace(/\s+/g,'');
const nameCmp=(x,y)=>{const a=nameKey(x),b=nameKey(y);return a<b?-1:a>b?1:0};
const augsByName=list=>(list||AUGS).slice().sort((p,q)=>nameCmp(p.name,q.name)||(p.id<q.id?-1:p.id>q.id?1:0));
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const choOf=ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch};
const choseong=s=>Array.from(String(s==null?'':s)).map(choOf).join('');
/* 목록 머리글자: 쌍자음(ㄲ·ㄸ·ㅃ·ㅆ·ㅉ)은 짝 자음에 묶고, 한글이 아니면 '#' */
const CHOBASE={'ㄲ':'ㄱ','ㄸ':'ㄷ','ㅃ':'ㅂ','ㅆ':'ㅅ','ㅉ':'ㅈ'};
const initialOf=name=>{const c=choOf(nameKey(name).charAt(0));return CHOBASE[c]||(/^[ㄱ-ㅎ]$/.test(c)?c:'#')};
/* 확률로 발동하는 증강. 증강 체험의 「확률 100%」가 적용되며, 판정에는 반드시 chance()를 쓴다.
   (새 증강이 확률로 발동한다면 여기에 id를 더하고 Math.random() 대신 chance(p)를 쓰면 체험에서도 100%로 맞춰진다) */
const PROB_IDS=['luck','misery','ghost','slip','bolt','advice','conch','plague','spawn','fumble'];
const isProb=a=>!!a&&PROB_IDS.includes(a.id);
/* 전직 카드가 선택지에 끼어드는 확률(증강을 하나 이상 가졌을 때) */
const JOB_P=0.3;
/* 패시브 1 + 액티브 1 + 나머지 중 1. 내가 가졌거나 상대가 가진 증강은 나오지 않는다.
   전직 카드는 증강을 이미 가진 사람에게 일정 확률로 마지막 선택지 자리를 대신해 나오며, 상대가 같은 직업이면 나오지 않는다. */
function genOffers(owned,n,online,opp,wis){
  if(owned.length>=MAX_AUGS||owned.some(id=>AUG[id]&&AUG[id].cls))return [];   /* 가득 찼거나 이미 전직했다 */
  opp=opp||[];
  const pool=AUGS.filter(a=>!a.cls&&a.type!=='job'&&!owned.includes(a.id)&&!opp.includes(a.id)&&augAllowed(a,n,online));
  const pas=shuffle(pool.filter(a=>a.type==='passive')),act=shuffle(pool.filter(a=>a.type==='active'));
  const out=[];
  if(pas.length)out.push(pas[0]);
  if(act.length)out.push(act[0]);
  const rest=shuffle(pool.filter(a=>!out.includes(a)));
  const want=(owned.includes('wisdom')||wis)?(PR(n).wisdom.n):3;
  while(out.length<want&&rest.length)out.push(rest.shift());
  const jobs=owned.length>=1?AUGS.filter(a=>a.type==='job'&&augAllowed(a,n,online)&&!opp.some(id=>AUG[id]&&AUG[id].cls===a.job)):[];
  if(jobs.length&&Math.random()<JOB_P){
    const j=jobs[rnd(jobs.length)];
    if(out.length>=want&&out.length>=3)out[out.length-1]=j;else out.push(j);
  }
  return shuffle(out).map(a=>a.id);
}

/* 추천 AI는 2색 바둑만 읽는다. 3·4인에서는 나(pc)와 나머지 전부를 두 편으로 보고 계산한다 */
const recColor=(st,p)=>NP(st)>2?1:p;
function recBase(st,p){
  const pc=recColor(st,p);let b=(NET?seenBoard(st,p):st.board).slice();
  if(NP(st)>2)b=b.map(v=>v===0?0:(v===p?pc:3-pc));
  return{n:st.n,board:b,turn:pc,shield:{},ply:0,ko:st.ko,extra:null,fire:st.fire||[],ice:(st.ice||[]).filter(e=>e.exp>st.ply).map(e=>({pt:e.pt,exp:1}))};
}
function recCands(base,p){
  const n=base.n,N=n*n,b=base.board,near=new Int8Array(N);let stones=0;
  for(let i=0;i<N;i++)if(b[i]){stones++;for(let j=0;j<N;j++)if(cheb(n,i,j)<=2)near[j]=1}
  const out=[];
  for(let i=0;i<N;i++){
    if(b[i]!==0||base.ko===i)continue;
    const r=simulate(base,i,p);if(!r.ok)continue;
    if(trueEye(b,n,i,p,nb(n,i)))continue;
    const x=i%n,y=(i/n)|0,line=Math.min(x,y,n-1-x,n-1-y);
    let h=Math.random()*0.5;
    if(r.captured.length)h+=10+r.captured.length;
    if(r.own.libs.length<=1)h-=8;
    if(near[i])h+=3;
    if(stones<n)h+=(line===2||line===3)?3:0;
    if(line===0)h-=3;
    out.push({idx:i,h,r});
  }
  return out.sort((a,b2)=>b2.h-a.h);
}
function scoreCand(base,c,p,K){
  const st2={n:base.n,board:c.r.board,turn:3-p,shield:{},ply:0};
  const est=makeEstimator(st2,K);est.run(K);
  return p===1?est.area():-est.area();
}
const recParams=n=>n<=9?{M:18,K:40}:n<=13?{M:22,K:28}:{M:26,K:20};
/* 거짓 수: 최선수에서 1~2칸 떨어진 합법 자리 중 AI 평가가 가장 나쁜 곳 */
function worstNear(base,best,p,res,K){
  const n=base.n,cands=[];
  for(let i=0;i<n*n;i++){
    const d=cheb(n,i,best);
    if(d<1||d>2||base.board[i]!==0||base.ko===i)continue;
    const r=simulate(base,i,p);if(!r.ok)continue;
    cands.push({idx:i,r});
  }
  if(!cands.length)return legalNeighbor(base,best,p);
  let worst=null;
  for(const c of cands){
    const known=res.find(x=>x.idx===c.idx),sc=known?known.score:scoreCand(base,c,p,K);
    if(!worst||sc<worst.sc)worst={idx:c.idx,sc};
  }
  return worst.idx;
}
function legalNeighbor(base,i,p){
  const n=base.n,x=i%n,y=(i/n)|0,four=nb(n,i),diag=[];
  for(const [dx,dy] of [[1,1],[1,-1],[-1,1],[-1,-1]]){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<n&&Y<n)diag.push(Y*n+X)}
  for(const grp of [four,diag]){
    const ok=shuffle(grp).filter(k=>base.board[k]===0&&base.ko!==k&&simulate(base,k,p).ok);
    if(ok.length)return ok[0];
  }
  return i;
}

  /* 후보 하나의 모의 대국도 잘게 나눠 돌려서, 계산 중에도 화면이 끊기지 않게 한다 */
  const step=()=>{
    if(!UI.rec||UI.rec.key!==key||UI.rec!==mine)return;   /* 같은 키로 다시 시작됐거나 끝났으면 옛 계산은 멈춘다 */
    const t0=Date.now();
    while(Date.now()-t0<22){
      if(!est){
        if(i>=cands.length)break;
        cur=cands[i++];est=makeEstimator({n:base.n,board:cur.r.board,turn:3-pc,shield:{},ply:0},K);

/* 턴 처리 */
/* 활로가 없는 무리를 잡는다. spare 를 주면 바둑 규칙처럼 그 색(방금 둔 쪽)의 무리는 상대 무리를 먼저 잡은 뒤에 따진다.
   (강물로 서로의 활로를 막아 양쪽 다 활로가 없을 때, 둔 쪽이 먼저 살아남게 하려는 것. 안 주면 판 위치 순서) */
function sweep(spare){
  const st=G.st;let n=0;
  const pass=only=>{
    const seen=new Set();
    for(let i=0;i<st.n*st.n;i++){
      const c=st.board[i];if(!c||seen.has(i)||!only(c))continue;
      const g=groupOf(st,st.board,i);g.stones.forEach(k=>seen.add(k));
      if(g.libs.length===0&&!isProtected(st,g)){
        const cr=c===NEUTC?0:creditTo(st,c,g.stones);   /* 중립돌은 누구의 몫도 아니다 */
        g.stones.forEach(k=>{st.board[k]=0;delete st.shield[k]});
        if(cr)st.prisoners[cr]+=g.stones.length;
        n+=g.stones.length;madGainC(st,c,g.stones.length,g.stones[0]);bombBoom(st,g.stones);
      }
    }
  };
  if(spare){pass(c=>c!==spare);pass(c=>c===spare)}else pass(()=>true);
  return n;
}
function fireIpgu(t){
  const st=G.st,n=st.n,p=t.owner;
  if(st.board[t.target]!==p)return '입구자: 지정한 돌이 사라져 취소되었습니다. ';
  const cx=t.target%n,cy=(t.target/n)|0,mid=(n-1)/2;
  let best=null;
  for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
    const px=-dy,py=dx;
    const pts=[[cx+dx+px,cy+dy+py],[cx+dx-px,cy+dy-py]].filter(([x,y])=>x>=0&&y>=0&&x<n&&y<n).map(([x,y])=>y*n+x).filter(i=>st.board[i]===0);
    if(!pts.length)continue;
    const score=pts.length*100-(Math.abs(cx+dx-mid)+Math.abs(cy+dy-mid));
    if(!best||score>best.score)best={pts,score};
  }
  if(!best)return '입구자: 놓을 수 있는 자리가 없어 취소되었습니다. ';
  let placed=0;
  for(const i of best.pts){
    const r=simulate(st,i,p);if(!r.ok)continue;
    madGain(st,st.board,r.captured);st.board=r.board;st.prisoners[p]+=r.captured.length;r.captured.forEach(k=>{delete st.shield[k]});bombBoom(st,r.captured);st.last=i;placed++;
  }
  st.ko=null;cleanSp(st);
  if(placed)castFx(st,'ipgu',p,best.pts.filter(i=>st.board[i]===p),{fire:true,quiet:false});
  return placed?'입구자로 돌 '+placed+'개가 놓였습니다. ':'입구자: 둘 수 있는 자리가 없어 취소되었습니다. ';
}
function checkWin(mover){

  if(w.length){

  if(kw.length){
    st.over=true;st.result={king:true,winner:kw.includes(mover)?mover:kw[0]};

function endTurn(msg){

  st.bombArm=null;st.echoArm=null;st.plagueArm=null;st.fate=(st.fate||[]).filter(f=>f.target!==mover);
  st.fog=st.fog.filter(f=>{if(f.owner===mover)f.left--;return f.left>0});
  st.conch=(st.conch||[]).filter(c=>{if(c.owner===mover)c.left--;return c.left>0});
  st.glare=(st.glare||[]).filter(c=>{if(c.owner!==mover)c.left--;return c.left>0});
  const fire=[];
  st.timers=st.timers.filter(t=>{if(t.owner===mover){t.left--;if(t.left<=0){fire.push(t);return false}}return true});
  fire.forEach(t=>{msg+=fireIpgu(t)});

  msg+=tick7(st,mover);   /* 기한이 된 중립돌·조커·공중곡예·저주를 푼다 */

  UI.mode=null;UI.sel=null;UI.flick=null;

  if(st.skip&&st.skip[st.turn]>0&&!st.over&&actOf(st).length>1){
    const q=st.turn;st.skip[q]--;lg(st,'휴식');UI.ctx={kind:'rest'};
    return endTurn(msg+NAME[q]+'은(는) 돌림판의 벌로 이번 차례를 쉽니다. ');

}

function startRead(){
  const st=G.st,id=(st.readId=(st.readId||0)+1);st.dead=[];st.unc=[];
  if(NP(st)>2){st.reading=false;return commit((st.readWhy||'')+'3·4인 대국은 판세를 자동으로 읽지 않습니다. 죽은 돌을 눌러 표시한 뒤 모두 계가를 확정하세요. 기권한 사람의 돌은 자동으로 사석 처리됩니다.')}
  st.reading=true;
  let total=st.n<=9?800:st.n<=13?500:320,step=st.n<=9?50:st.n<=13?25:10,extended=false;
  const est=makeEstimator(st,total),why=st.readWhy||'';
  if(NET&&NET.live)pushState();
  const tick=()=>{
    if(!G||G.st!==st||st.readId!==id||st.phase!=='dead')return;
    est.run(step);
    if(!est.finished()){UI.msg=why+'판세를 읽는 중… '+Math.round(est.progress()*100)+'%';UI.err=false;render();setTimeout(tick,0);return}
    let r=est.result();
    /* 확신이 낮은 그룹이 남아 있으면 모의 대국을 절반만큼 더 돌려 다시 판정한다 */
    if(!extended&&r.unc.length){extended=true;est.more(Math.round(total*0.5));setTimeout(tick,0);return}st.dead=r.dead;st.unc=r.unc;st.reading=false;st.confirm=per(()=>false);
    const d1=r.dead.filter(i=>st.board[i]===1).length;
    commit(why+(r.dead.length?'판세를 읽어 죽은 돌 '+r.dead.length+'개(흑 '+d1+' · 백 '+(r.dead.length-d1)+')를 표시했습니다. ':'판세를 읽었고 죽은 돌은 없습니다. ')+'틀린 곳은 돌을 눌러 고친 뒤 계가를 확정하세요.');
  };
  tick();
}

function doResign(me){
  const st=G.st,multi=NP(st)>2;

function cleanSp(st){

function fireBolt(st,p){

  if(sureOn()&&opp.length)pick=opp;   /* 체험 「확률 100%」: 벼락은 언제나 상대 돌에 떨어진다 */

/* ===== 신규 증강 로직 2 (불씨·메아리·간파·예측·자폭병·지식·천원·발전기·오만) ===== */

/* ---- 불씨: 생명 게임 규칙(꺼진 칸은 이웃 3칸이 타오르면 타오르고, 타오르는 칸은 이웃 2~3칸이면 유지) ---- */
function lifeNext(n,cells){
  const alive=new Set(cells),cnt=new Map();
  cells.forEach(c=>{
    const x=c%n,y=(c/n)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=n||Y>=n)continue;
      const k=Y*n+X;cnt.set(k,(cnt.get(k)||0)+1);
    }
  });
  const out=[];
  cnt.forEach((v,k)=>{
    const x=k%n,y=(k/n)|0;
    if(x===0||y===0||x===n-1||y===n-1)return;   /* 1선에 닿은 불꽃은 꺼진다 */
    if(alive.has(k)?(v===2||v===3):v===3)out.push(k);
  });
  return out.sort((a,b)=>a-b);
}
/* 불타는 칸 위의 돌을 모두 파괴한다. 성벽으로 보호된 돌은 무사하다 */
function burnSweep(st){
  const fire=st.fire;if(!fire||!fire.length)return 0;
  const fs=new Set(fire),inv=invSet(st);
  const hit=fire.filter(k=>st.board[k]&&!inv.has(k));
  let gone=[];
  if(hit.length){gone=removeStones(st,hit);st.ko=null}
  let fk=0;(st.fake||[]).forEach(f=>{const keep=f.pts.filter(i=>!fs.has(i));fk+=f.pts.length-keep.length;f.pts=keep});
  const tot=gone.length+fk;
  if(tot){
    fxAdd(st,{kind:'cast',id:'burn',p:st.turn,pts:gone.slice(0,40),quiet:true,k:tot});
    lg(st,'불씨 '+tot+'개');
    st.boomTxt=(st.boomTxt||'')+'불씨가 돌 '+tot+'개를 태웠습니다. ';
  }
  return tot;
}
/* 차례가 끝날 때마다 한 세대씩. 불씨를 놓은 그 차례에는 모양이 그대로다 */
function emberTick(st){
  if(!st.fire||!st.fire.length){st.fireSkip=false;return ''}
  if(st.fireSkip)st.fireSkip=false;
  else st.fire=lifeNext(st.n,st.fire);
  burnSweep(st);
  return st.fire.length?'':'불씨가 모두 꺼졌습니다. ';
}
function emberAvail(st,center,p){
  const n=st.n,x=center%n,y=(center/n)|0,out=[];
  if(x<1||y<1||x>n-2||y>n-2)return out;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const i=(y+dy)*n+x+dx;
    if(st.board[i]===0&&!(st.fire||[]).includes(i)&&!fkAt(st,p,i))out.push(i);
  }
  return out;
}

/* ---- 자폭병: 잡히면 주변 3×3의 돌을 모두 제거한다. 따내기로 사라진 돌 목록을 받아 처리 ---- */
function bombBoom(st,caps){
  if(!caps||!caps.length||!st.sp)return 0;
  const bs=caps.filter(k=>st.sp[k]==='b');
  if(!bs.length)return 0;
  const n=st.n,R=st.P.bomb.r,kill=new Set();
  bs.forEach(k=>{delete st.sp[k]});
  const inv=invSet(st);
  let fk=0;
  bs.forEach(k=>{
    for(let i=0;i<n*n;i++){
      if(cheb(n,i,k)>R)continue;
      if(st.board[i]&&!inv.has(i))kill.add(i);
    }
    (st.fake||[]).forEach(f=>{const keep=f.pts.filter(i=>cheb(n,i,k)>R);fk+=f.pts.length-keep.length;f.pts=keep});
  });
  const gone=kill.size?removeStones(st,[...kill]):[];
  st.ko=null;
  fxAdd(st,{kind:'cast',id:'bomb',p:st.turn,pts:bs.slice(),quiet:true,k:gone.length+fk,boom:1});
  lg(st,'자폭병 폭발 '+(gone.length+fk)+'개');
  st.boomTxt=(st.boomTxt||'')+'자폭병이 터졌습니다! 주변 돌 '+(gone.length+fk)+'개가 사라졌습니다. ';
  return gone.length+fk;
}

/* ---- 메아리: 이번에 둔 돌을 천원·좌우·상하로 대칭한 자리에도 놓는다 ---- */
function echoDo(st,idx,p){
  const n=st.n,x=idx%n,y=(idx/n)|0;
  const cand=[(n-1-y)*n+(n-1-x),y*n+(n-1-x),(n-1-y)*n+x];
  const seen=new Set([idx]),placed=[];let cap=0;
  for(const i of cand){
    if(seen.has(i))continue;seen.add(i);
    if(st.board[i]!==0)continue;
    const r=simulate(st,i,p);if(!r.ok)continue;
    madGain(st,st.board,r.captured);st.board=r.board;st.prisoners[p]+=r.captured.length;r.captured.forEach(k=>{delete st.shield[k]});
    cap+=r.captured.length;
    if(r.captured.length){fxAdd(st,{kind:'cap',p,pts:r.captured.slice()});bombBoom(st,r.captured)}
    placed.push(i);
  }
  if(placed.length)st.ko=null;
  castFx(st,'mirror',p,[idx].concat(placed));
  lg(st,'메아리 +'+placed.length);
  return{placed,cap};
}

/* ---- 간파: 상대의 긍정적 효과와 나의 부정적 효과를 지운다 ---- */
function dispelPlan(st,p){
  const O=new Set(othersOf(st,p)),n=st.n;
  const wallStones=Object.keys(st.shield).map(Number).filter(k=>st.shield[k]>st.ply&&O.has(st.board[k]));
  const walls=wallStones.length?countGroups(st,wallStones):0;
  const fog=(st.fog||[]).filter(f=>O.has(f.owner)).length;
  const ipgu=(st.timers||[]).filter(t=>O.has(t.owner)).length;
  const conch=(st.conch||[]).filter(c=>O.has(c.owner)).length;
  const joyPend=(st.pend||[]).filter(q=>O.has(q.target)&&q.k==='j').length;
  const slip=(st.slip||[]).filter(s=>s.target===p).length;
  const forget=(st.forget||[]).filter(f=>f.target===p).length;
  const glare=(st.glare||[]).filter(g=>O.has(g.owner)).length;
  const desPend=(st.pend||[]).filter(q=>q.target===p&&q.k==='d').length;
  const fate=(st.fate||[]).filter(f=>f.target===p).length;
  const joyStones=Object.keys(st.sp||{}).map(Number).filter(k=>st.sp[k]==='j'&&O.has(st.board[k]));
  const desStones=Object.keys(st.sp||{}).map(Number).filter(k=>st.sp[k]==='d'&&st.board[k]===p);
  const fakes=(st.fake||[]).filter(f=>O.has(f.owner)).reduce((s,f)=>s+f.pts.length,0);
  const mines=(st.mines||[]).filter(m=>O.has(m.by)).length;
  const fire=(st.fire&&st.fire.length)?1:0;   /* 불씨의 불꽃은 누가 놓았든 지운다 */
  const sickKeys=Object.keys(st.sick||{}).map(Number).filter(k=>st.board[k]&&(st.board[k]===p||(O.has(st.sick[k].by)&&st.sick[k].k==='p')));
  return{walls,fog,ipgu,conch,joyPend,slip,forget,glare,desPend,fate,joyStones,desStones,fakes,mines,sickKeys,fire,
    total:fire+walls+fog+ipgu+conch+joyPend+slip+forget+glare+desPend+fate+joyStones.length+desStones.length+fakes+mines+sickKeys.length};
}
function dispelDo(st,p){
  const O=new Set(othersOf(st,p)),pl=dispelPlan(st,p);
  if(pl.total<1)return null;
  Object.keys(st.shield).forEach(k=>{if(O.has(st.board[+k]))delete st.shield[k]});
  st.fog=(st.fog||[]).filter(f=>!O.has(f.owner));
  st.timers=(st.timers||[]).filter(t=>!O.has(t.owner));
  st.conch=(st.conch||[]).filter(c=>!O.has(c.owner));
  st.pend=(st.pend||[]).filter(q=>!((O.has(q.target)&&q.k==='j')||(q.target===p&&q.k==='d')));
  st.slip=(st.slip||[]).filter(s=>s.target!==p);
  st.forget=(st.forget||[]).filter(f=>f.target!==p);
  st.glare=(st.glare||[]).filter(g=>!O.has(g.owner));
  st.fate=(st.fate||[]).filter(f=>f.target!==p);
  st.bombArm=O.has(st.bombArm)?null:st.bombArm;st.echoArm=O.has(st.echoArm)?null:st.echoArm;
  st.fake=(st.fake||[]).filter(f=>!O.has(f.owner));
  st.mines=(st.mines||[]).filter(m=>!O.has(m.by));
  st.fire=[];st.fireSkip=false;
  pl.sickKeys.forEach(k=>{delete st.sick[k]});
  st.plagueArm=O.has(st.plagueArm)?null:st.plagueArm;
  const inv=invSet(st);
  const sp=pl.joyStones.concat(pl.desStones).filter(k=>st.board[k]&&!inv.has(k));
  const gone=sp.length?removeStones(st,sp):[];
  st.ko=null;
  const sw=sweep();   /* 성벽·베리어가 풀려 활로가 없어진 돌은 이 자리에서 잡힌다 */
  return{pl,stones:gone.length,swept:sw};
}

const screenOn=(st,p,viewer)=>!!(NET&&st&&!st.over&&hasAug(st,p,'screen')&&viewer!==p);
/* 기보 문구에서 증강 이름을 뺀 것: 자리 이름과 패스·기권만 남긴다 */
function maskLogText(t){
  const keep=String(t||'').split(' · ').filter(x=>/^[A-HJ-T]\d{1,2}$/.test(x)||x==='패스'||x==='기권');
  return keep.join(' · ')||'—';

/* ---- 지뢰 ---- */
const mineAt=(st,i)=>(st.mines||[]).find(m=>m.pt===i);
/* 지뢰가 묻힌 칸에 상대가 착수했다: 그 칸 십자 5칸의 돌이 모두 사라진다(성벽 보호 돌은 무사) */
function mineBoom(st,idx,p){
  const bx=boxBoom(st,idx,p);   /* 광대의 깜짝상자도 같은 자리에서 터진다 */
  const all=(st.mines||[]).filter(m=>m.pt===idx);
  if(!all.length)return bx;
  const hit=all.filter(m=>m.by!==p);
  st.mines=(st.mines||[]).filter(m=>m.pt!==idx);   /* 내 지뢰 위에 내가 두면 조용히 사라진다 */
  if(!hit.length)return 0;
  const n=st.n,cells=crossCells(n,idx).map(c=>c[2]),inv=invSet(st);
  const kill=cells.filter(i=>st.board[i]&&!inv.has(i));
  const gone=kill.length?removeStones(st,kill):[];
  const cs=new Set(cells);let fk=0;
  (st.fake||[]).forEach(f=>{const keep=f.pts.filter(i=>!cs.has(i));fk+=f.pts.length-keep.length;f.pts=keep});
  st.ko=null;
  fxAdd(st,{kind:'cast',id:'mine',p:hit[0].by,pts:[idx],quiet:true,boom:1,cells,k:gone.length});
  lg(st,'지뢰 폭발 '+cnm(st,idx));
  st.boomTxt=(st.boomTxt||'')+'지뢰가 터졌습니다! '+cnm(st,idx)+' 십자 범위의 돌 '+gone.length+'개가 사라졌습니다. ';
  return gone.length+bx;
}

/* ---- 전염병 ---- */
function nb8(n,i){
  const x=i%n,y=(i/n)|0,o=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;const X=x+dx,Y=y+dy;
    if(X>=0&&Y>=0&&X<n&&Y<n)o.push(Y*n+X);
  }
  return o;
}
function plagueSeed(st,idx,p){
  (st.sick=st.sick||{})[idx]={k:'p',left:st.P.plague.src,by:p,fresh:1};
  st.plagueArm=null;
  fxAdd(st,{kind:'float',p,pts:[idx],txt:'병원균!'});
}
/* 돌이 자리를 옮기면 병도 따라간다 */
function remapSick(st,map){
  if(!st.sick)return;
  const nx={};
  Object.keys(st.sick).forEach(k=>{const t=map[k]!=null?map[k]:+k;nx[t]=st.sick[k]});
  st.sick=nx;
}
function moveSick(st,a,b){if(st.sick&&st.sick[a]){st.sick[b]=st.sick[a];delete st.sick[a]}}
/* 한 수가 끝날 때마다: 병든 돌의 남은 수를 줄이고, 병을 옮긴다. 새로 병든 돌은 이번 수에는 움직이지 않는다 */
function plagueTick(st){
  const sick=st.sick;if(!sick)return '';
  Object.keys(sick).forEach(k=>{if(!st.board[k])delete sick[k]});
  const keys=Object.keys(sick).map(Number);if(!keys.length)return '';
  const P=st.P.plague,inv=invSet(st),carriers=[],died=[];
  keys.forEach(k=>{
    const e=sick[k];
    if(inv.has(k))return;                      /* 성벽 보호 중에는 멈춘다 */
    if(e.fresh){delete e.fresh;carriers.push(k);return}
    e.left--;
    if(e.left<=0){died.push(k);return}
    carriers.push(k);
  });
  const newly=[];
  carriers.forEach(k=>{
    nb8(st.n,k).forEach(m=>{
      if(!st.board[m]||sick[m]||inv.has(m)||tangAt(st,m))return;
      if(chance(P.p)){sick[m]={k:'i',left:P.inf,by:sick[k].by};newly.push(m)}
    });
  });
  let msg='';
  if(newly.length){
    fxAdd(st,{kind:'cast',id:'plague',p:sick[newly[0]].by,pts:newly.slice(0,40),quiet:true,inf:1});
    lg(st,'감염 '+newly.length);msg+='병이 번져 돌 '+newly.length+'개가 병들었습니다. ';
  }
  if(died.length){
    const by=sick[died[0]].by;
    const gone=removeStones(st,died);
    died.concat(gone).forEach(k=>{delete sick[k]});
    fxAdd(st,{kind:'cast',id:'plague',p:by,pts:gone.slice(0,40),quiet:true,die:1,k:gone.length});
    lg(st,'병사 '+gone.length);msg+='병든 돌 '+gone.length+'개가 사라졌습니다. ';
    st.ko=null;
  }
  return msg;
}

/* ===== 전직(직업)과 마법사 =====
   전직 카드를 고르면 가진 증강이 모두 그 직업의 전용 증강으로 바뀌고, 이후 다른 증강은 얻지 못한다.
   마법사는 마나를 모아 마법을 쓴다. 마나 충전만 차례를 소모하고, 나머지 마법은 마나를 정해진 만큼 쓰며 차례를 소모하지 않는다. */
const isClassAug=id=>!!(AUG[id]&&AUG[id].cls);
const jobOf=(st,p)=>(st&&st.job&&st.job[p])||null;
const manaOf=(st,p)=>(st&&st.mana&&st.mana[p])||0;
/* 증강 체험에서는 마나가 줄지 않는다(증강 사용 횟수가 줄지 않는 것과 같다) */
const manaFree=()=>!!(NET&&NET.lab);
const MANA_MAX=10;   /* 모을 수 있는 마나의 최대치 */
/* 같은 마법을 쓸 때마다 그 마법의 필요 마나가 1씩 늘어난다(마법사 개인별) */
const mUsed=(st,p,id)=>(st&&st.mUse&&st.mUse[p]&&st.mUse[p][id])||0;
const manaCost=(id,st,p)=>{const b=(AUG[id]&&AUG[id].cost)||0;return b?b+((st&&AUG[id].cls==='mage')?mUsed(st,p,id):0):0};   /* 같은 마법을 쓸수록 비싸지는 것은 마법사만 */
const manaOk=(st,p,id)=>manaFree()||resHave(st,p,(AUG[id]&&AUG[id].cls)||'mage')>=manaCost(id,st,p);
const manaFull=(st,p)=>!manaFree()&&manaOf(st,p)>=MANA_MAX;
function payMana(st,p,id){
  const cls=(AUG[id]&&AUG[id].cls)||'mage',k=RESKEY[cls];   /* 마나 · 제물 · 광기 */
  if(!manaFree()&&st[k]){
    st[k][p]=resHave(st,p,cls)-manaCost(id,st,p);
    st.mUse=st.mUse||per(()=>({}));st.mUse[p]=st.mUse[p]||{};st.mUse[p][id]=mUsed(st,p,id)+1;
  }
  st.passes=0;
}
/* 성벽·베리어가 풀리는 때: 내 차례가 turns번 지난 뒤(차례에 드는 사람 수만큼 곱한다. 2인이면 2*turns+1) */
const wallExpiry=(st,turns)=>st.ply+actOf(st).length*turns+1;
/* 베리어가 걸린 돌 (성벽과 같은 무적이지만 모양이 다르다) */
const barAt=(st,i)=>!!(st.bar&&st.bar[i])&&protAt(st,i);

/* ---- 전직: 가진 증강을 모두 직업 전용 증강으로 바꾼다 ---- */
function grantJob(st,p,id){
  const job=AUG[id].job;
  st.job=st.job||per(()=>null);st.mana=st.mana||per(()=>0);st.bar=st.bar||{};
  st.augs[p]=classAugs(job).map(a=>a.id);st.left[p]={};
  st.job[p]=job;st.mana[p]=0;st.mUse=st.mUse||per(()=>({}));st.mUse[p]={};
  job7Reset(st,p,job);   /* 제물 · 광기를 비우고, 주술사면 제물칸을 만든다 */
  /* 이전 증강에 딸려 있던 개인 상태를 비운다 */
  if(st.gen)st.gen[p]=0;
  if(st.genAdd)st.genAdd[p]=0;
  if(st.bolt)st.bolt[p]=0;
  if(st.turnStart)st.turnStart[p]=null;
  if(st.prevStart)st.prevStart[p]=null;
  castFx(st,id,p,[],job==='shaman'?{job,al:(st.altar||[]).slice()}:{job});
}
const jobWarn=(st,p)=>'전직하면 지금 가진 증강 '+st.augs[p].length+'개가 모두 사라지고, 이후 다른 증강은 얻을 수 없습니다.';

/* 효과 화면에서 사라지는 돌을 맞는 순간까지 보여 주기 위한 기록(제거하기 전에 만든다): [칸, 색, 특수돌 표식, [병 종류, 남은 수], 귤이면 1] */
function ghostList(st,cells,b0){
  const out=[],seen=new Set();
  cells.forEach(i=>{
    if(seen.has(i))return;
    const tg=tangAt(st,i);
    if(tg){tg.pts.forEach(k=>seen.add(k));out.push([tg.pts[0],tg.c,'',null,tangKind(tg.pts)]);return}
    seen.add(i);
    const c=b0[i];if(!c)return;
    const sk=st.sick&&st.sick[i];
    out.push([i,c,(st.sp&&st.sp[i])||'',sk?[sk.k,sk.left]:null]);
  });
  return out;
}
